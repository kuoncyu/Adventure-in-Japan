}


function buildMainQuestSteps(region){
  let steps = [];
  const first = isFirstRegion(region.id), last = isLastRegion(region.id);
  // 久保田誠「正式登場」只發生一次，且必須早於他的任何台詞：
  //  · 旅程第一區（尚未完成）：登場前不在隊伍中（他的台詞會被守門擋掉），
  //    登場時才入隊。登場位置——該區若有以他為主角的站點（東部吉安）就在該站之前；
  //    該區結尾有他的台詞（中部、南部）就在區域結尾台詞之前；其餘照原設計放在區尾。
  //  · 已完成過第一區（重溫劇情）：視為早已認識，不再重演登場，直接入隊。
  const ksFirstRun = first && !state.regionDone[region.id];
  if (first){
    const ki = state.party.indexOf("keshian");
    if (ksFirstRun){ if (ki >= 0) state.party.splice(ki,1); }
    else if (ki < 0) state.party.push("keshian");
  }
  const ksStopIdx = ksFirstRun ? region.stops.findIndex(st => st.npcName === "久保田誠") : -1;
  const ksClosingHas = ksFirstRun && (region.closing||[]).some(l => /@keshian@/.test(l));
  const ksMode = !ksFirstRun ? "" : (ksStopIdx >= 0 ? "stop" : (ksClosingHas ? "beforeClosing" : "end"));
  const ksIntroSteps = () => {
    if (state.party.indexOf("keshian") === -1) state.party.push("keshian");
    return linesToSteps(JOURNEY.firstClosing, MENTOR);
  };
  // 開場：旅程起點／終點的框架台詞 + 該區本身的介紹（未入隊夥伴不發言）
  let openLines = [];
  if (first) openLines = openLines.concat(JOURNEY.firstOpening(region));
  if (last)  openLines = openLines.concat(JOURNEY.lastOpening);
  const regOpen = filterCastLines(region.opening, region).slice();
  if (first && region.id === "east" && regOpen.length){
    regOpen[0] = "阿蘇的火山風從外輪山一路吹下草原——你聽見了嗎？那是你從小聽到大的風聲。";   // 家鄉不需要「翻過中央山脈」
  }
  openLines = openLines.concat(regOpen);
  const opening = linesToSteps(openLines, MENTOR);
  const regionBg = REGION_BG[region.id] || "field";
  if (opening.length){ opening[0].scene = region.stops&&region.stops[0]?region.stops[0].sceneEmoji:"🧭"; opening[0].label = region.title; opening[0].bg = regionBg; }
  steps = steps.concat(opening);
  steps.push(pline("greet", {region: region.name}));
  // 主角群：進入本區主線時，先遇見本區的主角群同伴（依關係互動），再一起上路
  steps = steps.concat(buildMainCastGreetSteps(region));
  const ctx = {bg: regionBg};
  region.stops.forEach((stop, stopIdx) => {
    if (ksMode === "stop" && stopIdx === ksStopIdx) steps = steps.concat(ksIntroSteps());
    steps = steps.concat(buildStopSteps(stop, region, ctx));
    steps = steps.concat(buildMainCastStopBanter(region, stopIdx));
  });
  // 同伴臨別前的託付（見 PLAYER_MAIN_SCRIPTS 的 errand）：走完本區各站後回報結果
  const errandLines = playerRegionScript(region.id, "errand");
  if (errandLines) steps = steps.concat(scriptToSteps(errandLines));
  // 結尾：該區夥伴入隊 → 跟本區主角群同伴道別 →（第一區）久保田誠正式登場自我介紹 →（最後一區）全隊大結局
  const ksBeforeClosing = (ksMode === "beforeClosing") ? ksIntroSteps() : [];
  const regionCloseSteps = linesToSteps(filterCastLines(region.closing, region), MENTOR);
  const farewellSteps = buildMainCastFarewellSteps(region);
  let journeyCloseSteps = [];
  if (ksMode === "end") journeyCloseSteps = journeyCloseSteps.concat(ksIntroSteps());
  if (last) journeyCloseSteps = journeyCloseSteps.concat(linesToSteps(JOURNEY.lastClosing, MENTOR));
  const closing = regionCloseSteps.concat(farewellSteps).concat(journeyCloseSteps);
  if (closing.length){ closing[0].scene = "🧭"; closing[0].label = region.title+"・完"; closing[0].bg = regionBg; }
  steps = steps.concat(ksBeforeClosing);
  steps = steps.concat(closing);
  steps.push(pline("clear", {region: region.name, last: last}));
  const nxt = nextRegionName(region.id);
  if (nxt){
    steps.push({type:"line", speaker:MENTOR.name, icon:MENTOR.icon,
      text:"羅盤的指針，已經轉向「"+nxt+"」了。走吧，"+playerName()+"。"});
  } else {
    steps.push({type:"line", speaker:MENTOR.name, icon:MENTOR.icon,
      text:"所有的記憶，都被你一一拾起了。"+playerName()+"，你已經是真正的拾憶者了。"});
  }
  return steps;
}

function playSequence(steps, onDone){
  dlgSteps = steps; dlgIdx = -1; dlgOnDone = onDone;
  dlgCurScene = "🌫️"; dlgCurLabel = ""; curSceneBg = null;
  if (curTopbarSceneName !== null){ curTopbarSceneName = null; renderTopbar(); }
  const bgEl = dlgSceneBgEl(); if (bgEl) bgEl.classList.remove("on");
  showScreen("dialogue");
  nextDlgStep();
}

function nextDlgStep(){
  dlgIdx++;
  if (dlgIdx >= dlgSteps.length){
    const cb = dlgOnDone; dlgOnDone=null;
    if (cb) cb();
    return;
  }
  const step = dlgSteps[dlgIdx];
  if (step.sfx) sfx(step.sfx); else if (dlgIdx > 0) sfx("page");
  if (step.bg !== undefined) setSceneBg(step.bg);
  if (step.scene){ dlgCurScene = step.scene; }
  if (step.label){ dlgCurLabel = step.label; }
  // 場景上的重複篇章標題徽章已移除，篇章標題僅顯示於頂部列(topbar-chapter)
  updateStageVisual(step.type==="line" ? step.speaker : (step.type==="quiz" ? step.npcName : null));

  if (step.type === "line"){
    dlgChoicesEl().classList.add("hidden"); dlgChoicesEl().innerHTML="";
    dlgBoxEl().classList.remove("hidden");
    renderTyping(step.speaker, step.icon, step.text);
  } else if (step.type === "quiz"){
    renderQuiz(step);
  }
}

function updateStageVisual(speakerName){
  const stage = dlgSceneEmojiEl();
  const art = speakerName ? artFor(speakerName) : null;
  if (art){
    stage.innerHTML = '<img class="stage-portrait" src="'+art.full+'" alt="'+escapeHtml(speakerName)+'">';
  } else if (speakerName && isPlayerSpeaker(speakerName)){
    stage.innerHTML = "";
    stage.textContent = playerIcon();
  } else {
    // 背景已有場景插畫，旁白時不再疊加裝飾用表情符號圖示
    stage.innerHTML = "";
    stage.textContent = "";
  }
}

function renderTyping(speaker, icon, text){
  const art = artFor(speaker);
  const mine = isPlayerSpeaker(speaker);
  const isNarration = (speaker === "旁白");
  dlgBoxEl().classList.toggle("player", !!mine);
  dlgBoxEl().classList.toggle("narration", isNarration);
  dlgSpeakerEl().innerHTML = isNarration ? "" : ((art ? '<img class="sp-face" src="'+art.face+'">' : (icon?icon+" ":"")) + escapeHtml(speaker));
  const el = dlgTextEl();
  el.textContent = "";
  dlgTapHintEl().style.visibility = "hidden";
  if (typing) clearInterval(typing);
  let i = 0, tick = 0;
  const full = text;
  typing = setInterval(()=>{
    i += 2; tick++;
    if (tick % 4 === 0) sfx("type");
    if (i >= full.length){
      el.textContent = full;
      clearInterval(typing); typing=null;
      dlgTapHintEl().style.visibility = "visible";
    } else {
      el.textContent = full.slice(0,i);
    }
  }, 16);
}

function skipOrAdvance(){
  if (typing){
    clearInterval(typing); typing=null;
    const step = dlgSteps[dlgIdx];
    if (step && step.type==="line"){ dlgTextEl().textContent = step.text; dlgTapHintEl().style.visibility="visible"; }
    return;
  }
  const step = dlgSteps[dlgIdx];
  if (step && step.type==="quiz") return; // 測驗中不可用點擊跳過
  nextDlgStep();
}
document.getElementById("dlg-box").addEventListener("click", skipOrAdvance);
document.querySelector(".dlg-stage").addEventListener("click", skipOrAdvance);

function renderQuiz(step){
  dlgBoxEl().classList.remove("hidden");
  dlgBoxEl().classList.remove("player");
  const qArt = artFor(step.npcName);
  dlgSpeakerEl().innerHTML = (qArt ? '<img class="sp-face" src="'+qArt.face+'">' : (step.npcIcon?step.npcIcon+" ":"🌀 ")) + "記憶考驗"
    + ((step.isChallenge && challengeRun) ? '<span style="font-size:.78rem;margin-left:8px;opacity:.85;">已作答 '+challengeRun.answered+'・未作答 '+(challengeRun.total-challengeRun.answered)+'</span>' : "");
  if (step.isChallenge && challengeRun) updateChallengeHud();
  dlgTextEl().textContent = step.quiz.q;
  dlgTapHintEl().style.visibility = "hidden";
  const box = dlgChoicesEl();
  box.classList.remove("hidden");
  box.innerHTML = "";
  const fbDiv = document.createElement("div");

  // ---- 選項隨機排序：每次作答（含重答）正確答案的位置都不一樣 ----
  const order = step.quiz.opts.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }

  order.forEach(origIdx => {
    const btn = document.createElement("button");
    btn.className = "dlg-choice-btn";
    btn.textContent = step.quiz.opts[origIdx];
    btn.dataset.orig = String(origIdx);
    btn.addEventListener("click", () => {
      if (btn.dataset.locked) return;
      Array.from(box.querySelectorAll(".dlg-choice-btn")).forEach(b=>b.dataset.locked="1");
      const isCorrect = (origIdx === step.quiz.correct);
      if (step.isChallenge && challengeRun){ challengeRun.answered++; }
      if (isCorrect){
        btn.style.background = "#d9ecd9"; btn.style.borderColor="#4f7a63";
        sfx("correct");
        if (step.isChallenge){ challengeScore++; }
        else {
          const isNew = !state.discovered[step.placeId];
          markDiscovered(step.placeId, true);
          if (isNew){ sfx("discover"); toast("✦ 記憶結晶已獲得："+placesData[step.placeId].n); }
        }
        showFeedback(step.quiz.rightFb, true, step);
      } else {
        btn.style.background = "#f3d9d3"; btn.style.borderColor="#a13d2e";
        sfx("wrong");
        if (step.isChallenge){
          const correctBtn = Array.from(box.querySelectorAll(".dlg-choice-btn"))
            .find(b => b.dataset.orig === String(step.quiz.correct));
          if (correctBtn){ correctBtn.style.background = "#d9ecd9"; correctBtn.style.borderColor="#4f7a63"; }
          showFeedback(step.quiz.wrongFb+"（正確答案：「"+step.quiz.opts[step.quiz.correct]+"」）", true, step);
        } else {
          showFeedback(step.quiz.wrongFb, false, step);
        }
      }
    });
    box.appendChild(btn);
  });
  box.appendChild(fbDiv);

  function showFeedback(text, allowContinue, stepRef){
    if (stepRef && stepRef.isChallenge) updateChallengeHud();
    fbDiv.className = "quiz-fb";
    fbDiv.style.marginTop="10px";
    fbDiv.textContent = text;
    if (allowContinue){
      const cont = document.createElement("button");
      cont.className = "brass-btn small"; cont.style.marginTop="10px";
      cont.textContent = "繼續 ▸";
      cont.addEventListener("click", ()=>{ sfx("click"); box.classList.add("hidden"); box.innerHTML=""; nextDlgStep(); });
      box.appendChild(cont);
    } else {
      const retry = document.createElement("button");
      retry.className = "brass-btn ghost small"; retry.style.marginTop="10px";
      retry.textContent = "再想想 ▸";
      retry.addEventListener("click", ()=>{ sfx("click"); renderQuiz(stepRef); });
      box.appendChild(retry);
    }
  }
}

      if (region.extraCompanion && state.party.indexOf(region.extraCompanion)===-1) state.party.push(region.extraCompanion);

// ---------- 都道府縣任務鏈（主線任務鏈／支線任務）對話 ----------
function buildChainSteps(chain){
  const persona = {name: chain.stops[0].npcName, icon: chain.stops[0].npcIcon};
  let steps = [];
  const chainBg = stopScene(chain.stops[0]);
  const openText = stripPrefix(chain.opening, persona.name);
  steps.push({type:"line", speaker:persona.name, icon:persona.icon, text:openText, scene:persona.icon, label:chain.title, bg:chainBg});
  const firstPlace = placesData[chain.stops[0].placeId];
  steps.push(pline("arrive", {place: firstPlace ? firstPlace.n : "這裡"}));
  let lastBg = chainBg;
  chain.stops.forEach(stop => {
    const sc = stopScene(stop);
    if (sc !== lastBg){
      lastBg = sc;
      const nar = sceneNarration(sc, stop.placeId);
      if (nar){ nar.scene = stop.sceneEmoji; steps.push(nar); }
    }
    stop.pages.forEach((pg,i) => {
      const s = {type:"line", speaker:stop.npcName, icon:stop.npcIcon, text:pg};
      if (i===0){ s.scene = stop.sceneEmoji; s.bg = sc; }
      steps.push(s);
    });
    const placeInfo = placesData[stop.placeId];
    const pctx = {place: placeInfo ? placeInfo.n : "這裡"};
    steps.push(pline("curious", pctx));
    steps.push({type:"quiz", quiz:stop.quiz, placeId:stop.placeId, npcName:stop.npcName, npcIcon:stop.npcIcon});
    steps.push(pline("right", pctx));
  });
  const closeText = stripPrefix(chain.closing, persona.name);
  steps.push({type:"line", speaker:persona.name, icon:persona.icon, text:closeText});
  return steps;
}

// 建立「初次遇見該都道府縣在地嚮導」的見面之詞與自我介紹對話，
// 讓嚮導的登場不會顯得太唐突。之後再進入同一都道府縣就不會重複播放。
// 每個都道府縣的開場情境、嚮導初次搭話、對「霧」的在地描述、與臨別台詞
// 都取自 GUIDE_MEET_DATA，讓 22 位嚮導的登場各有各的味道，
// 不再是套版的「灰霧變濃了」。找不到專屬資料時才退回通用版本。
function buildGuideMeetSteps(gk){
  const g = COUNTY_GUIDES[gk];
  if (!g) return [];
  const name = playerName(), icon = playerIcon();
  const m = GUIDE_MEET_DATA[gk] || {};
  const scene = m.scene || ("羅盤的指針在踏入"+g.county+"的那一刻，忽然轉得又急又快——這裡的灰霧似乎比其他地方更濃一些。");
  const notice = m.notice || "喂、喂！你手上那個一直轉的東西……是羅盤吧？我還沒看過它轉得這麼兇的。";
  const fogIntro = m.fogIntro || ("忘名妖……難怪。這陣子"+g.county+"這一帶的灰霧真的變濃了，連老一輩講的古早地名都開始被講得亂七八糟。我叫");
  const closing = m.closing || "別客氣，走吧——趁灰霧還沒把故事全吃掉之前，我們把它們一個一個找回來。";
  return [
    {type:"line", speaker:"旁白", text:scene, scene:g.icon},
    {type:"line", speaker:g.name, icon:g.icon, text:notice},
    {type:"line", speaker:name, icon:icon, isPlayer:true,
      text:"你認得羅盤？我是"+name+"，正在幫忙找回被忘名妖弄亂的地名記憶。"},
    {type:"line", speaker:g.name, icon:g.icon,
      text:fogIntro+g.name+"，大家都叫我「"+g.title+"」。"},
    {type:"line", speaker:g.name, icon:g.icon, text:g.desc},
    {type:"line", speaker:name, icon:icon, isPlayer:true,
      text:"那真是太好了——你願意帶我認識這裡的地方嗎？我對"+g.county+"還不太熟。"},
    {type:"line", speaker:g.name, icon:g.icon,
      text:"當然沒問題！這裡的路我熟得很，地名背後藏著什麼故事、哪些說法是忘名妖亂編的，我大概都能分辨一二。"},
    {type:"line", speaker:name, icon:icon, isPlayer:true,
      text:"那就拜託你了，"+g.name+"。"},
    {type:"line", speaker:g.name, icon:g.icon, text:closing}
  ];
}

function playChain(county, kind, idx){
  setBgmRegion(regionOf[county]);
  const cc = COUNTY_CONTENT[county];
  if (!cc) return;
  const chain = (kind==="main" ? cc.mainChains : cc.sideQuests)[idx];
  if (!chain) return;
  // 首次遇到該都道府縣的在地嚮導：先播放一段見面之詞與自我介紹，再進入本次劇情，
  // 播放結束後才記錄進圖鑑並提示玩家（避免登場太唐突）；已認識過的嚮導則不再重複。
  const gk = COUNTY_TO_GUIDE[county];
  const isFirstGuideMeet = !!(gk && !state.metGuides[gk]);
  setChapterLabel(chain.title);
  let steps = buildChainSteps(chain);
  if (isFirstGuideMeet){
    steps = buildGuideMeetSteps(gk).concat(steps);
  }
  playSequence(steps, () => {
    if (isFirstGuideMeet){
      state.metGuides[gk] = true;
      const g = COUNTY_GUIDES[gk];
      toast("🧭 認識了新的在地嚮導：" + g.name + "（" + g.county + "）");
    }
    setChapterLabel("");
    renderCountyScreen(county);
    showScreen("county");
  });
}

const REGION_LABEL_POS = {"north":{"x":240,"y":95},"central":{"x":540,"y":395},"south":{"x":200,"y":235},"east":{"x":88,"y":330},"island":{"x":533,"y":500}};
const _REGION_LABEL_POS_UNUSED = {
  north:   {x:615, y:15},
  central: {x:268, y:258},
  south:   {x:248, y:478},
  east:    {x:630, y:345},
  island:  {x:130, y:284}

// ---------------------------------------------------------------------
// 離島比例規則
//  · 本圖主比例尺 = MAIN_PX_PER_KM（由本島南北長度換算）。澎湖、龜山島、綠島、蘭嶼、小蘭嶼、小琉球
//    一律依此比例尺繪製（原本的綠島／蘭嶼／小琉球／龜山島被放大約 4.5 倍，這裡依真實面積縮回）。
//  · 金門、馬祖若依此比例會小到點不到，所以改放在「方框」裡放大顯示，
//    每個方框都有自己的比例尺與放大倍率，避免誤以為它們有那麼大。
// ---------------------------------------------------------------------
const MAIN_PX_PER_KM = 1.824;
const ISLAND_TRUE_SCALE = { "龜山島":0.204, "蘭嶼":0.222, "綠島":0.215, "小蘭嶼":0.218, "小琉球":0.223 };
const ISLAND_INSETS = {};
const OKINAWA_INSET = {"x":418,"y":506,"w":230,"h":194};
const _ISLAND_INSETS_UNUSED = {
  "連江縣": { title:"馬祖（連江縣）", x:8,   y:8, w:237, h:224, pxPerKm:3.6,   scaleKm:20,
             labels:{ "南竿":["南竿","below"], "北竿":["北竿","above"], "東引":["東引","above"], "東莒":["東莒","right"], "西莒":["西莒","above"] } },
  "金門縣": { title:"金門縣",       x:253, y:8, w:182, h:148, pxPerKm:6.108, scaleKm:10,
             labels:{ "金門本島":["金門","above"], "烈嶼（小金門）":["烈嶼","above"] } }
};
function ptsToArr(pts){ return pts.trim().split(/\s+/).map(q=>q.split(",").map(Number)); }
function arrToPts(a){ return a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "); }
function arrBBox(a){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  a.forEach(p=>{ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; });
  return {x0,y0,x1,y1,cx:(x0+x1)/2,cy:(y0+y1)/2};
}
const _trueIslandCache = {};
function trueScaledIsland(isl){
  if (_trueIslandCache[isl.name]) return _trueIslandCache[isl.name];
  const f = ISLAND_TRUE_SCALE[isl.name] || 1;
  const a = ptsToArr(isl.pts), b = arrBBox(a);
  const na = a.map(p=>[b.cx+(p[0]-b.cx)*f, b.cy+(p[1]-b.cy)*f]);
  return (_trueIslandCache[isl.name] = { pts:arrToPts(na), bbox:arrBBox(na), name:isl.name });
}
function countyPolys(countyName){
  const c = countyMapData[countyName];
  if (!c) return [];
  const list = [];
  if (c.pts) list.push(c.pts);
  if (c.shapes && !ISLAND_INSETS[countyName]) c.shapes.forEach(s=>list.push(s.pts));
  if (c.extraIslands) c.extraIslands.forEach(s=>list.push(trueScaledIsland(s).pts));
  return list;
}
function svgEl(ns, tag, attrs){
  const e = document.createElementNS(ns, tag);
  Object.keys(attrs||{}).forEach(k=>e.setAttribute(k, attrs[k]));
  return e;
}
function svgText(ns, x, y, text, size, anchor, extra){
  const t = svgEl(ns,"text",Object.assign({x:x, y:y, "font-size":size, "text-anchor":anchor||"middle", fill:"#fdf3da",
    "fill-opacity":"1", "stroke-opacity":"1", "paint-order":"stroke", stroke:"#1c2a2e", "stroke-width":"2.2", "pointer-events":"none"}, extra||{}));
  t.textContent = text;
  return t;
}
// 比例尺：長度 km → 像素，畫在 (x,y) 開始的位置
function drawScaleBar(ns, parent, x, y, km, pxPerKm, color){
  const L = km*pxPerKm, c = color || "#fdf3da";
  parent.appendChild(svgEl(ns,"path",{d:"M"+x+","+(y-4)+" V"+y+" H"+(x+L)+" V"+(y-4)+" M"+(x+L/2)+","+(y-3)+" V"+y,
    fill:"none", stroke:c, "stroke-width":"1.4", "pointer-events":"none"}));
  parent.appendChild(svgText(ns, x, y+10, "0", 8, "middle"));
  parent.appendChild(svgText(ns, x+L, y+10, km+" km", 8, "middle"));
}
// 方框放大圖：金門、馬祖
function drawInset(ns, g, cname){
  const cfg = ISLAND_INSETS[cname], c = countyMapData[cname];
  const k = cfg.pxPerKm / c.pxPerKm;
  const shapes = c.shapes.map(s=>({name:s.name, a:ptsToArr(s.pts)}));
  const all = []; shapes.forEach(s=>s.a.forEach(p=>all.push(p)));
  const bb = arrBBox(all);
  const ox = cfg.x + (cfg.w - (bb.x1-bb.x0)*k)/2, oy = cfg.y + 26;
  const tx = p => [ox + (p[0]-bb.x0)*k, oy + (p[1]-bb.y0)*k];
  g.appendChild(svgEl(ns,"rect",{x:cfg.x, y:cfg.y, width:cfg.w, height:cfg.h, rx:5, fill:"#fdf3da", "fill-opacity":"0.10",
    stroke:"#fdf3da", "stroke-width":"1.3", "stroke-dasharray":"5 3", "stroke-opacity":"0.9"}));
  const mag = (cfg.pxPerKm / MAIN_PX_PER_KM);
  g.appendChild(svgText(ns, cfg.x+8, cfg.y+16, cfg.title+"・放大約 "+(mag<10?mag.toFixed(1).replace(/\.0$/,""):Math.round(mag))+" 倍", 10, "start", {"font-weight":"700"}));
  shapes.forEach(sh=>{
    const na = sh.a.map(tx);
    const poly = svgEl(ns,"polygon",{points:arrToPts(na), "class":"shape"});
    g.appendChild(poly);
    const lab = cfg.labels[sh.name];
    if (lab){
      const b = arrBBox(na);
      let x=b.cx, y=b.y0-3, anchor="middle";
      if (lab[1]==="below"){ y=b.y1+9; }
      else if (lab[1]==="right"){ x=b.x1+3; y=b.cy+3; anchor="start"; }
      g.appendChild(svgText(ns, x, y, lab[0], 8, anchor));
    }
  });
  drawScaleBar(ns, g, cfg.x+10, cfg.y+cfg.h-16, cfg.scaleKm, cfg.pxPerKm);
}

function renderWorldMap(){
  const svg = document.getElementById("worldmap");
  svg.innerHTML = "";
  const ns = "http://www.w3.org/2000/svg";

  REGIONS.forEach(region=>{
    const unlocked = isRegionUnlocked(region.id);
    const done = !!state.regionDone[region.id];
    const g = document.createElementNS(ns,"g");
    g.setAttribute("class","region-node"+(unlocked?"":" locked"));
    g.setAttribute("fill", `var(--${region.color})`);
    g.setAttribute("fill-opacity", done?"0.88":"0.58");
    g.setAttribute("stroke","#fdf3da");
    g.setAttribute("stroke-width","1");
    g.setAttribute("stroke-opacity","0.55");
    g.setAttribute("stroke-linejoin","round");

    if (region.id === "island"){
      g.appendChild(svgEl(ns,"rect",{x:OKINAWA_INSET.x, y:OKINAWA_INSET.y, width:OKINAWA_INSET.w, height:OKINAWA_INSET.h, rx:5, fill:"#fdf3da", "fill-opacity":"0.10", stroke:"#fdf3da", "stroke-width":"1.3", "stroke-dasharray":"5 3", "stroke-opacity":"0.9"}));
      g.appendChild(svgText(ns, OKINAWA_INSET.x+8, OKINAWA_INSET.y+16, "沖繩縣（放大約 1.5 倍）", 10, "start", {"font-weight":"700"}));
    }
    region.counties.forEach(cname=>{
      if (ISLAND_INSETS[cname]){ drawInset(ns, g, cname); return; }
      countyPolys(cname).forEach(pts=>{
        const poly = document.createElementNS(ns,"polygon");
        poly.setAttribute("points", pts);
        poly.setAttribute("class","shape");
        g.appendChild(poly);
      });
      // 依真實比例縮小後的小島名稱標籤（澎湖、龜山島、綠島、蘭嶼、小琉球）
      const cd = countyMapData[cname];
      if (cname === "澎湖縣" && cd && cd.pts){
        const b = arrBBox(ptsToArr(cd.pts));
        g.appendChild(svgText(ns, b.cx, b.y1+11, "澎湖", 9, "middle"));
      }
      (cd && cd.extraIslands || []).forEach(isl=>{
        if (isl.name === "小蘭嶼") return;
        const b = trueScaledIsland(isl).bbox;
        if (isl.name === "小琉球" || isl.name === "龜山島") g.appendChild(svgText(ns, b.x0-3, b.cy+3, isl.name, 8, "end"));
        else g.appendChild(svgText(ns, b.x1+3, b.cy+3, isl.name, 8, "start"));
      });
    });

    const lp = REGION_LABEL_POS[region.id];
    const label = document.createElementNS(ns,"text");
    label.setAttribute("x", lp.x); label.setAttribute("y", lp.y);
    label.setAttribute("class","region-label"); label.setAttribute("text-anchor","middle");
    label.textContent = (unlocked? region.name : "🔒 "+region.name);
    g.appendChild(label);

    const stat = regionStats(region);
    const sub = document.createElementNS(ns,"text");
    sub.setAttribute("x", lp.x); sub.setAttribute("y", lp.y+15);
    sub.setAttribute("class","region-sub"); sub.setAttribute("text-anchor","middle");
    sub.textContent = unlocked ? (stat.done+"/"+stat.total+(done?" ✓":"")) : "尚未解鎖";
    g.appendChild(sub);

    if (unlocked){
      g.addEventListener("click", ()=>{ sfx("click"); renderRegionScreen(region.id); showScreen("region"); });
    } else {
      g.addEventListener("click", ()=>{ toast("🔒 尚未解鎖，請先完成前一段旅程的主線劇情"); });
    }
    svg.appendChild(g);
  });

  // 本圖主比例尺
  const sc = svgEl(ns,"g",{"pointer-events":"none"});
  sc.appendChild(svgText(ns, 14, 668, "本州、北海道、四國、九州依同一比例繪製", 8, "start"));
  sc.appendChild(svgText(ns, 14, 680, "沖繩縣以方框放大顯示（約 1.5 倍），並非實際位置", 8, "start"));
  /* scale bar omitted */
  svg.appendChild(sc);

  // legend
  const legend = document.getElementById("worldmap-legend");
  legend.innerHTML = "";
  REGIONS.forEach(r=>{
    const chip = document.createElement("div");
    chip.className = "legend-chip";
    chip.innerHTML = '<span class="legend-dot" style="background:var(--'+r.color+')"></span>'+r.name;
    legend.appendChild(chip);
  });

  renderPartyRow(document.getElementById("party-row"));
}

// ---------- 存讀檔 ----------
function serializeSave(){
  const payload = {
    v:2, playerName:state.playerName, charKey:state.charKey, gender:state.gender, homeRegion:state.homeRegion,
    discovered:Object.keys(state.discovered).map(Number),
    loreScore:state.loreScore, regionDone:state.regionDone, party:state.party, seenIntro:state.seenIntro,
    challengeBest:state.challengeBest, challengeBestBy:state.challengeBestBy, challengeBoards:state.challengeBoards, challengeSeq:state.challengeSeq, metGuides:state.metGuides, metProtagonists:state.metProtagonists
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function loadSaveCode(code){
  try{
    const payload = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    state.playerName = payload.playerName || "旅人";
    state.charKey = payload.charKey || null;
    state.gender = payload.gender || null;
    state.homeRegion = payload.homeRegion || (state.charKey && CHAR_BY_KEY[state.charKey] ? CHAR_BY_KEY[state.charKey].region : "north");
    state.discovered = {}; (payload.discovered||[]).forEach(id=>state.discovered[id]=true);
    state.loreScore = payload.loreScore||0;
    state.regionDone = payload.regionDone||{};
    state.party = payload.party||[];
    state.seenIntro = !!payload.seenIntro;
    state.challengeBest = payload.challengeBest||0;
    state.challengeBestBy = payload.challengeBestBy || {};
    if (!state.challengeBestBy[10] && state.challengeBest) state.challengeBestBy[10] = state.challengeBest;   // 舊存檔：原本只有 10 題
    state.challengeBoards = payload.challengeBoards || {};
    state.challengeSeq = payload.challengeSeq || 0;
    state.metGuides = payload.metGuides||{};
    state.metProtagonists = payload.metProtagonists||{};
    return true;
  }catch(e){ return false; }
}

// ---------- 本地保存進度 (localStorage) ----------
const LOCAL_SAVE_KEY = "twlp-rpg-localsave-v1";
const RESOURCE_CACHE_DB = "resource-pack-cache";
function saveLocalProgress(){
  try{ localStorage.setItem(LOCAL_SAVE_KEY, serializeSave()); return true; }
  catch(e){ return false; }
}
function hasLocalProgress(){
  try{ return !!localStorage.getItem(LOCAL_SAVE_KEY); }
  catch(e){ return false; }
}
function loadLocalProgress(){
  try{
    const code = localStorage.getItem(LOCAL_SAVE_KEY);
    return code ? loadSaveCode(code) : false;
  }catch(e){ return false; }
}
function clearLocalProgress(){
  try{ localStorage.removeItem(LOCAL_SAVE_KEY); return true; }
  catch(e){ return false; }
}
function clearResourceCache(){
  return new Promise((resolve)=>{
    try{
      if (!("indexedDB" in window)) { resolve(false); return; }
      const req = indexedDB.deleteDatabase(RESOURCE_CACHE_DB);
      req.onsuccess = ()=>resolve(true);
      req.onerror = ()=>resolve(false);
      req.onblocked = ()=>resolve(true);
    }catch(e){ resolve(false); }
  });
}
function autosave(){
  // 只有在玩家已經選定主角、旅程已開始之後才自動保存
  if (state && state.charKey) saveLocalProgress();
}
function refreshContinueButton(){
  const cBtn = document.getElementById("btn-continue");
  const sBtn = document.getElementById("btn-start-new");
  if (!cBtn || !sBtn) return;
  if (hasLocalProgress()){
    cBtn.style.display = "";
    sBtn.classList.add("ghost","small");
    sBtn.textContent = "開始新旅程";
  } else {
    cBtn.style.display = "none";
    sBtn.classList.remove("ghost","small");
    sBtn.textContent = "開始旅程";
  }
}

const CHALLENGE_COUNTS = [10, 20, 50, 100];
let challengeSel = 10;      // 目前選擇的挑戰題數（同時決定顯示哪一張排行榜）
let challengeRun = null;    // 進行中的挑戰：{total, answered, startedAt, timer}

function challengePool(useFull){
  return (useFull ? placesData.slice() : placesData.filter(p=>state.discovered[p.id])).filter(p=>QUIZ_BY_PLACEID[p.id]);
}
// 完成時間以「0.1 秒」為單位（整數），同一單位視為同時間
function fmtDeci(deci){
  const d = deci % 10, secs = Math.floor(deci/10), m = Math.floor(secs/60), ss = secs % 60;
  return m + ":" + (ss<10?"0":"") + ss + "." + d;
}
// 排序：①答對率高者在前（同一張榜題數相同，即答對題數多者在前）
//       ②答對率相同 → 完成時間短者在前
//       ③時間也相同 → 先達成紀錄者（時間較早、流水號較小）在前
function sortBoard(list){
  return list.sort((x,y)=> (y.score-x.score) || (x.deci-y.deci) || (x.at-y.at) || (x.seq-y.seq));
}
function stopChallengeTimer(){
  if (challengeRun && challengeRun.timer){ clearInterval(challengeRun.timer); challengeRun.timer = null; }
}
function challengeHudText(){
  if (!challengeRun) return "";
  const a = challengeRun.answered, n = challengeRun.total;
  const deci = Math.round((Date.now()-challengeRun.startedAt)/100);
  return "🏆 自由挑戰 "+n+" 題｜已作答 "+a+"／未作答 "+(n-a)+"｜答對 "+challengeScore+"｜⏱ "+fmtDeci(deci);
}

  }).join("");
  body.innerHTML =
    '<div class="paper-panel" style="padding:20px;">'+
    '<div class="detail-title">'+(fullUnlocked?'🎉 全部地名已收錄':'🧭 已解鎖地區隨機測驗')+'</div>'+
    '<div class="detail-body">'+bodyText+'</div>'+
    '<div style="margin-top:12px;font-weight:bold;">選擇挑戰題數</div>'+
    '<div id="challenge-count-row" style="margin-top:6px;">'+chips+'</div>'+
    '<div class="detail-body" style="margin-top:8px;">'+challengeSel+' 題歷史最高分：<b>'+bestBy+'</b> / '+challengeSel+'</div>'+
    '<button class="brass-btn" id="btn-start-challenge" style="margin-top:12px;">🏆 開始挑戰（'+challengeSel+' 題）</button>'+
    '</div>'+
    '<div class="paper-panel" style="padding:16px;margin-top:12px;">'+
    '<div class="detail-title">🏅 '+challengeSel+' 題排行榜</div>'+
    '<div style="font-size:.74rem;color:#7a6a4a;margin:2px 0 8px;">排序依序為：①答對率越高越前面 ②答對率相同則完成時間越快越前面 ③時間也相同則先達成紀錄者在前。各題數榜單分開計算，記錄保存於本機存檔。</div>'+
    (rows
      ? '<table style="width:100%;border-collapse:collapse;font-size:.86rem;"><thead><tr style="color:#7a6a4a;font-size:.74rem;">'+
        '<th>名次</th><th style="text-align:left;">玩家</th><th>答對率</th><th style="text-align:right;">完成時間</th><th style="text-align:left;">日期</th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<div class="detail-body" style="color:#7a6a4a;">這個題數還沒有紀錄，成為第一位上榜的人吧！</div>')+
    '</div>';
  Array.from(body.querySelectorAll("#challenge-count-row button[data-n]")).forEach(btn=>{
    btn.onclick = () => { if (btn.disabled) return; sfx("click"); challengeSel = Number(btn.dataset.n); renderChallengeScreen(); };
  });
  document.getElementById("btn-start-challenge").onclick = () => startChallenge(fullUnlocked, challengeSel);
}

function startChallenge(useFullPool, n){
  setBgmRegion(null);
  n = n || challengeSel || 10;
  const pool = challengePool(useFullPool);
  if (pool.length === 0){ toast("目前還沒有已探索過的地名，先去旅程裡蒐集幾則吧！"); return; }
  if (pool.length < n){ toast("可抽題的地名不足 "+n+" 則，請先選擇較少的題數。"); return; }
  for (let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  const picks = pool.slice(0,n);
  challengeScore = 0;
  stopChallengeTimer();
  challengeRun = { total:n, answered:0, startedAt:Date.now(), timer:null };
  const run = challengeRun;
  run.timer = setInterval(()=>{
    const scr = document.getElementById("screen-dialogue");
    if (challengeRun !== run || !scr || scr.classList.contains("hidden")){ clearInterval(run.timer); run.timer = null; return; }
    const el = document.getElementById("topbar-chapter");
    if (el) el.textContent = challengeHudText();
  }, 200);
  const steps = picks.map((p,idx)=>{
    const qinfo = QUIZ_BY_PLACEID[p.id];
    return { type:"quiz", quiz:qinfo.quiz, placeId:p.id, npcName:qinfo.npcName, npcIcon:qinfo.npcIcon,
             isChallenge:true, scene:"🏆", label:"自由挑戰・第 "+(idx+1)+" 題／"+n };
  });
  playSequence(steps, () => {
    stopChallengeTimer();
    const deci = Math.max(1, Math.round((Date.now()-run.startedAt)/100));
    challengeRun = null;
    setChapterLabel("");
    // 紀錄：每個題數各自一張榜；同時間以 at／seq 判定先後
    state.challengeSeq = (state.challengeSeq||0) + 1;
    const rec = { name:playerName(), charKey:state.charKey, deci:deci, score:challengeScore, at:Date.now(), seq:state.challengeSeq, latest:true };
    state.challengeBoards = state.challengeBoards || {};
    const list = state.challengeBoards[n] = (state.challengeBoards[n]||[]);
    list.forEach(r => { delete r.latest; });
    list.push(rec);
    sortBoard(list);
    const rank = list.indexOf(rec) + 1;
    if (list.length > 50) list.length = 50;
    state.challengeBestBy = state.challengeBestBy || {};
    let newBest = false;
    if (challengeScore > (state.challengeBestBy[n]||0)){ state.challengeBestBy[n] = challengeScore; newBest = true; }
    if (n === 10) state.challengeBest = state.challengeBestBy[10] || 0;
    if (newBest){ sfx("complete"); toast("🎉 締造新紀錄！"); }
    else { sfx(challengeScore >= n*0.6 ? "complete" : "fail"); }
    openModal(
      '<div class="detail-title">🏆 挑戰結束（'+n+' 題）</div>'+
      '<div class="detail-body">答對 <b>'+challengeScore+'</b> / '+n+' 題（未答對 '+(n-challengeScore)+' 題）<br>'+
      '答對率：<b>'+Math.round(challengeScore/n*100)+'%</b>　完成時間：<b>'+fmtDeci(deci)+'</b><br>'+
      (rank<=50 ? '本次名次：<b>第 '+rank+' 名</b>（'+n+' 題榜）<br>' : '這次沒有進入前 50 名。<br>')+
      n+' 題歷史最高分：<b>'+state.challengeBestBy[n]+'</b> / '+n+'</div>'+
      '<button class="brass-btn small" id="challenge-retry-btn" style="margin-top:10px;">再挑戰一次（'+n+' 題）</button>',
      {center:true}
    );
    const back = document.querySelector("#modal-root .modal-back:last-child");
    back.querySelector("#challenge-retry-btn").addEventListener("click", ()=>{ back.remove(); startChallenge(useFullPool, n); });
    challengeSel = n;
    showScreen("challenge"); renderChallengeScreen(); renderTopbar();
    autosave();
  });
}

      '<div id="off-status" style="font-size:.78rem;line-height:1.7"></div>'+
      '<div id="off-bar" style="display:none;height:9px;border-radius:5px;background:rgba(0,0,0,.18);overflow:hidden;margin:6px 0"><div id="off-fill" style="height:100%;width:0;background:var(--jade);transition:width .2s"></div></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="brass-btn small" id="off-dl">⬇ 下載離線資料包</button><button class="brass-btn small ghost" id="off-del">🗑 清除</button></div>'+

// ---------- 全螢幕 ----------
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function enterFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req) return;
  try{
    const p = req.call(el);
    if (p && p.catch) p.catch(()=>{});
  }catch(e){}
}
function exitFullscreen(){
  const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (!ex) return;
  try{
    const p = ex.call(document);
    if (p && p.catch) p.catch(()=>{});
  }catch(e){}
}
function toggleFullscreen(){
  sfx("click");
  if (isFullscreen()){ exitFullscreen(); return; }
  const el = document.documentElement;
  if (!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)){
    toast("此瀏覽器不支援全螢幕功能");
    return;
  }
  enterFullscreen();
}
function syncFullscreenBtn(){
  const fsBtn = document.getElementById("a-fullscreen");
  if (fsBtn) fsBtn.textContent = isFullscreen() ? "🗗 離開全螢幕" : "⛶ 進入全螢幕";
}
["fullscreenchange","webkitfullscreenchange","msfullscreenchange"].forEach(evt=>{
  document.addEventListener(evt, syncFullscreenBtn);
});

  } else {
    goToTitleMenu();
  }
}
