const REGIONS = [{"id":"north","name":"北海道・東北","color":"north","companion":"ahai","title":"北海道・東北篇：雪國之北，阿伊努的名字","desc":"從函館港出發，越過津輕海峽，一路南下到東北——這裡保留了最多阿伊努語的古老地名，也是拾憶者旅程的第一站。","opening":["北海道與東北，是雪與海風一層層寫下來的：阿伊努語的『ナイ』與『ペッ』、蝦夷地的舊稱、開拓使的棋盤街——每一個名字都還鎖在灰霧裡。","小心，這一帶的忘名妖最擅長把阿伊努語的音譯地名，說成隨口編出來的日文笑話。"],"counties":["北海道","青森縣","岩手縣","宮城縣","秋田縣","山形縣","福島縣"],"mapPoly":"0,0","labelPos":{"x":240,"y":95},"stops":[{"placeId":0,"sceneEmoji":"🧭❄️","npcName":"北加伊之魂","npcIcon":"🧭","pages":["旅人，你腳下這片大地，如今叫做『北海道』——可是你知道嗎？在1869年之前，它有另一個名字：『蝦夷地』。","幕末的探險家松浦武四郎，一生多次踏查這片土地，和阿伊努人同吃同住。他發現當地的人們，用一個詞稱呼自己——『カイ』，意思是『生於此地的人』。","明治二年，新政府設立開拓使，要為這片土地取新名字。松浦武四郎提出了『北加伊道』等六個名字，其中的『加伊』，正是取自阿伊努語的『カイ』。","最後政府定名為『北海道』——保留了『北』與『道』，把『加伊』改寫成音近的『海』，也延續了古代『東海道、西海道』以『道』命名的傳統。"],"interference":["呵呵……『北海道』還用問？不就是『北邊的海』嗎？在日本最北邊、四面都是海，所以就叫北海道啦！","北加伊之魂：「又來了，忘名妖！休想用一句『北邊的海』，就抹掉松浦武四郎和阿伊努人留下的痕跡。旅人，把真正的由來說出來，把這團灰霧吹散！」"],"quiz":{"q":"關於『北海道』這個名稱的由來，下列哪一個說法最貼近史實？","opts":["純粹因為它位在日本最北邊、四面環海，明治政府隨口取名而來","松浦武四郎提出「北加伊道」等案，「加伊」取自阿伊努語，1869年（明治二年）定名為「北海道」","因江戶幕府時代這裡是「北方海上警備區」，武士直接命名為北海道","由俄羅斯探險家的地名直接音譯而來"],"correct":1,"rightFb":"沒錯！『北海道』的『海』，是從阿伊努語『カイ（生於此地的人）』改寫而來——這個名字裡，藏著這片土地原住居民的自稱。","wrongFb":"灰霧又濃了一分……北加伊之魂嘆了口氣：「再想想，孩子。這個名字，是有一位探險家和許多阿伊努人一起留下來的。」"},"afterQuiz":["（灰霧散去，雪原恢復清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。","@ahai@（一位滿臉風霜的老漁夫在一旁哈哈大笑）「哈！說得好，臭小子。老頭子我在函館港討海五十年，頭一次聽人把『北海道』的名字講得這麼清楚——要不要讓我這條老骨頭，陪你走一趟北方？」"]},{"placeId":1,"sceneEmoji":"⛵🌊","npcName":"宇須岸爺","npcIcon":"⛵","pages":["少年仔，你知道『函館』這兩個字，是怎麼來的嗎？其實它以前不寫『函』，寫的是『箱館』。","室町時代中期，武將河野政通在這片海灣旁築起一座小城砦，稱作『宇須岸館』。『宇須岸（ウスケシ）』是阿伊努語，一般解為『海灣的盡頭』。","後來因為這座館的形狀方正、像一只箱子，人們便改稱它『箱館』。1854年日美和親條約後，箱館成為最早開港的港口之一。","到了1869年，也就是明治二年，地名的『箱』被改寫成『函』，成了今日的『函館』。"],"interference":["呵呵……『函館』還用問？不就是因為函館山長得像一個大匣子（函）嗎？看山的形狀就知道啦！","宇須岸爺：「又來了，忘名妖！函館山可沒有這個本事，替一座城市取名字。旅人，說出真正的由來吧！」"],"quiz":{"q":"關於『函館』的由來，下列何者才是正確的？","opts":["因函館山的山形像一個函（匣子），先民依外觀直接命名，與城館無關","源自室町時代所築的「宇須岸館」，因形似箱子而稱「箱館」，1869年起改寫為「函館」","因幕末黑船來航時，佩里以英文 Hakodate 的發音直接命名","取自阿伊努語「函」與「館」兩個詞的直接音譯"],"correct":1,"rightFb":"沒錯！從『宇須岸館』到『箱館』再到『函館』——一座城市的名字，其實是一路改寫過來的。","wrongFb":"灰霧又濃了一分……宇須岸爺搖搖頭：「再想想，孩子。這個名字的源頭，是一座館。」"},"afterQuiz":["（灰霧散去，海灣重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"]},{"placeId":2,"sceneEmoji":"🏙️❄️","npcName":"豐平川之魂","npcIcon":"🌊","pages":["旅人，眼前這條河，如今叫做豐平川。可是在阿伊努人的口中，它還有另一個名字……你知道『札幌』是怎麼來的嗎？","『札幌』源自阿伊努語，一般認為出自『サッ・ポロ・ペッ』，意思是『乾涸的大河』，指的是水量時多時少、常常見底的豐平川。另有一說是『サリ・ポロ・ペッ』，意思是『蘆葦叢生的大河』。","有趣的是，『札』與『幌』兩個字，只是借用漢字讀音的當字，字面上並沒有『河』或『乾涸』的意思。","1869年開拓使設立後，開拓判官島義勇來到這裡規劃『本府』，用棋盤式的道路劃分街區——今天札幌方正整齊的街道，就是那時打下的基礎。"],"interference":["呵呵……『札幌』當然是因為開拓使在這裡豎立告示牌（札）和旗幟（幌），才叫這個名字的啊！","豐平川之魂：「又來了，忘名妖！告示牌和旗幟，可沒有這個資格。旅人，說出真正的由來！」"],"quiz":{"q":"關於『札幌』的由來，下列哪一個說法最貼近史實？","opts":["因開拓使在此豎立告示（札）與旗幟（幌），而得名「札幌」","一般認為源自阿伊努語「サッ・ポロ・ペッ（乾涸的大河）」，指豐平川，「札幌」二字只是借音的當字","取自明治天皇賜名，寓意「札札生輝、光幌四方」","由開拓判官島義勇的姓氏「島」改寫而成"],"correct":1,"rightFb":"沒錯！『札幌』這兩個漢字，只是替阿伊努語的聲音『借』來的衣服。","wrongFb":"灰霧又濃了一分……豐平川之魂輕聲說：「再想想，孩子。答案就在河的名字裡。」"},"afterQuiz":["（灰霧散去，河面恢復清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"]},{"sceneEmoji":"⚓🌲","npcName":"津輕港的老領航","npcIcon":"⚓","pages":["津輕海峽的另一頭，就是本州最北端的港口——青森。孩子，你知道這個名字的『青』和『森』，指的是什麼嗎？","四百年前，津輕藩主津輕信枚為了在領內找一個好港口，選中了這一帶。當時這裡只是個叫『善知鳥村』的小漁村。","一般的說法是：港邊有一片青翠的森林，遠遠就能看見，是船隻進港時最好的標記。於是人們稱這個港口為『青森』——『青色的森林』。","不過老頭子也得老實跟你說：森林在哪裡、是不是真的存在，史料並不完整，所以還有別的說法在流傳。這就是地名有趣的地方。"],"interference":["呵呵……『青森』還用問？這裡蘋果那麼多，一定是『青蘋果的森林』啦！","津輕港的老領航：「忘名妖，蘋果可是後來明治時代才種的！旅人，別被牠騙了，說說真正的由來。」"],"quiz":{"q":"關於『青森』這個地名，下列哪一個是一般認為的由來？","opts":["因為當地盛產青蘋果，蘋果園遠看像一片青色的森林","因為港邊有一片青翠的森林，可作為船隻進港時辨認方位的標記，1624年前後定為港名","因為此地是「森氏」家族的領地，加上「青」字以表明地位","因為恐山一帶的森林終年被青色霧氣籠罩"],"correct":1,"rightFb":"沒錯！港口的名字，是船上人看著岸上的森林取的——地名，先是用來『認路』的。","wrongFb":"灰霧又濃了一分……老領航搖搖頭：「再想想，孩子。這個名字，是替『從海上回家的人』取的。」"},"afterQuiz":["（灰霧散去，港灣重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。","@ahai@「哈！說得好，臭小子。海上的人，就是這樣替一個地方取名的——先看得見，才叫得出名字。」"],"placeId":15},{"sceneEmoji":"🪨✋","npcName":"三ツ石的岩神","npcIcon":"🪨","pages":["旅人，看看這三塊巨大的岩石。很久很久以前，這裡發生過一件事，你想聽嗎？","傳說中，盛岡城下有一個為非作歹的羅剎鬼，村民們害怕極了，便來到這三塊岩石前，向神明祈求。神明聽見了，出手把鬼綁在這三塊石頭上。","鬼哭著求饒，保證再也不作惡，並在岩石上按下手印，當作誓約的憑證。人們便把這個地方稱為『岩手』——『岩石上的手』。","這只是傳說，『岩手』的語源另有說法。但你看，先民多麼喜歡用一個故事，替土地取名字。"],"interference":["呵呵……『岩手』就是『有很多岩石的地方』啦，哪來什麼鬼？那不過是哄小孩的故事！","三ツ石的岩神：「你這忘名妖，休想抹掉這個故事。旅人，說出這則傳說的由來！」"],"quiz":{"q":"關於『岩手』的由來，下列哪一個是最有名的傳說？","opts":["羅剎鬼被神明降服後，在三塊岩石上按下手印，於是稱為「岩手」","因為這裡的居民擅長用手雕刻岩石，被稱為「岩之手」","因為南部氏的家紋是一隻按在岩石上的手","因為古代的軍隊在此以手擊岩，作為出征的信號"],"correct":0,"rightFb":"沒錯！據說這個傳說，也是盛岡『三ツ石神社』的由來——一個名字，就是一個誓約。","wrongFb":"灰霧又濃了一分……岩神低聲說：「再想想，孩子。那隻手，不是人的手。」"},"afterQuiz":["（灰霧散去，三塊岩石重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":23},{"sceneEmoji":"🏯🎋","npcName":"青葉山的武者魂","npcIcon":"🛡️","pages":["旅人，站在青葉山上，往下看，那就是仙台的城下。你知道這座城，四百年前不叫『仙台』嗎？","這裡原本稱作『千代』，也寫成『千代城』。1600年代初，伊達政宗來到這裡，開始築城，並把地名改成了『仙台』。","一般的說法是：『千代』意為千年，雖然吉祥，但政宗想要一個更好的字面，便取了中國傳說中仙人居住之處『仙臺』的意思。也有另一說，與附近的千體佛有關。","無論如何，『仙台』二字，是一位領主刻意為自己的城選的名字，也讓這座城在四百年後，仍被稱為『杜之都』。"],"interference":["呵呵……『仙台』不過是因為這裡住過很多神仙，才叫仙台啦！哪有什麼刻意選擇？","青葉山的武者魂：「又來了，忘名妖！這名字是政宗公一筆一畫定下來的。旅人，說出真正的由來！」"],"quiz":{"q":"關於『仙台』的由來，下列何者才是一般的說法？","opts":["這裡自古有許多神仙降臨，因此被百姓稱為仙台","舊稱「千代」，伊達政宗築城時改為「仙台」，取中國傳說中仙人居所之意的吉祥好字","因為明治政府以「仙台藩」為名，把整個地區命名為仙台","取自「先代」的諧音，紀念此地的前一代領主"],"correct":1,"rightFb":"沒錯！從『千代』到『仙台』——一座城市的名字，是被人選出來的。","wrongFb":"灰霧又濃了一分……武者魂搖搖頭：「再想想，孩子。這個名字，是有人下了決心才改的。」"},"afterQuiz":["（灰霧散去，城下重新清晰）謝謝你，旅人。北方的三段記憶，你都替我們拾起來了。"],"placeId":30}],"closing":["孩子，你又喚醒了北方大地上的幾段記憶。每一個名字背後，都是一整段活過的歷史。","#!last#@ahai@喂，臭小子，一路看你查證這些老地名，還真有點意思。我在函館港討海一輩子，這條命跟這片海分不開——讓我這條老骨頭正式陪你走完剩下的路吧！","#last#@ahai@喂，臭小子，一路看你查證這些老地名，還真有點意思。我在函館港討海一輩子，這條命跟這片海分不開——讓我這條老骨頭，正式加入你們這支隊伍吧！"]},{"id":"central","name":"關東","color":"central","companion":"chianma","title":"關東篇：江戶的水與路","desc":"從下町的河岸到武藏野的台地，關東平原上的地名，記著江戶時代以前的濕地、渡口與街道。","opening":["關東平原上，水與路交織成一張看不見的網：河岸、渡口、宿場、台地——江戶之前與之後的名字層層疊疊。","小心，這一帶的忘名妖最愛把『江戶』時代的故事，套在每一個地名頭上。"],"counties":["茨城縣","栃木縣","群馬縣","埼玉縣","千葉縣","東京都","神奈川縣"],"mapPoly":"0,0","labelPos":{"x":540,"y":395},"stops":[{"sceneEmoji":"🌿🏰","npcName":"荊棘之靈","npcIcon":"🌿","pages":["旅人，歡迎來到關東平原的東邊。你腳下這片土地，叫做『茨城』——你有沒有想過，為什麼這個名字有個『茨』字？","『茨』是荊棘的意思。在很古老的《常陸國風土記》裡，記載了這麼一件事：很久以前，這一帶住著住在洞穴裡的土著，朝廷派來的黑坂命想了一個計策——用荊棘堆成一座城。","這座荊棘之城，把土著引了過來，一網打盡。這個地方，就被稱為『茨城』。","這是風土記裡的傳說性由來。你看，關東的地名，比江戶還要早很多，很多是奈良時代就有的呢。"],"interference":["呵呵……『茨城』還用問？這裡山野長滿野薔薇（茨），才叫茨城啦！","荊棘之靈：「又來了，忘名妖！風土記可是明明白白寫著『築城』兩個字。旅人，說出真正的由來！」"],"quiz":{"q":"關於『茨城』的由來，下列何者是《常陸國風土記》的記載？","opts":["因為此地遍地野薔薇，人們直接稱它為茨城","古代黑坂命用荊棘（茨）築城，來對付住在洞穴裡的土著，因此稱為「茨城」","因為江戶時代的水戶藩，在領地邊界種了一圈荊棘作為城牆","因為此地的守護神「茨」神，被人們尊稱為城主"],"correct":1,"rightFb":"沒錯！一個縣名，藏著一個古老的築城故事，而且比江戶早了上千年。","wrongFb":"灰霧又濃了一分……荊棘之靈低聲說：「再想想，孩子。那座城，是用荊棘蓋的。」"},"afterQuiz":["（灰霧散去，原野重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。","@chianma@（一位背著筆記本的年輕人從樹叢後探出頭來）「欸，剛剛那一段風土記的說法，可以再講一次嗎？我在記錄耆老口述，想對照一下文獻！」"],"placeId":50},{"sceneEmoji":"🌊🏯","npcName":"江戶古地圖師","npcIcon":"🗺️","pages":["旅人，你看這張古地圖。今日的東京，四百多年前叫做『江戶』，你知道『江戶』兩個字，指的是什麼嗎？","『江』，指的是入江，也就是海灣；『戶』，是出入口。合起來，『江戶』就是『入江的入口』。當時海水一直延伸到今日的日比谷一帶。","1457年，太田道灌在這裡築起江戶城。1590年，德川家康入城，把這裡變成幕府的中心。","1868年，江戶改名為『東京』——『東邊的京』。一個名字，記載了海灣與城市的轉變。"],"interference":["呵呵……『江戶』不就是武將『江戶氏』的名字嗎？先有人，才有地名，理所當然啦！","江戶古地圖師：「順序反了，忘名妖！江戶氏的姓，是從地名來的。旅人，說出真正的由來！」"],"quiz":{"q":"關於『江戶』的由來，下列哪一個說法最貼近一般的解釋？","opts":["因武將「江戶氏」掌管此地，地名直接取自他的姓氏","「江」指入江（海灣），「戶」指出入口，意為「入江的入口」","因這一帶的河川特別多，因此稱為「江之戶（江之家）」","取自德川家康的字，因此稱為江戶"],"correct":1,"rightFb":"沒錯！『江戶』是一個從地形而來的名字——記載著今日已被填平的海灣。","wrongFb":"灰霧又濃了一分……古地圖師搖搖頭：「再想想，孩子。這個名字，先有海灣，才有城。」"},"afterQuiz":["（灰霧散去，古地圖上的海灣重新清晰）謝謝你，旅人。"],"placeId":76},{"sceneEmoji":"⚓🏮","npcName":"濱邊的燈台守","npcIcon":"🏮","pages":["旅人，你來到了橫濱。今日這座擁有幾百萬人口的港口城市，在一百六十多年前，只是一座小小的漁村。","『橫濱』的意思，是『橫向的濱』。江戶時代，這裡是入江中橫向突出的一片沙洲，因此叫做『橫濱村』。","1859年，日本開港。有趣的是，條約上寫的是要在『神奈川』開港，但幕府實際上把港口建在對岸的橫濱村，避開了東海道上的神奈川宿。","一座小漁村，因為一個決定，變成了日本最早的國際港口之一。"],"interference":["呵呵……『橫濱』當然是因為橫向有一整排港口，一條橫濱一路排開，才叫這個名字啦！","濱邊的燈台守：「又來了，忘名妖！在開港之前，這裡連港口都沒有。旅人，說出真正的由來！」"],"quiz":{"q":"關於『橫濱』的由來，下列何者才是一般的說法？","opts":["因為開港後港口一字排開、橫向延伸，才被稱為橫濱","因為此地位於入江中橫向突出的沙洲（濱），所以稱為「橫濱」","因為這裡的居民擅長橫渡海灣，因此得名","因為與「神奈川」的縱向街道相對，稱為「橫濱」"],"correct":1,"rightFb":"沒錯！在港口出現之前，名字就已經存在了——那是一片橫長的沙洲。","wrongFb":"灰霧又濃了一分……燈台守輕聲說：「再想想，孩子。名字比港口更早。」"},"afterQuiz":["（灰霧散去，海面重新清晰）謝謝你，旅人。關東的三段記憶，你都替我們拾起來了。"],"placeId":82}],"closing":["@chianma@「讓我加入你們吧！我還想知道更多、更多地名背後的故事！」"]},{"id":"south","name":"中部・近畿","color":"south","companion":"wenlan","title":"中部・近畿篇：千年都城的名字層","desc":"從北陸的雪國、信州的高原，到京都與奈良的千年古都——這裡的地名，一層壓著一層，從《古事記》一路寫到今天。","opening":["越過山脈往西，地名開始有了千年的重量：古都的條坊、神社的名號、街道的舊稱，一層壓著一層。","小心，這一帶的忘名妖最擅長把『古老的傳說』，說成毫無根據的雅致藉口。"],"counties":["新潟縣","富山縣","石川縣","福井縣","山梨縣","長野縣","岐阜縣","靜岡縣","愛知縣","三重縣","滋賀縣","京都府","大阪府","兵庫縣","奈良縣","和歌山縣"],"mapPoly":"0,0","labelPos":{"x":200,"y":235},"stops":[{"sceneEmoji":"🌾🌊","npcName":"信濃川的潟守","npcIcon":"🌊","pages":["旅人，你站在信濃川的河口。這一帶叫做『新潟』——你有沒有想過，這個『潟』字是什麼意思？","『潟』，是海岸邊被沙洲圍起來的淺水湖、泥灘。信濃川和阿賀野川，一年又一年把泥沙帶到河口，沙洲愈積愈厚，就形成了一片又一片新的潟地。","人們便稱這個地方為『新潟』——『新的潟』。戰國時代的文獻裡，已經出現『新潟津』這個寫法。","1858年的條約，指定了幾個通商港口，新潟也名列其中，後來在1869年開港。一個因為河流堆沙而生的名字，最後成了面向世界的港口。"],"interference":["呵呵……『新潟』還用問？這裡蓋了一座新的港口，當然叫新港，加個水字旁就是潟啦！","信濃川的潟守：「又來了，忘名妖！港口是後來的事，名字可是老早就有了。旅人，說出真正的由來！」"],"quiz":{"q":"關於『新潟』的由來，下列何者是一般的說法？","opts":["明治政府開設新港口時，為它取名「新港」，後來改字為「新潟」","因信濃川河口泥沙堆積形成新的「潟」（潟湖、泥灘），因而稱為「新潟」","因這裡的稻田是新開墾的，「潟」是指新田","因為此地新建了一座大城，「潟」是指城下町"],"correct":1,"rightFb":"沒錯！地名不一定是人取的，有時是河流一點一點『寫』出來的。","wrongFb":"灰霧又濃了一分……潟守輕聲說：「再想想，孩子。這個名字，是河流送來的。」"},"afterQuiz":["（灰霧散去，河口重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":86},{"sceneEmoji":"✨🏯","npcName":"金洗沢的藤五郎","npcIcon":"🥔","pages":["旅人，你來到了金沢。這座城市以金箔聞名，你猜猜看，這個名字，跟『金』有沒有關係？","很久很久以前，這裡有個名叫藤五郎的窮人，靠挖山芋過日子。有一天，他在山中的泉水邊洗芋頭，卻發現水裡竟然閃著金光——那是金砂！","藤五郎靠這些金砂變得富有，人們便把這個地方叫做『金洗沢（かねあらいざわ）』，簡化之後，就成了『金沢』。","這是流傳很久的傳說，兼六園附近的『金城霊沢』，被認為就是傳說中的那處泉水。"],"interference":["呵呵……『金沢』就是因為這裡挖出很多金礦，才叫金沢的啦！哪裡有什麼芋頭？","金洗沢的藤五郎：「唉呀，忘名妖！這裡可沒有金礦。旅人，說出真正的傳說吧！」"],"quiz":{"q":"關於『金沢』的由來，下列哪一個是流傳最廣的傳說？","opts":["這一帶的山中挖出大量金礦，才稱為金沢","挖山芋的藤五郎在泉水邊洗芋時，發現金砂，這個地方便稱為「金洗沢」，簡化為金沢","因為加賀藩前田家在此堆積大量黃金，才稱為金沢","因為金箔工藝從中國傳入這裡，以金為名"],"correct":1,"rightFb":"沒錯！洗芋頭的泉水，成了一座百萬石城下町的名字。","wrongFb":"灰霧又濃了一分……藤五郎笑著說：「再想想，孩子。我可是靠洗芋頭發財的。」"},"afterQuiz":["（灰霧散去，泉水重新清澈）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":93},{"sceneEmoji":"🏯🌸","npcName":"沢彥和尚","npcIcon":"📿","pages":["旅人，這座山城，四百多年前並不叫『岐阜』。你知道它原來叫什麼嗎？","它原本叫『井ノ口』。1567年，織田信長攻下了齋藤氏的稻葉山城，搬到了這裡。","信長採納了禪僧沢彦宗恩的建議，把地名改成『岐阜』。一般的說法是，『岐』取自周文王興起的『岐山』，『阜』取自孔子出生地的『曲阜』。","信長就是要藉這個名字，向天下宣告：這裡，將成為奠定天下大業的地方。他在這一時期，也開始使用『天下布武』的印章。"],"interference":["呵呵……『岐阜』不過是『岐（分岔）的丘阜』，形容地形分岔，哪有什麼中國典故？","沢彥和尚：「阿彌陀佛，忘名妖，這可是老衲親口提議的。旅人，說出真正的由來！」"],"quiz":{"q":"關於『岐阜』改名，下列哪一個是一般的說法？","opts":["織田信長採納僧人建議，取周文王的「岐山」與孔子的「曲阜」，改稱「岐阜」","因為此地河流分岔，形成丘陵，直接以地形命名","取自齋藤氏的家紋「岐阜蝶」，紀念舊主","由豐臣秀吉為紀念信長，取信長的名字「長」與「岐」合成"],"correct":0,"rightFb":"沒錯！一次改名，就是一次宣言——信長把中國古代聖地的名字，放到了美濃的山城上。","wrongFb":"灰霧又濃了一分……和尚合十說：「再想想，孩子。這個名字，是兩個中國古地名合成的。」"},"afterQuiz":["（灰霧散去，山城重新清晰）謝謝你，旅人。中部的三段記憶，你都替我們拾起來了。"],"placeId":110},{"sceneEmoji":"🦌🏯","npcName":"平城京的舍人","npcIcon":"📜","pages":["旅人，你來到了奈良。1300多年前，這裡曾是日本的首都，叫做平城京。可是你知道，『奈良』這兩個字是什麼意思嗎？","答案是——沒有人能確定。有人說，『なら』來自『平（なら）す』，指平坦的土地，所以也寫成『平城』；有人說，是因為這裡楢（なら）樹很多。","還有一種說法，是朝鮮語裡意為『國家、都城』的『ナラ』。這幾個說法，都各有支持者。","『奈良』二字，其實是後來選定的好字，『奈』與『良』本身，並沒有特別的含意。有些地名，就是這樣：名字很有名，卻沒有人說得清楚它從哪裡來。"],"interference":["呵呵……『奈良』還用問？這裡有神明的使者鹿，一定是『鹿的樂園（なら）』啦！","平城京的舍人：「又來了，忘名妖！鹿是後來才出名的。旅人，說出『奈良』真正的狀況吧！」"],"quiz":{"q":"關於『奈良』的語源，下列何者最貼近現況？","opts":["因為這裡的鹿很多，所以人們稱它為「鹿之國（なら）」","沒有定論：有「平坦土地」說、「楢樹」說、朝鮮語「ナラ（國、都）」說等，各有支持者","由元明天皇親自命名，取自天皇名字中的「奈」與「良」","取自佛像「奈良大佛」的名字，因為東大寺建於此地"],"correct":1,"rightFb":"沒錯！有些地名最誠實的答案，就是『有好幾種說法』。","wrongFb":"灰霧又濃了一分……舍人苦笑著說：「再想想，孩子。這個名字的來歷，連老夫也說不準。」"},"afterQuiz":["（灰霧散去，平城京的朱雀大路重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。","@wenlan@（一位戴著圓眼鏡的年輕人從旁邊走來，手裡捧著一疊舊書）「『多說並存』——這正是最誠實的答案。在下藤原文彥，不知可否同行？」"],"placeId":146},{"sceneEmoji":"⛩️🌸","npcName":"洛中的古老","npcIcon":"🏮","pages":["旅人，你來到了京都。你有沒有想過，『京都』這兩個字，為什麼看起來有點重複？","『京』的意思是都城，『都』的意思也是都城。所以，『京都』的意思，其實就是『みやこ』——天皇居住的都城。","794年，桓武天皇遷都到這裡，正式名稱是『平安京』，意思是『和平安寧之都』。人們還用中國的都城『洛陽』來比喻它，稱京城之內為『洛中』。","後來天皇搬到了東京，可是這座城市仍然保持著『京都』之名，因為在許多人心中，它才是那座『原本的都』。"],"interference":["呵呵……『京都』就是『京（大）的都市』啦！因為它是全日本最大的都市，才叫京都！","洛中的古老：「又來了，忘名妖！京和都可都是同一個意思。旅人，說出真正的由來！」"],"quiz":{"q":"關於『京都』這個名字，下列何者才是正確的？","opts":["「京」是「大」的意思，「京都」意為「最大的都市」","「京」與「都」都是「都城」之意，「京都」即「みやこ」，正式名稱是平安京","取自桓武天皇的名字「京」與「都」","因為這裡有許多「京」（寺院）與「都」（神社），合稱京都"],"correct":1,"rightFb":"沒錯！千年之都的名字，其實只是重複說了兩次『都』。","wrongFb":"灰霧又濃了一分……古老搖搖頭：「再想想，孩子。這兩個字，講的是同一件事。」"},"afterQuiz":["（灰霧散去，古都的街景重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":131},{"sceneEmoji":"🏯🍢","npcName":"石山的蓮如上人","npcIcon":"📿","pages":["旅人，你來到了大阪。你知道嗎？這座城市在四百多年前，寫的不是『阪』，而是『坂』。","1496年，淨土真宗的蓮如上人在上町台地的石山建立道場，稱為『大坂御坊』。『大坂』，就是這片高地上的一條大坡。","到了明治時期，『坂』被改寫成『阪』。一個流傳很廣的說法是：『坂』可以拆成『土』和『反』，被認為有『歸於塵土』的不祥聯想，於是改用『阝』旁的『阪』。","不過這只是其中一說，改字的真正原因，史料並不明確。一個字的改變，就藏著一段說不清的故事。"],"interference":["呵呵……『大阪』就是『大的山阪』啦！山阪本來就寫成阪，哪有什麼改字？","石山的蓮如上人：「阿彌陀佛，忘名妖，這個字可是明治才改的。旅人，說出真正的由來！」"],"quiz":{"q":"關於『大阪』的寫法，下列何者是正確的說法？","opts":["從古代到現在，一直都寫作「大阪」，從未改過字","原寫作「大坂」，明治初年改為「大阪」；一說因「坂」可拆成「土」「反」，有不祥聯想","原寫作「大板」，因為城牆用大板築成","由蓮如上人一開始就寫成「大阪」，沿用至今"],"correct":1,"rightFb":"沒錯！『坂』變成『阪』——一個字的偏旁，就是一段城市的心事。","wrongFb":"灰霧又濃了一分……上人合十說：「再想想，孩子。這個字，是後來才改的。」"},"afterQuiz":["（灰霧散去，難波的燈火重新清晰）謝謝你，旅人。近畿的三段記憶，你都替我們拾起來了。"],"placeId":136}],"closing":["@wenlan@「在下藤原文彥，願隨諸位同行——文獻與口傳，本就該一起讀。」"]},{"id":"east","name":"中國・四國・九州","color":"east","companion":"lahok","title":"中國・四國・九州篇：海道與火山的名字","desc":"瀨戶內海的島嶼、四國的遍路、九州的火山——這一區的地名，跟海路與火山的記憶緊緊相連。","opening":["瀨戶內的海道、四國的遍路、九州的火山灰：這裡的名字，有些是航海人喊出來的，有些是火山替大地取的。","小心，這一帶的忘名妖最愛把『合併後的新名字』，講得像自古以來就有。"],"counties":["鳥取縣","島根縣","岡山縣","廣島縣","山口縣","德島縣","香川縣","愛媛縣","高知縣","福岡縣","佐賀縣","長崎縣","熊本縣","大分縣","宮崎縣","鹿兒島縣"],"mapPoly":"0,0","labelPos":{"x":88,"y":330},"stops":[{"sceneEmoji":"☁️⛩️","npcName":"八束水臣津野命","npcIcon":"☁️","pages":["旅人，你抬頭看看，出雲的天空，是不是總有層層疊疊的雲？很久很久以前，有一位巨大的神明，也這樣抬頭望著天空。","《出雲國風土記》記載，這位神明叫做八束水臣津野命。他看著天上湧起的重重雲朵，說了一句：『八雲立つ』——八重的雲，正在升起。","於是，這個地方就被稱為『八雲立つ出雲』。也就是說，『出雲』這個名字，一開始是一句讚嘆天空的話。","當然，也有學者認為，『いづも』其實是『厳藻（いつも）』，意為神聖的水藻。出雲的名字有好幾種說法，但『八雲立つ』，是最美的那一種。"],"interference":["呵呵……『出雲』還用問？就是『雲會冒出來的地方』，這裡天氣多變，雲出來出去，才叫出雲啦！","八束水臣津野命：「唔，忘名妖，這可不是隨口說的天氣預報。旅人，說出真正的由來！」"],"quiz":{"q":"關於『出雲』這個名字，下列哪一個是《出雲國風土記》的記載？","opts":["因為此地天氣多變，雲朵時常湧出，人們便直接稱為「出雲」","八束水臣津野命看見層層雲朵升起，說「八雲立つ」，因而稱為「八雲立つ出雲」","因為這裡是雲之神的居所，因此古代天皇特別命名為出雲","取自中國的「雲夢」，由遣唐使帶回來的地名"],"correct":1,"rightFb":"沒錯！一個名字，起源於一句抬頭看天的讚嘆。","wrongFb":"灰霧又濃了一分……神明的聲音在雲間迴盪：「再想想，孩子。那是一句話，不是天氣預報。」"},"afterQuiz":["（灰霧散去，雲朵重新在天空中舒展）謝謝你，旅人。這份記憶碎片，我把它託付給你了。","@lahok@（一位背著登山包的年輕嚮導從林間走出來，點了點頭）「雲會記得你說過的話。我叫小野岳，山林裡的路，我熟。」"],"placeId":160},{"sceneEmoji":"🏞️🕊️","npcName":"太田川的舟守","npcIcon":"⛵","pages":["旅人，你站在太田川的三角洲上。這座城市有一個名字，大家都很熟悉——『廣島』。你知道它是怎麼來的嗎？","1589年，毛利輝元選擇在這片三角洲上築城，並為這座城市命名。可是，名字的由來，有兩種主要說法。","一說，這片三角洲是一座『廣闊的島』——河流分成好幾道，沙洲連成一大片平原。另一說，則是取毛利氏祖先大江廣元的『廣』字，加上家臣福島元長的『島』字。","1945年之後，『廣島』這個名字，也成為全世界呼求和平的名字。名字有時候，會被歷史賦予新的重量。"],"interference":["呵呵……『廣島』還用問？就是『很寬廣的島』啦！這麼簡單的事，哪有什麼兩種說法？","太田川的舟守：「唉呀，忘名妖，你只講了一半。旅人，把兩種說法都說出來！」"],"quiz":{"q":"關於『廣島』的由來，下列何者才是正確的說法？","opts":["只有一種說法：因為河口有一座很廣闊的島，所以直接稱為廣島","有兩種主要說法：「廣闊的島（三角洲）」，或取自大江廣元的「広」與福島元長的「島」","取自中國的「廣島」，由毛利氏從中國帶回來","由明治政府為紀念開港而命名，與毛利氏無關"],"correct":1,"rightFb":"沒錯！有些地名，就是有兩個都說得通的故事。","wrongFb":"灰霧又濃了一分……舟守輕聲說：「再想想，孩子。這個名字，可不只一種說法。」"},"afterQuiz":["（灰霧散去，河面平靜下來）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":167},{"sceneEmoji":"🍊🌸","npcName":"愛比売","npcIcon":"🌸","pages":["旅人，你來到了愛媛。你知道『媛』字是什麼意思嗎？它是『姬』，一位美麗的姑娘。","《古事記》記載，伊邪那岐與伊邪那美兩位神明，生下了四國這座島。這座島有一個身體，卻有四張臉，每一張臉都有自己的名字。","伊予國的臉，叫做『愛比売（えひめ）』，意思是可愛的姑娘；讚岐國叫『飯依比古』；粟國叫『大宜都比売』；土左叫『建依別』。","明治時代，縣名從這段神話裡挑選，成為『愛媛』。也就是說，愛媛這個名字，是神話裡一位姑娘的名字。"],"interference":["呵呵……『愛媛』還用問？這裡愛心滿滿，人人相愛，才叫愛媛啦！哪有什麼神話？","愛比売：「唉呀，忘名妖，你說得好可愛，可惜不是這樣的。旅人，說出真正的由來！」"],"quiz":{"q":"關於『愛媛』的由來，下列何者才是正確的？","opts":["因為愛媛人性格溫和，善待他人，因而稱為愛媛","《古事記》國生神話中，伊予國的名字是「愛比売」，意為可愛的姑娘，明治時取用為縣名","取自愛媛縣特產「愛媛柑橘」的產地名","由縣民投票決定，取自「愛」與「姬」的意義"],"correct":1,"rightFb":"沒錯！一座縣的名字，來自神話裡一位可愛的姑娘。","wrongFb":"灰霧又濃了一分……姑娘微笑著說：「再想想，孩子。我的名字，可是很古老的喔。」"},"afterQuiz":["（灰霧散去，橘子花的香氣重新飄來）謝謝你，旅人。中國與四國的三段記憶，你都替我們拾起來了。"],"placeId":182},{"sceneEmoji":"🏙️🍜","npcName":"那珂川的渡守","npcIcon":"⛵","pages":["旅人，你站在那珂川的河岸邊。這條河的兩邊，其實是兩座城市：西岸叫福岡，東岸叫博多。為什麼一條河，有兩個名字？","河的東岸『博多』，是自古以來的商人港町，早在千年前就是通往大陸的門戶。河的西岸『福岡』，卻是1601年才誕生的新城。","那一年，黑田長政因關原之戰的戰功，獲封筑前國，開始在西岸築城。他把這座城命名為『福岡』，因為黑田氏一族發跡的地方，正是備前國的『福岡』——今天岡山縣一帶。","也就是說，『福岡』這個名字，是被長政從故鄉『搬』過來的。1889年設市時，市名在『福岡』與『博多』之間有過爭論，最後定為福岡市，『博多』則留在車站與港灣的名字裡。"],"interference":["呵呵……『福岡』還用問？就是『福氣滿滿的山岡』啦！這麼吉利，當然叫福岡！","那珂川的渡守：「又來了，忘名妖！這名字可是被人從遠方搬過來的。旅人，說出真正的由來！」"],"quiz":{"q":"關於『福岡』的由來，下列何者是一般的說法？","opts":["因為這裡是福氣滿滿的山岡，黑田長政特地選了吉祥字","黑田長政以黑田氏發跡的備前國福岡（今岡山縣）為名，把地名「移植」到筑前的新城","由福岡藩的藩士投票，選了最吉利的兩個字","取自博多灣的形狀，像一座福氣滿滿的岡"],"correct":1,"rightFb":"沒錯！地名也會搬家——一個名字，從岡山一路搬到了九州。","wrongFb":"灰霧又濃了一分……渡守搖搖頭：「再想想，孩子。這個名字，是有人帶著故鄉過來的。」"},"afterQuiz":["（灰霧散去，河面重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":189},{"sceneEmoji":"⛵🏮","npcName":"長崎的通詞","npcIcon":"📖","pages":["旅人，你來到了長崎。這座港口，在江戶時代是日本唯一對外開放的窗口。可是你知道，『長崎』這兩個字，是什麼意思嗎？","一般的說法，是地形：這裡的海岸邊，有一片細長突出的岬角，人們稱它為『長い崎（ながいさき）』，也就是『長長的岬』。","中世紀時，這裡確實有一位叫長崎氏的豪族。不過他們是以地名為姓，而不是地名來自他們的姓氏。","1571年，大村純忠與葡萄牙人合作，正式開港。從此，『長崎』這個名字，成了通往世界的代名詞。"],"interference":["呵呵……『長崎』就是因為長崎氏統治這裡，才叫長崎的啦！先有人，才有地名，天經地義！","長崎的通詞：「順序反了，忘名妖！長崎氏是以地為姓。旅人，說出真正的由來！」"],"quiz":{"q":"關於『長崎』的由來，下列何者是一般的說法？","opts":["因為長崎氏統治此地，地名直接取自他們的姓氏","因為海岸邊有一片細長突出的岬角，稱為「長い崎」；長崎氏則是以地名為姓","因為葡萄牙人把這裡稱為 Nagasaki，日本人才跟著採用","因為這裡的港口很長，船隻需要排很長的隊"],"correct":1,"rightFb":"沒錯！港口的名字，是先有一片長長的岬角，然後才有人、有船、有世界。","wrongFb":"灰霧又濃了一分……通詞低聲說：「再想想，孩子。是先有岬，才有姓。」"},"afterQuiz":["（灰霧散去，港灣重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":196},{"sceneEmoji":"🏯🌋","npcName":"熊本城的石垣守","npcIcon":"🏯","pages":["旅人，你看這座城的石垣，弧度像扇子一樣優美，被稱為『武者返』。這座城下的地名，四百年前，其實不叫『熊本』。","中世紀，它被稱為『隈本』。『隈』字，有山谷彎曲處、深處的意思，跟球磨的『球磨』同樣，都是形容偏遠幽深的土地。","1607年前後，加藤清正在此築起熊本城，並把地名改成了『熊本』。","一般的說法是：『隈』聽起來像『畏（畏懼）』，感覺不夠有力；而『熊』字，有勇猛的意象，於是改用了『熊』。改名的細節，資料略有出入，但這座城的名字，就這樣定了下來。"],"interference":["呵呵……『熊本』還用問？因為阿蘇山上有很多熊，所以叫熊本啦！這麼簡單的事！","熊本城的石垣守：「唉呀，忘名妖，這裡的熊，可不是動物的熊。旅人，說出真正的由來！」"],"quiz":{"q":"關於『熊本』的由來，下列何者是一般的說法？","opts":["因為阿蘇山一帶有很多熊，人們直接稱為熊本","原稱「隈本」，加藤清正築城時改為「熊本」，一說因「隈」與「畏」相通而改用勇猛的「熊」","取自朝廷賜給加藤清正的官職名「熊本守」","取自城的形狀，遠看像一隻蹲著的熊"],"correct":1,"rightFb":"沒錯！一個字的改變，就是一位城主的心思。","wrongFb":"灰霧又濃了一分……石垣守搖搖頭：「再想想，孩子。這個字，是後來才改的。」"},"afterQuiz":["（灰霧散去，城垣在夕陽中重新清晰）謝謝你，旅人。中國、四國與九州的記憶，你都替我們拾起來了。"],"placeId":201}],"closing":["@lahok@（點了點頭）「山會記得你走過的路。我跟你們走。」"]},{"id":"island","name":"沖繩","color":"island","companion":"phoasoh","extraCompanion":"keshian","title":"沖繩篇：琉球的海與御嶽","desc":"琉球王國留下的地名，有自己獨特的音韻與語法——『グスク』『御嶽』『間切』，每一個詞都是一整段海島的記憶。","opening":["沖繩的名字，不太像日本本土的任何一個地方：グスク（城）、御嶽、間切……琉球王國留下了自己的語言與語法。","小心，這一帶的忘名妖，最喜歡把琉球語的地名，硬說成本土語的諧音笑話。"],"counties":["沖繩縣"],"mapPoly":"0,0","labelPos":{"x":533,"y":500},"stops":[{"sceneEmoji":"🌺🌊","npcName":"海的另一頭來的使者","npcIcon":"⛵","pages":["旅人，你來到了沖繩。這一片島嶼，過去有一個很有名的名字，叫做『琉球』。你知道，這個名字是誰取的嗎？","最早，它以『流求』的寫法，出現在中國的史書《隋書》裡。至於這個『流求』指的是沖繩，還是台灣，學界有不同的意見。","14世紀後半，明朝的使者來到這裡，招諭當地的中山王，此後『琉球』二字，成為王國對外的名稱，也就是『琉球王國』。","也就是說，『琉球』最初是海的另一頭的人所取的名字。而島上的人，稱自己為『ウチナー』。"],"interference":["呵呵……『琉球』還用問？這是島上的人自己取的，形容島像一顆琉璃珠子啦！","海的另一頭來的使者：「又來了，忘名妖！這個名字，可是從海的另一頭來的。旅人，說出真正的由來！」"],"quiz":{"q":"關於『琉球』這個名字，下列何者才是正確的？","opts":["島上居民自己取的名字，形容島嶼像一顆琉璃珠","原本是中國史書對這片島嶼的稱呼，明代起成為王國的名稱；當地人自稱「ウチナー」","由薩摩藩在江戶時代命名，取自「流」與「求」兩個字","由葡萄牙航海家命名，音譯自 Liu Kiu"],"correct":1,"rightFb":"沒錯！一個名字，是從海的另一頭來的；而島上的人，另有自己的名字。","wrongFb":"灰霧又濃了一分……使者輕聲說：「再想想，孩子。這個名字，是外面的人取的。」"},"afterQuiz":["（灰霧散去，海面重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":217},{"sceneEmoji":"🌴🐚","npcName":"鑑真的弟子","npcIcon":"📿","pages":["旅人，你知道嗎？8世紀，有一位偉大的高僧鑑真，為了把佛法傳到日本，歷經多次失敗，終於航向東方。","他的傳記《唐大和上東征傳》裡，記載了船隻漂流到一座島嶼，那座島被寫成『阿兒奈波』。學者們認為，這就是今天的沖繩。","江戶時代，學者新井白石在《南島志》裡，使用『沖縄』二字。從此，這個寫法逐漸定著下來。","至於『おきなわ』本身的意思，沖繩學之父伊波普猷提出一說：是『沖の漁場（沖なは）』。不過，也有其他說法，至今沒有定論。"],"interference":["呵呵……『沖縄』還用問？就是『沖（海）上有一條繩子』，形容島嶼連成一串啦！這麼簡單的事！","鑑真的弟子：「唉呀，忘名妖，這只是後人的附會。旅人，說出真正的由來！」"],"quiz":{"q":"關於『沖縄』這個名稱，下列何者是較為可信的說法？","opts":["因為島嶼像一條繩子浮在海面上，所以稱為沖縄，此說有史書為證","古書寫作「阿兒奈波」，新井白石《南島志》起使用「沖縄」；語源一說是「沖の漁場（ナハ）」，尚無定論","由薩摩藩武士命名，取自「沖」與「縄」兩個漢字的意義","琉球王國國王親自命名，以「沖」代表海、以「縄」代表王權"],"correct":1,"rightFb":"沒錯！字面像是繩子，其實那只是後來的附會。","wrongFb":"灰霧又濃了一分……弟子搖搖頭：「再想想，孩子。這個字面，可能只是後人的想像。」"},"afterQuiz":["（灰霧散去，海灘重新清晰）謝謝你，旅人。這份記憶碎片，我把它託付給你了。"],"placeId":216},{"sceneEmoji":"⛵🏝️","npcName":"浮島的船頭","npcIcon":"⚓","pages":["旅人，你站在那覇的港口。你想像一下，五百多年前，這裡並不是連著陸地的城市，而是一座漂浮在海灣中的小島。","古時候，人們稱這座小島為『浮島』。1452年，人們築起一條稱為『長虹堤』的長堤，把浮島與首里連在一起。","那覇因此成為琉球王國的港口，與中國、東南亞、日本的船隻往來不絕，貿易繁盛。","『那覇』的語源，一般說法是琉球語中意為『漁場、港』的詞。『那覇』二字，只是後來的當字。這座島，曾經真的是浮在海上的。"],"interference":["呵呵……『那覇』就是『那個地方（那）加上一片霸道（覇）』，形容這裡是海上的霸主啦！","浮島的船頭：「唉呀，忘名妖，字面可不是這個意思。旅人，說出真正的由來！」"],"quiz":{"q":"關於『那覇』的歷史，下列何者是正確的？","opts":["因這裡是海上霸主的所在，所以取名「那覇（那個霸主）」","古稱「浮島」，是海灣中的小島，15世紀築長虹堤與首里相連；「那覇」二字是後來的當字","因為明朝使者到訪時，賜予「那覇」這個名字","由本州武士在江戶時代命名，取自「那須」與「覇者」"],"correct":1,"rightFb":"沒錯！一座港口的名字，藏著一座漂浮的小島。","wrongFb":"灰霧又濃了一分……船頭笑著說：「再想想，孩子。這座島，是漂在海上的。」"},"afterQuiz":["（灰霧散去，港灣在夕陽中重新清晰）謝謝你，旅人。日本列島的最後一段記憶，你都替我們拾起來了。"],"placeId":218}],"closing":["#!last#@phoasoh@「好啦，正式入隊！孩子，與那嶺阿姨陪你走下去！」","#last#@phoasoh@「好啦，正式入隊！孩子，這趟旅程，阿姨跟你一起走到底！」"]}];

const COUNTY_CONTENT = {"北海道":{"mainChains":[{"id":"main-北海道-1","title":"北海道．小樽至稚內","kind":"main","opening":"貝澤凜：「你是來認地名的嗎？太好了，我們阿伊努語的地名，很多都藏在『ナイ』和『ペッ』裡。這一段路，我帶你認識北海道的幾個地方：小樽、旭川、釧路、稚內。」","closing":"貝澤凜：「謝謝你願意聽。地名不是只有漢字，它背後還有一整個語言，別忘了喔。」","placeIds":[3,4,5,6],"stops":[{"placeId":3,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"💧","pages":["你知道『小樽』這個地方，是怎麼來的嗎？源自阿伊努語「オタ・オル・ナイ」，意為「沙灘中的河」，縮略成「オタル」後以漢字「小樽」書寫。","小樽的舊稱「オタルナイ」出自阿伊努語「オタ・オル・ナイ（ota-ru-nai）」，意為「沙灘中的河」，指流經沙灘入海的河流。後來字尾的「ナイ（河）」被省略，只留下「オタル」，再以「小樽」二字書寫。","江戶時代這裡是鯡魚漁場與北前船的停靠港，明治以後成為北海道的物資與金融重鎮。"],"quiz":{"q":"關於「小樽」（北海道）這個地名，下列何者才是真正的由來？","opts":["因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係","源自阿伊努語「オタ・オル・ナイ」，意為「沙灘中的河」，縮略成「オタル」後以漢字「小樽」書寫。","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","因某位藩主的姓氏諧音相近而得名，與土地本身無關"],"correct":1,"rightFb":"沒錯！源自阿伊努語「オタ・オル・ナイ」，意為「沙灘中的河」，縮略成「オタル」後以漢字「小樽」書寫。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}},{"placeId":4,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"💧","pages":["你知道『旭川』這個地方，是怎麼來的嗎？源自阿伊努語「チュㇷ゚ペッ（日之川）」的意譯，並以象徵朝陽的「旭」字命名，1890年定名。","旭川一帶在阿伊努語中稱「チュㇷ゚ペッ（chup-pet）」，意為「日（太陽）之川」，這也是「忠別川」名稱的由來。明治中期為了開拓上川盆地，人們把這個名字意譯為「旭川」，以「旭」字象徵升起的朝陽。","它是道內少數以意譯而不是音譯定名的大城市，如今也是北海道第二大都市。"],"quiz":{"q":"關於「旭川」（北海道）這個地名，下列何者才是真正的由來？","opts":["因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係","因某位藩主的姓氏諧音相近而得名，與土地本身無關","因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","源自阿伊努語「チュㇷ゚ペッ（日之川）」的意譯，並以象徵朝陽的「旭」字命名，1890年定名。"],"correct":3,"rightFb":"沒錯！源自阿伊努語「チュㇷ゚ペッ（日之川）」的意譯，並以象徵朝陽的「旭」字命名，1890年定名。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}},{"placeId":5,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"🌫️","pages":["你知道『釧路』這個地方，是怎麼來的嗎？釧路的阿伊努語語源有多種說法，包括「クスリ（越過的路）」與「クッシロ（咽喉般的地形）」等，至今尚無定論。","釧路的語源眾說紛紜。一說出自阿伊努語「クスリ（kusuri）」，解為「越過的路」；另一說為「クッシロ（kut-shir）」，指如咽喉般狹窄的地形；也有「藥、溫泉」之說。","這些說法各有依據卻都難以定論，是一個典型「沒有標準答案」的地名。明治時代這裡因硫磺與煤炭運輸而發展，如今以濕原與漁港聞名。"],"quiz":{"q":"關於「釧路」（北海道）這個地名，下列何者才是真正的由來？","opts":["因戰國武將行軍經過此地時隨口命名而流傳下來","因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","釧路的阿伊努語語源有多種說法，包括「クスリ（越過的路）」與「クッシロ（咽喉般的地形）」等，至今尚無定論。","因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係"],"correct":2,"rightFb":"沒錯！釧路的阿伊努語語源有多種說法，包括「クスリ（越過的路）」與「クッシロ（咽喉般的地形）」等，至今尚無定論。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":6,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"💧","pages":["你知道『稚內』這個地方，是怎麼來的嗎？源自阿伊努語「ヤム・ワッカ・ナイ」，意為「冷水的沢（小河）」，縮略後寫成「稚內」。","稚內是日本本土最北端的城市。它的名字出自阿伊努語「ヤム・ワッカ・ナイ（yam-wakka-nai）」，意為「冷水的沢（小河）」，指從山上流下來的冰涼溪水。","字尾的「ナイ（沢）」在日文地名中常寫成「内」，因此北海道有許多「〇〇内」的地名，都是同樣的道理。"],"quiz":{"q":"關於「稚內」（北海道）這個地名，下列何者才是真正的由來？","opts":["因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係","源自阿伊努語「ヤム・ワッカ・ナイ」，意為「冷水的沢（小河）」，縮略後寫成「稚內」。","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關"],"correct":2,"rightFb":"沒錯！源自阿伊努語「ヤム・ワッカ・ナイ」，意為「冷水的沢（小河）」，縮略後寫成「稚內」。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}]},{"id":"main-北海道-2","title":"北海道．網走至苫小牧","kind":"main","opening":"貝澤凜：「你是來認地名的嗎？太好了，我們阿伊努語的地名，很多都藏在『ナイ』和『ペッ』裡。這一段路，我帶你認識北海道的幾個地方：網走、帶廣、根室、苫小牧。」","closing":"貝澤凜：「謝謝你願意聽。地名不是只有漢字，它背後還有一整個語言，別忘了喔。」","placeIds":[7,8,9,10],"stops":[{"placeId":7,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"🌊","pages":["你知道『網走』這個地方，是怎麼來的嗎？一說出自阿伊努語「チパシリ」（有祭祀幣場的島），另說為「アパ・シリ」（我們發現的土地），語源尚有爭議。","網走在阿伊努語的語源有多種說法：一說為「チパシリ（chipa-shir）」，意為「有祭祀幣場（供奉神明處）的島」；另一說為「アパ・シリ」，解為「我們發現的土地」。","無論哪一說，「網走」二字都只是取音的當字，與「網」或「奔走」並無關係。每年冬天，這裡也是鄂霍次克海流冰抵達的地方。"],"quiz":{"q":"關於「網走」（北海道）這個地名，下列何者才是真正的由來？","opts":["只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關","一說出自阿伊努語「チパシリ」（有祭祀幣場的島），另說為「アパ・シリ」（我們發現的土地），語源尚有爭議。","因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係","因江戶幕府官員依自己的家鄉地名直接移植而來"],"correct":1,"rightFb":"沒錯！一說出自阿伊努語「チパシリ」（有祭祀幣場的島），另說為「アパ・シリ」（我們發現的土地），語源尚有爭議。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}},{"placeId":8,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"💧","pages":["你知道『帶廣』這個地方，是怎麼來的嗎？源自阿伊努語「オペレペレケㇷ゚」（河口分成好幾股的地方），舊稱「オベリベリ」，後改寫為「帶廣」。","帶廣舊稱「オベリベリ」，源自阿伊努語「オ・ペレ・ペレ・ケㇷ゚」，意為「河口裂成好幾股的地方」，指札內川流入十勝川處。1883年，開拓團體「晚成社」的依田勉三等人在此入墾。","後來地名改寫為「帶廣」，其中的「帶」字，也讓人聯想到綿長的河流。"],"quiz":{"q":"關於「帶廣」（北海道）這個地名，下列何者才是真正的由來？","opts":["傳說是某位雲遊高僧隨手一指，就定下了這個名字","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","因江戶幕府官員依自己的家鄉地名直接移植而來","源自阿伊努語「オペレペレケㇷ゚」（河口分成好幾股的地方），舊稱「オベリベリ」，後改寫為「帶廣」。"],"correct":3,"rightFb":"沒錯！源自阿伊努語「オペレペレケㇷ゚」（河口分成好幾股的地方），舊稱「オベリベリ」，後改寫為「帶廣」。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":9,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"🌫️","pages":["你知道『根室』這個地方，是怎麼來的嗎？源自阿伊努語「ニムオロ」，意為「有樹林（木）的地方」，以漢字「根室」書寫。","根室是日本本土最東邊的市。名稱出自阿伊努語「ニムオロ（nim-oro）」，一般解為「有樹林的地方」。","在強風多霧、樹木稀少的東北海岸，一處有樹林的地方特別值得被命名，這也是很多阿伊努語地名的思路：先民用最鮮明的地形特徵來稱呼一片土地。"],"quiz":{"q":"關於「根室」（北海道）這個地名，下列何者才是真正的由來？","opts":["因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係","因某位藩主的姓氏諧音相近而得名，與土地本身無關","源自阿伊努語「ニムオロ」，意為「有樹林（木）的地方」，以漢字「根室」書寫。"],"correct":3,"rightFb":"沒錯！源自阿伊努語「ニムオロ」，意為「有樹林（木）的地方」，以漢字「根室」書寫。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}},{"placeId":10,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"💧","pages":["你知道『苫小牧』這個地方，是怎麼來的嗎？一般認為源自阿伊努語「トマコマイ」，一說指「沼澤後方（深處）的地方」，是典型音譯當字。","苫小牧的語源出自阿伊努語「トマコマイ」，一般認為與「トー（沼、湖）」有關，意為「沼澤後方的地方」，不過語源仍有其他說法。「苫」是用茅草編成的覆蓋物、「牧」是牧場，兩字只是取音的當字，與地名本意無關。","近代這裡因造紙與港口工業而發展。"],"quiz":{"q":"關於「苫小牧」（北海道）這個地名，下列何者才是真正的由來？","opts":["一般認為源自阿伊努語「トマコマイ」，一說指「沼澤後方（深處）的地方」，是典型音譯當字。","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關","因江戶幕府官員依自己的家鄉地名直接移植而來","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故"],"correct":0,"rightFb":"沒錯！一般認為源自阿伊努語「トマコマイ」，一說指「沼澤後方（深處）的地方」，是典型音譯當字。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}}]}],"sideQuests":[{"id":"side-北海道-1","title":"北海道．登別至知床","kind":"side","opening":"貝澤凜：「你是來認地名的嗎？太好了，我們阿伊努語的地名，很多都藏在『ナイ』和『ペッ』裡。這一段路，我帶你認識北海道的幾個地方：登別、室蘭、富良野、知床。」","closing":"貝澤凜：「謝謝你願意聽。地名不是只有漢字，它背後還有一整個語言，別忘了喔。」","placeIds":[11,12,13,14],"stops":[{"placeId":11,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"💧","pages":["你知道『登別』這個地方，是怎麼來的嗎？源自阿伊努語「ヌプル・ペッ」，意為「顏色濃的河」，指因溫泉而混濁的河水。","登別的舊稱出自阿伊努語「ヌプル・ペッ（nupur-pet）」，意為「顏色濃（混濁）的河」。流經此地的河因為溫泉成分而呈現乳白混濁，先民便以此稱呼。之後「ヌプル」音轉為「ノボル」，並以「登別」二字書寫。","今日的登別溫泉是北海道知名的湯鄉。"],"quiz":{"q":"關於「登別」（北海道）這個地名，下列何者才是真正的由來？","opts":["因戰國武將行軍經過此地時隨口命名而流傳下來","因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關","源自阿伊努語「ヌプル・ペッ」，意為「顏色濃的河」，指因溫泉而混濁的河水。"],"correct":3,"rightFb":"沒錯！源自阿伊努語「ヌプル・ペッ」，意為「顏色濃的河」，指因溫泉而混濁的河水。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":12,"npcName":"貝澤凜","npcIcon":"🪶","sceneEmoji":"🌫️","pages":["你知道『室蘭』這個地方，是怎麼來的嗎？源自阿伊努語「モ・ルエラニ」，意為「小小的下坡路」，音轉為「モルラン」後寫成「室蘭」。","室蘭源自阿伊努語「モ・ルエラニ（mo-ruerani）」，意為「小小的下坡路」，指通往海邊的一條緩 稱「森岡」，南部氏為求吉祥改為「盛岡」，「盛」有興盛之意。","盛岡舊稱「森岡」。江戶時代盛岡藩南部氏認為「森」與「盛」（興盛）同音，且「盛」字含有繁榮之意，較為吉利，於是把城下町的名字改為「盛岡」。","不過「森岡」與「盛岡」曾並存一段時間，改稱的時期與經過在文獻上有不同說法，因此「原稱森岡、後改盛岡」為一般說法。"],"quiz":{"q":"關於「盛岡」（岩手縣）這個地名，下列何者才是真正的由來？","opts":["因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","因戰國武將行軍經過此地時隨口命名而流傳下來","因江戶幕府官員依自己的家鄉地名直接移植而來","原稱「森岡」，南部氏為求吉祥改為「盛岡」，「盛」有興盛之意。"],"correct":3,"rightFb":"沒錯！原稱「森岡」，南部氏為求吉祥改為「盛岡」，「盛」有興盛之意。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}},{"placeId":25,"npcName":"小岩茜","npcIcon":"🫖","sceneEmoji":"🌾","pages":["你知道『遠野』這個地方，是怎麼來的嗎？一般認為源自阿伊努語「トー・ヌプ」，意為「湖泊的原野」，遠野盆地在古代可能曾是湖。","遠野以民間傳說「遠野物語」聞名。地名一般認為來自阿伊努語「トー・ヌプ（to-nup）」，意為「湖之原野」。遠野盆地四面環山，據說很久以前曾是一座湖泊，後來湖水退去成為盆地。","「遠野」二字是借音的當字，並不是「遙遠的原野」的意思。"],"quiz":{"q":"關於「遠野」（岩手縣）這個地名，下列何者才是真正的由來？","opts":["傳說是某位雲遊高僧隨手一指，就定下了這個名字","一般認為源自阿伊努語「トー・ヌプ」，意為「湖泊的原野」，遠野盆地在古代可能曾是湖。","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關","因某位藩主的姓氏諧音相近而得名，與土地本身無關"],"correct":1,"rightFb":"沒錯！一般認為源自阿伊努語「トー・ヌプ」，意為「湖泊的原野」，遠野盆地在古代可能曾是湖。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}},{"placeId":26,"npcName":"小岩茜","npcIcon":"🫖","sceneEmoji":"🌫️","pages":["你知道『二戶』這個地方，是怎麼來的嗎？與八戶同屬南部領地的「戶」制，二戶是「一戶至九戶」之一。","岩手縣北部的二戶市，和青森縣的八戶、三戶等地，同屬「戶」的地名群。一般認為，這是中世紀南部氏將領地劃分成「戶」的遺跡，例如「一戶」在今日的岩手縣，「九戶」也留有地名。","這些地名分散在兩個縣，也讓我們知道：地名的範圍，並不一定與今天的縣界一致。"],"quiz":{"q":"關於「二戶」（岩手縣）這個地名，下列何者才是真正的由來？","opts":["因江戶幕府官員依自己的家鄉地名直接移植而來","因戰國武將行軍經過此地時隨口命名而流傳下來","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","與八戶同屬南部領地的「戶」制，二戶是「一戶至九戶」之一。"],"correct":3,"rightFb":"沒錯！與八戶同屬南部領地的「戶」制，二戶是「一戶至九戶」之一。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":27,"npcName":"小岩茜","npcIcon":"🫖","sceneEmoji":"🏯","pages":["你知道『陸中』這個地方，是怎麼來的嗎？1868年陸奧國被分割成五國，其中「陸中」位於「陸前」與「陸奧」之間，「前・中・後」表示與京城的遠近。","古代的「陸奧國」範圍極廣。明治元年（1868年），新政府將它分成五國：陸前、陸中、陸奧、岩代、磐城。「前、中、後」的命名法來自古代「距離京城由近到遠」的排列習慣，如同「越前、越中、越後」。","「陸中」大致相當於今日岩手縣大部分地區，這也是「陸中海岸」的由來。"],"quiz":{"q":"關於「陸中」（岩手縣）這個地名，下列何者才是真正的由來？","opts":["1868年陸奧國被分割成五國，其中「陸中」位於「陸前」與「陸奧」之間，「前・中・後」表示與京城的遠近。","因戰國武將行軍經過此地時隨口命名而流傳下來","因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關"],"correct":0,"rightFb":"沒錯！1868年陸奧國被分割成五國，其中「陸中」位於「陸前」與「陸奧」之間，「前・中・後」表示與京城的 32,"npcName":"佐佐木七夏","npcIcon":"🎋","sceneEmoji":"🌫️","pages":["你知道『塩竈』這個地方，是怎麼來的嗎？「竈」是煮鹽的爐灶，「塩竈」意為製鹽的地方；相傳塩土老翁曾教導人們製鹽。","塩竈市的名稱，字面意思是「鹽（塩）的竈（灶）」，也就是用海水煮鹽的爐灶。傳說中，海神「塩土老翁」曾教導當地人們製鹽之法，成為「塩竈神社」祭祀的神明。這個地名，記載著先民用最基本的生活技術來認識土地。"],"quiz":{"q":"關於「塩竈」（宮城縣）這個地名，下列何者才是真正的由來？","opts":["「竈」是煮鹽的爐灶，「塩竈」意為製鹽的地方；相傳塩土老翁曾教導人們製鹽。","因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","傳說是某位雲遊高僧隨手一指，就定下了這個名字"],"correct":0,"rightFb":"沒錯！「竈」是煮鹽的爐灶，「塩竈」意為製鹽的地方；相傳塩土老翁曾教導人們製鹽。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":33,"npcName":"佐佐木七夏","npcIcon":"🎋","sceneEmoji":"⛰️","pages":["你知道『蔵王』這個地方，是怎麼來的嗎？蔵王山的名稱來自修驗道所信奉的「蔵王権現」，因山岳信仰而得名。","蔵王連峰橫跨宮城與山形兩縣。「蔵王」一名，來自修驗道信奉的神明「蔵王権現」，是祭祀山岳的信仰之名，並非描寫山形的字面詞彙。修驗道重視在山中修行，許多山岳名稱都與神佛信仰相關。"],"quiz":{"q":"關於「蔵王」（宮城縣）這個地名，下列何者才是真正的由來？","opts":["純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","蔵王山的名稱來自修驗道所信奉的「蔵王権現」，因山岳信仰而得名。","因戰國武將行軍經過此地時隨口命名而流傳下來","因某位藩主的姓氏諧音相近而得名，與土地本身無關"],"correct":1,"rightFb":"沒錯！蔵王山的名稱來自修驗道所信奉的「蔵王権現」，因山岳信仰而得名。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}]}],"sideQuests":[]},"秋田縣":{"mainChains":[{"id":"main-秋田縣-1","title":"秋田縣．秋田至大曲","kind":"main","opening":"小玉大地：「秋田的名字，有的是難字換好字，有的是傳說。這一段路，我帶你認識秋田縣的幾個地方：秋田、能代、大館、大曲。」","closing":"小玉大地：「行了，我講完了！下次來，還有更多的傳說等著你。」","placeIds":[34,35,36,37],"stops":[{"placeId":34,"npcName":"小玉大地","npcIcon":"👹","sceneEmoji":"🌾","pages":["你知道『秋田』這個地方，是怎麼來的嗎？古稱「齶田」，後音轉並改寫為吉祥的好字「秋田」。","秋田舊稱「齶田」，念作「あぎた」，在日本書紀等古書裡出現過。這個「齶」字十分罕見，意思是「上顎」，有人推測與河口入海的地形有關，但確切語源並不清楚。後來，人們把發音相近、字面更好看的「秋田」二字當作地名，一直沿用至今。","這是「難字換成好字」的典型例子。"],"quiz":{"q":"關於「秋田」（秋田縣）這個地名，下列何者才是真正的由來？","opts":["因某位藩主的姓氏諧音相近而得名，與土地本身無關","傳說是某位雲遊高僧隨手一指，就定下了這個名字","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","古稱「齶田」，後音轉並改寫為吉祥的好字「秋田」。"],"correct":3,"rightFb":"沒錯！古稱「齶田」，後音轉並改寫為吉祥的好字「秋田」。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}},{"placeId":35,"npcName":"小玉大地","npcIcon":"👹","sceneEmoji":"🌾","pages":["你知道『能代』這個地方，是怎麼來的嗎？古稱「野代」，同音改用「能」字，寫成「能代」。","能代舊稱「野代（のしろ）」，意思大致是「野（荒野、原野）的地方」。後來同音改寫成「能代」——「能」有「才能、能夠」的吉祥意涵，與「野」的荒涼感形成對比。這種「同音、好字化」的作法，是日本地名裡最常見的演變之一。"],"quiz":{"q":"關於「能代」（秋田縣）這個地名，下列何者才是真正的由來？","opts":["古稱「野代」， ests":[]},"石川縣":{"mainChains":[{"id":"main-石川縣-1","title":"石川縣．石川至兼六園","kind":"main","opening":"金森紗月：「石川的名字，有傳說，也有典故。這一段路，我帶你認識石川縣的幾個地方：石川、能登、七尾、兼六園。」","closing":"金森紗月：「謝謝你聽我說。下次來，我送你一片金箔。」","placeIds":[94,95,96,97],"stops":[{"placeId":94,"npcName":"金森紗月","npcIcon":"🪞","sceneEmoji":"💧","pages":["你知道『石川』這個地方，是怎麼來的嗎？一說因手取川一帶河灘多石，稱為「石川」，古代設有「石川郡」。","石川縣的名稱，來自古代的「石川郡」。一般認為，這一帶的河川（手取川）河灘有許多石頭，因此稱為「石川」。這是一個用河流特徵直接命名的例子。不過，縣名本身是明治時期取用當時的郡名，並非最古老的地名。"],"quiz":{"q":"關於「石川」（石川縣）這個地名，下列何者才是真正的由來？","opts":["傳說是某位雲遊高僧隨手一指，就定下了這個名字","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","一說因手取川一帶河灘多石，稱為「石川」，古代設有「石川郡」。","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關"],"correct":2,"rightFb":"沒錯！一說因手取川一帶河灘多石，稱為「石川」，古代設有「石川郡」。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}},{"placeId":95,"npcName":"金森紗月","npcIcon":"🪞","sceneEmoji":"🌊","pages":["你知道『能登』這個地方，是怎麼來的嗎？一說「能登」源自阿伊努語「ノッ」（岬、下巴），形容突出於海中的半島；語源另有其他說法。","能登半島像手臂一樣伸入日本海。「能登」的語源，有一說是阿伊努語的「ノッ（not）」，意思是「岬」或「下巴」，指突出於海中的地形。不過這只是其中一說，也有人認為出自古代日語。至今沒有定論。"],"quiz":{"q":"關於「能登」（石川縣）這個地名，下列何者才是真正的由來？","opts":["因江戶幕府官員依自己的家鄉地名直接移植而來","一說「能登」源自阿伊努語「ノッ」（岬、下巴），形容突出於海中的半島；語源另有其他說法。","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","因某位藩主的姓氏諧音相近而得名，與土地本身無關"],"correct":1,"rightFb":"沒錯！一說「能登」源自阿伊努語「ノッ」（岬、下巴），形容突出於海中的半島；語源另有其他說法。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":96,"npcName":"金森紗月","npcIcon":"🪞","sceneEmoji":"⛰️","pages":["你知道『七尾』這個地方，是怎麼來的嗎？七尾城建在有七條山脊（尾根）的山上，這些山脊分別有松尾、竹尾、梅尾等名，「七尾」因此得名。","中世紀，能登的守護畠山氏在山上築起七尾城。這座山有七條山脊，人們稱為「松尾、竹尾、梅尾、菊尾、亀尾、虎尾、龍尾」，合稱「七尾」。後來這個名字也成為城下町與市的名稱。這是從山形直接取名的例子。"],"quiz":{"q":"關於「七尾」（石川縣）這個地名，下列何者才是真正的由來？","opts":["因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係","傳說是某位雲遊高僧隨手一指，就定下了這個名字","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","七尾城建在有七條山脊（尾根）的山上，這些山脊分別有松尾、竹尾、梅尾等名，「七尾」因此得名。"],"correct":3,"rightFb":"沒錯！七尾城建在有七條山脊（尾根）的山上，這些山脊分別有松尾、竹尾、梅尾等名，「七尾」因此得名。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}},{"placeId":97,"npcName":"金森紗月","npcIcon":"🪞","sceneEmoji":"🌫️","pages":["你知道『兼六園』這個地方，是怎麼來的嗎？1822年松平定信取自中國《洛陽名園記》，庭園難以同時具備宏大、幽邃、人力、蒼古、水泉、眺望六種優點，這座園卻全部兼備，故名「兼六」。","兼六園是日本三名園之一。「兼六」二字，出自中國宋代《洛陽名園記》：名園很難同時擁有宏大、幽邃、人力、蒼古、水泉、眺望六種優點，而這座庭園全 ages":["你知道『甲府』這個地方，是怎麼來的嗎？「府」是國府，「甲斐の府中」簡稱為「甲府」，意為甲斐國的首府。","古代各國都設有「國府」，也稱為「府中」。甲斐國的府中被稱為「甲斐の府中」，之後簡稱為「甲府」。戰國時代，武田氏在此築起居館，甲府逐漸發展成城下町。這是把「國名＋府」合成為地名的例子。"],"quiz":{"q":"關於「甲府」（山梨縣）這個地名，下列何者才是真正的由來？","opts":["因戰國武將行軍經過此地時隨口命名而流傳下來","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","傳說是某位雲遊高僧隨手一指，就定下了這個名字","「府」是國府，「甲斐の府中」簡稱為「甲府」，意為甲斐國的首府。"],"correct":3,"rightFb":"沒錯！「府」是國府，「甲斐の府中」簡稱為「甲府」，意為甲斐國的首府。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":105,"npcName":"甲斐峻","npcIcon":"🗻","sceneEmoji":"⛰️","pages":["你知道『富士』這個地方，是怎麼來的嗎？富士山名稱的語源眾說紛紜：不二、不盡、福慈，也有阿伊努語「フチ（火之神）」一說，至今沒有定論。","富士山的語源是日本最有名的爭議之一。有「不二（無二之山）」、「不盡（不會窮盡）」等文字遊戲式的說法；《常陸國風土記》寫作「福慈」；也有一說是阿伊努語的「フチ（火之神、老奶奶）」。","「富士」二字是後來選定的好字，意為「富裕的武士」。語源至今沒有定論，是「沒有標準答案」的地名。"],"quiz":{"q":"關於「富士」（山梨縣）這個地名，下列何者才是真正的由來？","opts":["因某位藩主的姓氏諧音相近而得名，與土地本身無關","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關","富士山名稱的語源眾說紛紜：不二、不盡、福慈，也有阿伊努語「フチ（火之神）」一說，至今沒有定論。"],"correct":3,"rightFb":"沒錯！富士山名稱的語源眾說紛紜：不二、不盡、福慈，也有阿伊努語「フチ（火之神）」一說，至今沒有定論。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}]}],"sideQuests":[]},"長野縣":{"mainChains":[{"id":"main-長野縣-1","title":"長野縣．長野至木曽","kind":"main","opening":"諏訪信也：「長野的名字，很多都有『一說』與『另一說』。這一段路，我帶你認識長野縣的幾個地方：長野、信濃、軽井沢、木曽。」","closing":"諏訪信也：「講完了！記得，沒有標準答案的地名，也是一種答案。」","placeIds":[106,107,108,109],"stops":[{"placeId":106,"npcName":"諏訪信也","npcIcon":"🏔️","sceneEmoji":"🌾","pages":["你知道『長野』這個地方，是怎麼來的嗎？一說「長野」意為「長長的原野」，指善光寺平一帶的地形；語源另有其他說法。","長野的名字，一般認為是「長い野（長長的原野）」，形容善光寺平一帶的地形。也有人認為它與古代的「長野郷」或人名有關。長野市是以善光寺為中心發展的門前町，後來成為縣廳所在地。"],"quiz":{"q":"關於「長野」（長野縣）這個地名，下列何者才是真正的由來？","opts":["純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係","因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","一說「長野」意為「長長的原野」，指善光寺平一帶的地形；語源另有其他說法。"],"correct":3,"rightFb":"沒錯！一說「長野」意為「長長的原野」，指善光寺平一帶的地形；語源另有其他說法。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}},{"placeId":107,"npcName":"諏訪信也","npcIcon":"🏔️","sceneEmoji":"🌾","pages":["你知道『信濃』這個地方，是怎麼來的嗎？古稱「科野」，一說指山地的階梯狀地形，一說指「科（シナ）樹」多的野地。","長野縣古稱「信濃國」，古寫作「科野」。「しな」的意思有多種說法：一說是「階（しな）」，指多重階梯般的山地地形；另一說是「科（シナノキ）」這種樹木很多的原野。奈良時代以好字令，改寫成「信濃」。至今仍未有定論。"],"quiz":{"q": 2,"npcName":"飛騨花乃","npcIcon":"🏡","sceneEmoji":"🌾","pages":["你知道『美濃』這個地方，是怎麼來的嗎？一說「美濃」原為「御野」，是對天子御料地的尊稱；另有其他說法。","美濃是岐阜縣南部的舊國名。「みの」的語源有多種說法，其中一說是「御野（みの）」，意為尊貴的原野。後來以好字改寫成「美濃」，「美」是美好，「濃」是濃厚豐饒。這是把發音留下、字面換成好字的例子。"],"quiz":{"q":"關於「美濃」（岐阜縣）這個地名，下列何者才是真正的由來？","opts":["只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關","傳說是某位雲遊高僧隨手一指，就定下了這個名字","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","一說「美濃」原為「御野」，是對天子御料地的尊稱；另有其他說法。"],"correct":3,"rightFb":"沒錯！一說「美濃」原為「御野」，是對天子御料地的尊稱；另有其他說法。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}},{"placeId":113,"npcName":"飛騨花乃","npcIcon":"🏡","sceneEmoji":"🌾","pages":["你知道『関ヶ原』這個地方，是怎麼來的嗎？古代的三關之一「不破關」位於此地，「關之原」因此得名「関ヶ原」。","古代日本在通往東國的要衝設有關卡，其中「不破關（ふわのせき）」位於今岐阜縣。「関ヶ原」意為「關口所在的原野」。1600年的關原之戰就發生在這個地方，這場戰役決定了德川家康的天下，也讓這個地名成為日本史上的代名詞。"],"quiz":{"q":"關於「関ヶ原」（岐阜縣）這個地名，下列何者才是真正的由來？","opts":["古代的三關之一「不破關」位於此地，「關之原」因此得名「関ヶ原」。","因江戶幕府官員依自己的家鄉地名直接移植而來","純粹是地方領主附庸風雅、隨意取的吉祥字，並無實際典故","因戰國武將行軍經過此地時隨口命名而流傳下來"],"correct":0,"rightFb":"沒錯！古代的三關之一「不破關」位於此地，「關之原」因此得名「関ヶ原」。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}}]}],"sideQuests":[]},"靜岡縣":{"mainChains":[{"id":"main-靜岡縣-1","title":"靜岡縣．静岡至伊豆","kind":"main","opening":"牧野茶々：「靜岡的名字，有避開不吉，也有傳說。這一段路，我帶你認識靜岡縣的幾個地方：静岡、浜松、熱海、伊豆。」","closing":"牧野茶々：「講完了。來，喝杯新茶再走吧。」","placeIds":[114,115,116,117],"stops":[{"placeId":114,"npcName":"牧野茶々","npcIcon":"🍵","sceneEmoji":"🌫️","pages":["你知道『静岡』這個地方，是怎麼來的嗎？1869年由「府中」改稱；因「賤」有卑賤之意，避開而改用「静」，以「静岡」為名。","靜岡舊稱「駿府」，也稱「府中」。1869年（明治二年），德川家移封至此，因為「府中」在各地重複，需要新的名字。當時附近有座「賤機山（しずはたやま）」，人們認為「賤」字不吉，便取同樣讀音的「静」，加上「岡」，成為「静岡」。","這是避免不吉字眼而改字的典型例子。"],"quiz":{"q":"關於「静岡」（靜岡縣）這個地名，下列何者才是真正的由來？","opts":["因某位藩主的姓氏諧音相近而得名，與土地本身無關","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","傳說是某位雲遊高僧隨手一指，就定下了這個名字","1869年由「府中」改稱；因「賤」有卑賤之意，避開而改用「静」，以「静岡」為名。"],"correct":3,"rightFb":"沒錯！1869年由「府中」改稱；因「賤」有卑賤之意，避開而改用「静」，以「静岡」為名。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}},{"placeId":115,"npcName":"牧野茶々","npcIcon":"🍵","sceneEmoji":"💧","pages":["你知道『浜松』這個地方，是怎麼來的嗎？舊稱「引馬（ひくま）」，德川家康認為「引馬」聯想到敗走，因而改為「浜松」。","浜松舊稱「引馬（ひくま）」。傳說1570年德川家康進入這裡後，覺得「引馬」（牽馬退走）聽起來像戰敗撤退，很不吉利，便改稱「浜松」。這個說法流傳很廣，但改名的時間與細節，史料並不完整。這是因為「忌諱」而改名的例子 Chains":[{"id":"main-滋賀縣-1","title":"滋賀縣．滋賀至彦根","kind":"main","opening":"浅井湖太：「滋賀的名字，有『近』與『遠』，也有湖的形狀。這一段路，我帶你認識滋賀縣的幾個地方：滋賀、近江、琵琶湖、彦根。」","closing":"浅井湖太：「講完了。記得，湖永遠在這裡等你。」","placeIds":[126,127,128,129],"stops":[{"placeId":126,"npcName":"浅井湖太","npcIcon":"🎣","sceneEmoji":"💧","pages":["你知道『滋賀』這個地方，是怎麼來的嗎？古稱「志賀」，一說「シガ」意指石多的湖岸，後改寫為「滋賀」。","滋賀縣名來自古代的「志賀郡」。「しが」的語源，一說是「石（いし）が多い湖岸」；另有其他說法。後來的漢字「滋賀」，「滋」有滋潤、繁盛之意，是取好字的結果。縣名的由來，與琵琶湖的湖岸有關。"],"quiz":{"q":"關於「滋賀」（滋賀縣）這個地名，下列何者才是真正的由來？","opts":["傳說是某位雲遊高僧隨手一指，就定下了這個名字","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","因戰國武將行軍經過此地時隨口命名而流傳下來","古稱「志賀」，一說「シガ」意指石多的湖岸，後改寫為「滋賀」。"],"correct":3,"rightFb":"沒錯！古稱「志賀」，一說「シガ」意指石多的湖岸，後改寫為「滋賀」。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}},{"placeId":127,"npcName":"浅井湖太","npcIcon":"🎣","sceneEmoji":"🌊","pages":["你知道『近江』這個地方，是怎麼來的嗎？古稱「近つ淡海」，意為「近的淡水湖」，指琵琶湖；與「遠つ淡海（遠江，濱名湖）」相對。","古代的近畿，人們稱琵琶湖為「淡海（あふみ）」，意為淡水的湖。因為琵琶湖離京城較近，稱為「近つ淡海」，簡稱「近江」；離京城較遠的濱名湖（今靜岡縣西部），則稱為「遠つ淡海」，也就是「遠江」。","「近」與「遠」，是以京城為基準的稱呼。"],"quiz":{"q":"關於「近江」（滋賀縣）這個地名，下列何者才是真正的由來？","opts":["因戰國武將行軍經過此地時隨口命名而流傳下來","古稱「近つ淡海」，意為「近的淡水湖」，指琵琶湖；與「遠つ淡海（遠江，濱名湖）」相對。","因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關"],"correct":1,"rightFb":"沒錯！古稱「近つ淡海」，意為「近的淡水湖」，指琵琶湖；與「遠つ淡海（遠江，濱名湖）」相對。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}},{"placeId":128,"npcName":"浅井湖太","npcIcon":"🎣","sceneEmoji":"🌊","pages":["你知道『琵琶湖』這個地方，是怎麼來的嗎？一般認為因湖的形狀像樂器「琵琶」而得名；古時稱為「淡海」、「鳰の海」。","琵琶湖是日本最大的湖。古時候，人們稱它為「淡海（あわうみ）」或「鳰（にお）の海」。「琵琶湖」這個名字，一般認為是江戶時代以後才普及的，因為它的形狀很像樂器「琵琶」。另一說與湖中竹生島祭祀的弁才天有關，因為弁才天手持琵琶。"],"quiz":{"q":"關於「琵琶湖」（滋賀縣）這個地名，下列何者才是真正的由來？","opts":["因江戶幕府官員依自己的家鄉地名直接移植而來","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","一般認為因湖的形狀像樂器「琵琶」而得名；古時稱為「淡海」、「鳰の海」。","因戰國武將行軍經過此地時隨口命名而流傳下來"],"correct":2,"rightFb":"沒錯！一般認為因湖的形狀像樂器「琵琶」而得名；古時稱為「淡海」、「鳰の海」。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":129,"npcName":"浅井湖太","npcIcon":"🎣","sceneEmoji":"⛰️","pages":["你知道『彦根』這個地方，是怎麼來的嗎？一說得名於神名「天津彦根命」，或彥根山；語源尚無定論。","彥根城下的地名，一般說法是來自古代神明「天津彥根命（あまつひこねのみこと）」，或這位神明所在的「彥根山」。也有其他說法。1603年，井伊直繼開始築彥根城，這座城下町便以「彥根」為名。"],"quiz":{"q":"關於「彦根」（滋賀縣）這個地名，下列何者才是真 3,"npcName":"伊予柑奈","npcIcon":"🍊","sceneEmoji":"⛰️","pages":["你知道『松山』這個地方，是怎麼來的嗎？一說加藤嘉明築城時，將「勝山」改名為「松山」；語源另有其他說法。","松山是愛媛縣的縣廳所在地。1602年，加藤嘉明開始在「勝山」築城，城下町後來稱為「松山」。一般說法是：因為這座山上松樹很多，於是改稱「松山」，也有其他說法。無論如何，這座城池的名字，後來成為整座城市的名稱。"],"quiz":{"q":"關於「松山」（愛媛縣）這個地名，下列何者才是真正的由來？","opts":["因戰國武將行軍經過此地時隨口命名而流傳下來","因某位藩主的姓氏諧音相近而得名，與土地本身無關","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關","一說加藤嘉明築城時，將「勝山」改名為「松山」；語源另有其他說法。"],"correct":3,"rightFb":"沒錯！一說加藤嘉明築城時，將「勝山」改名為「松山」；語源另有其他說法。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}},{"placeId":184,"npcName":"伊予柑奈","npcIcon":"🍊","sceneEmoji":"🌫️","pages":["你知道『今治』這個地方，是怎麼來的嗎？一說「今治（いまばり）」意為新開墾的土地，「今」是新，「治（はり）」是開墾。","今治位於瀨戶內海沿岸，以造船與毛巾聞名。「いまばり」的語源，一般說法是「今（新）」加上「墾（はり）」，也就是新近開墾的土地。江戶時代初期，藤堂高虎在此築今治城，發展為城下町。這個說法為一般說法，也有其他說法。"],"quiz":{"q":"關於「今治」（愛媛縣）這個地名，下列何者才是真正的由來？","opts":["傳說是某位雲遊高僧隨手一指，就定下了這個名字","一說「今治（いまばり）」意為新開墾的土地，「今」是新，「治（はり）」是開墾。","因戰國武將行軍經過此地時隨口命名而流傳下來","因某位藩主的姓氏諧音相近而得名，與土地本身無關"],"correct":1,"rightFb":"沒錯！一說「今治（いまばり）」意為新開墾的土地，「今」是新，「治（はり）」是開墾。","wrongFb":"再猜一次！別被似是而非的說法騙了。"}}]}],"sideQuests":[]},"高知縣":{"mainChains":[{"id":"main-高知縣-1","title":"高知縣．高知至室戸","kind":"main","opening":"桂竜介：「高知的名字，有避諱，有河，也有月亮。這一段路，我帶你認識高知縣的幾個地方：高知、四万十、桂浜、室戸。」","closing":"桂竜介：「講完了！下次來，我請你吃剛捕上來的鰹魚。」","placeIds":[185,186,187,188],"stops":[{"placeId":185,"npcName":"桂竜介","npcIcon":"🐟","sceneEmoji":"🌾","pages":["你知道『高知』這個地方，是怎麼來的嗎？山內一豐築城的山原稱「河中山」，因水患而嫌不吉，改為「高智山」，後寫成「高知」。","1601年，山內一豐在大高坂山築城。這座山被稱為「河中山」，但因為河川多次氾濫，「河中」聽起來像是被河水淹沒，很不吉利，於是改為「高智山」，後來又寫成「高知」。","這是「避諱＋換字」的例子，名字的改變，反映了當時人對水患的恐懼。"],"quiz":{"q":"關於「高知」（高知縣）這個地名，下列何者才是真正的由來？","opts":["因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","只是古地圖抄寫時的誤植，將錯就錯沿用至今，與地方歷史無關","因這裡曾發生一場合戰，勝方直接以自己的姓氏重新命名此地","山內一豐築城的山原稱「河中山」，因水患而嫌不吉，改為「高智山」，後寫成「高知」。"],"correct":3,"rightFb":"沒錯！山內一豐築城的山原稱「河中山」，因水患而嫌不吉，改為「高智山」，後寫成「高知」。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":186,"npcName":"桂竜介","npcIcon":"🐟","sceneEmoji":"🌫️","pages":["你知道『四万十』這個地方，是怎麼來的嗎？語源沒有定論，有「支流有四萬十條」的俗說，也有阿伊努語、古語等其他說法。","四萬十川被稱為日本最後的清流。名稱的由來至今沒有定論。有一個有趣的俗說是：它的支流數目據說有「四萬十條」，所以叫「四万十」，但實際上支流沒有這麼多。也有學者從古語或其他語言中 道『唐津』這個地方，是怎麼來的嗎？「津」是港口，唐津是通往大陸（唐）的港口，是古代對外交流的玄關。","唐津位於九州西北端，隔海面對朝鮮半島與中國大陸。「唐」在古代日本泛指中國與朝鮮半島，「津」是港口，唐津就是「通往唐的港口」。這裡自古以來是連結日本與大陸的門戶，也是唐津燒等陶瓷文化的發祥地。"],"quiz":{"q":"關於「唐津」（佐賀縣）這個地名，下列何者才是真正的由來？","opts":["因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","「津」是港口，唐津是通往大陸（唐）的港口，是古代對外交流的玄關。","因江戶幕府官員依自己的家鄉地名直接移植而來","因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係"],"correct":1,"rightFb":"沒錯！「津」是港口，唐津是通往大陸（唐）的港口，是古代對外交流的玄關。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":195,"npcName":"有田陶太","npcIcon":"🏺","sceneEmoji":"🌫️","pages":["你知道『鳥栖』這個地方，是怎麼來的嗎？一般認為與「鳥的巢」有關，「栖」是棲息之地，指鳥聚集棲息的地方。","鳥栖是九州的交通要衝，鐵路與公路在此交會。名稱的由來，一般說法是「鳥の栖」，意為鳥的棲息之地，可能是古代這裡是鳥類聚集的沼澤或森林。至於是否與其他語源有關，也有不同說法。"],"quiz":{"q":"關於「鳥栖」（佐賀縣）這個地名，下列何者才是真正的由來？","opts":["一般認為與「鳥的巢」有關，「栖」是棲息之地，指鳥聚集棲息的地方。","因明治時期官員憑空拼湊漢字命名，與當地原有的稱呼毫無關係","因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","因江戶幕府官員依自己的家鄉地名直接移植而來"],"correct":0,"rightFb":"沒錯！一般認為與「鳥的巢」有關，「栖」是棲息之地，指鳥聚集棲息的地方。","wrongFb":"……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}]}],"sideQuests":[]},"長崎縣":{"mainChains":[{"id":"main-長崎縣-1","title":"長崎縣．出島至対馬","kind":"main","opening":"中島ほのか：「長崎的名字，有島，有溫泉，也有世界的窗口。這一段路，我帶你認識長崎縣的幾個地方：出島、雲仙、五島、対馬。」","closing":"中島ほのか：「講完了。記得，港口永遠在等你回來。」","placeIds":[197,198,199,200],"stops":[{"placeId":197,"npcName":"中島ほのか","npcIcon":"🏮","sceneEmoji":"🌊","pages":["你知道『出島』這個地方，是怎麼來的嗎？1634年為了集中管理外國人而填築的人工島，形似扇形，故稱「出島」。","1634年，江戶幕府為了集中管理來到長崎的葡萄牙人，命令商人出資，在長崎港內填築一座扇形的人工島。由於這座島是「突出」到海裡的，因此稱為「出島」。1641年荷蘭商館遷到這裡之後，出島成為江戶時代日本唯一對西方開放的窗口。"],"quiz":{"q":"關於「出島」（長崎縣）這個地名，下列何者才是真正的由來？","opts":["因戰國武將行軍經過此地時隨口命名而流傳下來","傳說是某位雲遊高僧隨手一指，就定下了這個名字","因某位藩主的姓氏諧音相近而得名，與土地本身無關","1634年為了集中管理外國人而填築的人工島，形似扇形，故稱「出島」。"],"correct":3,"rightFb":"沒錯！1634年為了集中管理外國人而填築的人工島，形似扇形，故稱「出島」。","wrongFb":"灰霧又濃了一點……再回想一下剛剛聽到的內容吧。"}},{"placeId":198,"npcName":"中島ほのか","npcIcon":"🏮","sceneEmoji":"⛰️","pages":["你知道『雲仙』這個地方，是怎麼來的嗎？古稱「温泉山（うんぜんさん）」，音讀「温泉」，後來改用「雲仙」，意象更優美。","雲仙的溫泉在江戶時代已經很有名，山被稱為「温泉山」，音讀就是「うんぜん」。後來，為了取好字，人們把音讀寫成「雲仙」，讓這個名字多了仙人乘雲的意象。這是「先有聲音、後換漢字」的例子，「雲」與「仙」原本並不是地名的意思。"],"quiz":{"q":"關於「雲仙」（長崎縣）這個地名，下列何者才是真正的由來？","opts":["因地形形似某種動物，先民依外觀直接命名，與語言或墾殖無關","因這裡曾發生一場合戰， function escapeHtml(str){

// 音訊系統
//   背景音樂：外部 mp3（與本 HTML 放在同一個資料夾即可，檔名如下）
//   音效：Web Audio API 即時合成，不需任何外部檔案

const BGM_FILES = {
  lobby:   "bgm_lobby.mp3",    // 大廳／標題／地圖／圖鑑／挑戰
  north:   "bgm_north.mp3",    // 北部
  central: "bgm_central.mp3",  // 中部
  south:   "bgm_south.mp3",    // 南部
  east:    "bgm_east.mp3",     // 東部
  island:  "bgm_island.mp3",   // 離島
  challenge:"bgm_challenge.mp3" // 挑戰
};
const BGM_FOLDER = "";   // 若把音樂放在子資料夾，改成 "audio/" 即可

/* ===== 離線資料包：從網站（GitHub Pages）下載首頁、圖檔資源包、背景音樂，存進瀏覽器，沒網路也能玩 =====
   AUTO_OFFLINE_DOWNLOAD = true  → 打開遊戲後自動在背景下載（不詢問）
   AUTO_OFFLINE_DOWNLOAD = false → 打開遊戲後跳出提示列，按「下載」才開始 */
const AUTO_OFFLINE_DOWNLOAD = false;

const Offline = (function(){
  const CACHE = "offline-pack-v1";
  const SNOOZE_KEY = "offline-pack-snooze-until";
  const supported = ("serviceWorker" in navigator) && ("caches" in window) && /^https?:$/.test(location.protocol);
  let ui = null, banner = null, busy = false;

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  function files(){
    const base = new URL(".", location.href);
    const list = [
      {p:"index.html", w:2}, {p:"assets/characters.manifest.json", w:.01}, {p:"assets/characters.pack", w:15},
      {p:"assets/scenes.manifest.json", w:.01}, {p:"assets/scenes.pack", w:1.7}
    ];
    Object.keys(BGM_FILES).forEach(function(k){ list.push({p:BGM_FOLDER + BGM_FILES[k], w:4.3, audio:true}); });
    const out = list.map(function(f){ f.url = new URL(f.p, base).href; return f; });
    const here = location.origin + location.pathname;
    if (!out.some(function(f){ return f.url === here; })) out.push({p:"(首頁網址)", w:0, url:here, page:true});
    return out;
  }

  // 同時更新「設定」視窗與提示列的狀態
  function show(msg, frac){
    if (ui && ui.st.isConnected){
      ui.st.textContent = msg;
      ui.bar.style.display = (frac == null) ? "none" : "block";
      if (frac != null) ui.fill.style.width = Math.round(frac*100) + "%";
    }
    if (banner && banner.el.isConnected){
      banner.msg.textContent = msg;
      banner.barWrap.style.display = (frac == null) ? "none" : "block";
      if (frac != null) banner.fill.style.width = Math.round(frac*100) + "%";
    }
  }

  async function status(){
    const cache = await caches.open(CACHE);
    const have = new Set((await cache.keys()).map(function(r){ return r.url; }));
    const list = files();
    const core = list.filter(function(f){ return !f.audio; });
    const aud = list.filter(function(f){ return f.audio; });
    return { coreOk: core.every(function(f){ return have.has(f.url); }),
             audOk: aud.filter(function(f){ return have.has(f.url); }).length, audTotal: aud.length };
  }

  async function refresh(){
    if (!supported){
      show(location.protocol === "file:" ? "目前是直接開啟檔案，無法使用離線功能。請用網址（https）開啟遊戲。" : "這個瀏覽器不支援離線功能。");
      return;
    }
    const st = await status();
    if (st.coreOk && st.audOk === st.audTotal) show("✅ 已可離線遊玩（圖檔＋音樂 " + st.audOk + "／" + st.audTotal + " 首都已存好）");
    else if (st.coreOk) show("⚠️ 圖檔已備妥，但音樂只存了 " + st.audOk + "／" + st.audTotal + " 首，請再按一次下載。");
    else show("尚未下載。建議在有網路（Wi-Fi）時下載，約 47 MB。");
  }

  async function download(){
    if (busy || !supported) return;
    busy = true;
    const list = files(), totalW = list.reduce(function(a,f){ return a + f.w; }, 0) || 1;
    let doneW = 0; const missing = [], failed = [];
    try{
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
      const cache = await caches.open(CACHE);
      for (let i = 0; i < list.length; i++){
        const f = list[i];
        show("下載中：" + f.p, doneW / totalW);
        try{
          const res = await fetch(f.url, {cache:"reload"});
          const type = res.headers.get("content-type") || "";
          if (!res.ok || (f.audio && /text\/html/i.test(type))) throw new Error("missing");
          const len = +res.headers.get("content-length") || 0;
          const chunks = []; let got = 0;
          if (res.body && res.body.getReader){
            const rd = res.body.getReader();
            for (;;){
              const r = await rd.read(); if (r.done) break;
              chunks.push(r.value); got += r.value.length;
              if (len) show("下載中：" + f.p + "（" + Math.round(got/len*100) + "%）", (doneW + f.w * got/len) / totalW);
            }
          } else { chunks.push(new Uint8Array(await res.arrayBuffer())); }
          const blob = new Blob(chunks, {type: type});
          await cache.put(f.url, new Response(blob, {status:200, headers:{"Content-Type": type || (f.audio ? "audio/mpeg" : "application/octet-stream"), "Content-Length": String(blob.size)}}));
        }catch(e){
          if (f.audio) missing.push(f.p); else if (!f.page) failed.push(f.p);
        }
        doneW += f.w;
      }
      const bad = failed.length || missing.length;
      await refresh();
      if (bad) show("⚠️ 有檔案下載失敗（" + failed.concat(missing).join("、") + "），請檢查網路後重試。", null);
      else show("✅ 離線資料包下載完成！之後沒有網路也能玩。", null);
      if (typeof toast === "function") toast(bad ? "離線資料包未完整下載" : "離線資料包下載完成");
      if (banner && banner.el.isConnected){
        banner.btns.style.display = bad ? "flex" : "none";
        banner.dl.textContent = "重試";
        if (!bad) setTimeout(closeBanner, 3500);
      }
    }catch(err){
      show("下載失敗：" + (err && err.message ? err.message : err), null);
    }finally{ busy = false; }
  }

  async function clear(){
    if (busy || !supported) return;
    await caches.delete(CACHE);
    await refresh();
  }

  function closeBanner(){ if (banner){ banner.el.remove(); banner = null; } }

  function openBanner(){
    if (banner) return;
    const el = document.createElement("div");
    el.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;max-width:520px;margin:0 auto;z-index:10001;padding:12px 14px;border-radius:12px;background:#efe4c9;color:#2b2119;border:1px solid #c9b489;box-shadow:0 6px 20px rgba(0,0,0,.45);font-size:.85rem;line-height:1.6";
    el.innerHTML =
      '<div style="font-weight:700;margin-bottom:2px">📦 下載離線資料包？</div>'+
      '<div class="ob-msg">下載後沒有網路也能玩（圖檔＋音樂，約 47 MB，建議使用 Wi-Fi）。</div>'+
      '<div class="ob-bar" style="display:none;height:9px;border-radius:5px;background:rgba(0,0,0,.18);overflow:hidden;margin:6px 0"><div class="ob-fill" style="height:100%;width:0;background:#4f7a63;transition:width .2s"></div></div>'+
      '<div class="ob-btns" style="display:flex;gap:8px;margin-top:8px"><button class="brass-btn small ob-dl">⬇ 下載</button><button class="brass-btn small ghost ob-later">稍後</button></div>';
    document.body.appendChild(el);
    banner = { el: el, msg: el.querySelector(".ob-msg"), barWrap: el.querySelector(".ob-bar"), fill: el.querySelector(".ob-fill"),
               btns: el.querySelector(".ob-btns"), dl: el.querySelector(".ob-dl") };
    banner.dl.addEventListener("click", function(){ banner.btns.style.display = "none"; download(); });
    el.querySelector(".ob-later").addEventListener("click", function(){
      lsSet(SNOOZE_KEY, String(Date.now() + 3*24*3600*1000));   // 稍後：3 天內不再提示（仍可到 ⚙️ 設定手動下載）
      closeBanner();
    });
  }

  function whenGameReady(cb){
    let tries = 0;
    (function poll(){
      const l = document.getElementById("screen-loading");
      const done = !l || l.classList.contains("hidden") || l.style.display === "none";
      if (done || ++tries > 120) cb(); else setTimeout(poll, 500);
    })();
  }

  async function startup(){
    try{
      await navigator.serviceWorker.register("sw.js");
      if (!navigator.onLine) return;                       // 已離線就不用提示
      const st = await status();
      if (st.coreOk && st.audOk === st.audTotal) return;   // 已經下載完整
      if (AUTO_OFFLINE_DOWNLOAD){ download(); return; }
      if (Date.now() < Number(lsGet(SNOOZE_KEY) || 0)) return;
      openBanner();
    }catch(e){ console.warn('offline startup', e); }
  }

  if (supported){
    window.addEventListener("load", function(){ whenGameReady(startup); });
  }

  function bind(root){
    ui = { st: root.querySelector("#off-status"), bar: root.querySelector("#off-bar"), fill: root.querySelector("#off-fill") };
    const dl = root.querySelector("#off-dl"), del = root.querySelector("#off-del");
    if (!supported){ dl.disabled = true; del.disabled = true; }
    dl.addEventListener("click", function(){ sfx("click"); download(); });
    del.addEventListener("click", function(){ sfx("click"); clear(); });
    if (busy) show("下載中…", null); else refresh();
  }
  return { bind: bind };
})();

const Audio_ = {
  enabled: true,
  bgmVol: 0.45,
  sfxVol: 0.55,
  cur: null,          // 目前播放的 key
  els: {},            // key -> HTMLAudioElement
  unlocked: false,
  ctx: null,
  fadeTimer: null,

  el(key){
    if (!this.els[key]){
      const a = new Audio(BGM_FOLDER + BGM_FILES[key]);
      a.loop = true; a.preload = "none"; a.volume = 0;
      a.addEventListener("error", ()=>{ /* 檔案不存在就安靜略過 */ });
      this.els[key] = a;
    }
    return this.els[key];
  },

  play(key){
    if (!BGM_FILES[key]) return;
    if (this.cur === key && this.enabled) return;
    const prev = this.cur ? this.els[this.cur] : null;
    this.cur = key;
    if (!this.enabled || !this.unlocked) return;
    const next = this.el(key);
    next.play().catch(()=>{});
    this.fade(prev, next);
  },

  fade(prev, next){
    if (this.fadeTimer) clearInterval(this.fadeTimer);
    const target = this.bgmVol;
    let t = 0;
    this.fadeTimer = setInterval(()=>{
      t += 0.06;
      if (prev) prev.volume = Math.max(0, target * (1 - t));
      if (next) next.volume = Math.min(target, target * t);
      if (t >= 1){
        clearInterval(this.fadeTimer); this.fadeTimer = null;
        if (prev && prev !== next){ prev.pause(); prev.currentTime = 0; }
      }
    }, 45);
  },

  applyVolume(){
    Object.keys(this.els).forEach(k=>{
      this.els[k].volume = (this.enabled && k === this.cur) ? this.bgmVol : 0;
    });
  },

  setEnabled(on){
    this.enabled = on;
    if (!on){
      Object.keys(this.els).forEach(k=>{ this.els[k].pause(); });
    } else if (this.cur){
      const a = this.el(this.cur); a.volume = this.bgmVol; a.play().catch(()=>{});
    }
  },

  unlock(){
    if (this.unlocked) return;
    this.unlocked = true;
    try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ this.ctx = null; }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(()=>{});
    const k = this.cur || "lobby";
    this.cur = null; this.play(k);
  },

  // ---- 音效：以振盪器合成 ----
  tone(freq, dur, type, vol, delay, sweepTo){
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, (vol||0.3) * this.sfxVol), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  noise(dur, vol){
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = (vol||0.15) * this.sfxVol;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start();
  },
  sfx(name){
    switch(name){
      case "click":    this.tone(660, 0.07, "triangle", 0.22); break;
      case "type":     this.tone(1400, 0.02, "square", 0.05); break;
      case "page":     this.tone(520, 0.09, "triangle", 0.18); this.tone(780, 0.09, "triangle", 0.12, 0.05); break;
      case "correct":  this.tone(784, 0.13, "sine", 0.32); this.tone(988, 0.13, "sine", 0.3, 0.1);
                       this.tone(1319, 0.3, "sine", 0.28, 0.2); break;
      case "wrong":    this.tone(300, 0.2, "sawtooth", 0.22, 0, 150);
                       this.tone(220, 0.28, "sawtooth", 0.18, 0.12, 110); break;
      case "discover": this.tone(880, 0.1, "sine", 0.26); this.tone(1175, 0.1, "sine", 0.24, 0.09);
                       this.tone(1568, 0.36, "sine", 0.26, 0.18); break;
      case "yokai":    this.tone(180, 0.5, "sawtooth", 0.2, 0, 90); this.noise(0.5, 0.12); break;
      case "complete": [523,659,784,1047].forEach((f,i)=> this.tone(f, 0.32, "sine", 0.28, i*0.13)); break;
      case "select":   this.tone(523, 0.08, "sine", 0.25); this.tone(784, 0.12, "sine", 0.22, 0.07); break;
      case "fail":     this.tone(392, 0.25, "triangle", 0.25); this.tone(294, 0.4, "triangle", 0.22, 0.2); break;
    }
  }
};
["pointerdown","keydown","touchstart"].forEach(ev=>{
  window.addEventListener(ev, ()=>Audio_.unlock(), {once:true});
});
function sfx(n){ Audio_.sfx(n); }

function playerIcon(){ const c = curChar(); return c ? c.icon : "🧭"; }

// 旅程順序：以主角家鄉為起點，依序輪轉一圈
function regionOrder(){
  const home = state.homeRegion || REGION_ORDER[0];
  const i = Math.max(0, REGION_ORDER.indexOf(home));
  return REGION_ORDER.slice(i).concat(REGION_ORDER.slice(0, i));
}
function isRegionUnlocked(regionId){
  const order = regionOrder();
  const idx = order.indexOf(regionId);
  if (idx <= 0) return true;
  return !!state.regionDone[order[idx-1]];
}
function nextRegionName(afterId){
  const order = regionOrder();
  const i = order.indexOf(afterId);
  if (i < 0 || i+1 >= order.length) return null;
  const r = REGIONS.find(x=>x.id===order[i+1]);
  return r ? r.name : null;
}
// 這一區在旅程中的位置（0 = 主角家鄉、最後一個 = 旅程終點）
function isFirstRegion(regionId){ return regionOrder().indexOf(regionId) === 0; }
function isLastRegion(regionId){ const o = regionOrder(); return o.indexOf(regionId) === o.length-1; }
// 夥伴台詞守門：還沒入隊的夥伴不會在劇情裡說話
function castAllowed(key, region){
  if (!COMPANIONS[key]) return true;                       // 苔野婆婆、忘名妖等不受限
  if (state.party && state.party.indexOf(key) >= 0) return true;
  if (region && (key === region.companion || key === region.extraCompanion)) return true;
  return false;
}
// 條件台詞：#done:east# / #!done:east# 前綴，依旅程進度決定是否出現
function lineCondOk(cond, region){
  const neg = cond.charAt(0) === "!";
  const c = neg ? cond.slice(1) : cond;
  let v = true;
  if (c.indexOf("done:") === 0) v = !!state.regionDone[c.slice(5)];
  else if (c === "last")  v = !!(region && isLastRegion(region.id));    // 本區是旅程最後一區
  else if (c === "first") v = !!(region && isFirstRegion(region.id));   // 本區是旅程第一區
  return neg ? !v : v;
}
function filterCastLines(lines, region){
  const out = [];
  (lines||[]).forEach(l => {
    let t = l, skip = false, cm;
    while ((cm = /^#([^#]+)#/.exec(t))){                     // 可連續疊加多個條件：#done:island##!done:east#
      if (!lineCondOk(cm[1], region)) skip = true;
      t = t.slice(cm[0].length);
    }
    if (skip) return;
    const m = /^@(\w+)@/.exec(t);
    if (m && !castAllowed(m[1], region)) return;
    out.push(t);
  });
  return out;
}

function regionStats(region){
  let total=0, done=0;
  region.counties.forEach(c => {
    (placesByCounty[c]||[]).forEach(p => { total++; if (state.discovered[p.id]) done++; });
  });
  return {total, done};
}

  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2700);
}

function openModal(innerHtml, opts){
  opts = opts||{};
  const root = document.getElementById("modal-root");
  const back = document.createElement("div");
  back.className = "modal-back" + (opts.center?" center":"");
  back.innerHTML = '<div class="paper-panel modal-sheet"><button class="modal-close">✕</button>'+innerHtml+'</div>';

  back.querySelector(".modal-close").addEventListener("click", ()=>back.remove());
  root.appendChild(back);
  return back;

  ["river",    /溪|河|潭|湖|圳|泉|瀑布|水返|陂|水庫/],
  ["mountain", /山|嶽|岳|火山|嶺|峰|崙|崎|巖|岩|丘陵|台地|坑谷|部落|高山|雲霧/],
  ["forest",   /森林|樹林|林地|檜|樟|竹林|叢生|林木|巨木/],

  ["oldstreet",/老街|街市|市街|商街|店舖|街屋|亭仔腳|市集/],
  ["city",     /市區|都會|區公所|車站|鐵路|捷運|商圈|夜市|工業區|科學園區|行政區/]

function sceneForText(t){
  t = t || "";
  for (let i=0;i<SCENE_RULES.length;i++){ if (SCENE_RULES[i][1].test(t)) return SCENE_RULES[i][0]; }
  return "oldstreet";
}
function stopScene(stop){
  if (stop.scene && SCENE_BG[stop.scene]) return stop.scene;
  if (stop._sc) return stop._sc;
  const p = placesData && placesData[stop.placeId];
  const txt = (stop.pages||[]).join("") + (p ? (p.n||"")+(p.d||"") : "");
  stop._sc = sceneForText(txt);
  return stop._sc;
}
// 各大區的預設開場場景（同樣是通用圖，只是挑一張最貼近該區印象的）
const REGION_BG = { north:"harbor", central:"field", south:"oldstreet", east:"mountain", island:"ocean" };
let curSceneBg = null;
let curTopbarSceneName = null; // 目前在對話中顯示於左上角的場景名稱（取代玩家名字）
function setSceneBg(id){

// 場景切換時插入一句旁白，讓劇情多一層畫面感
function sceneNarration(id, seed){
  const sb = SCENE_BG[id]; if (!sb) return null;
  const f = sb.flavor[(seed||0) % sb.flavor.length];
  return {type:"line", speaker:"旁白", text:f, bg:id};
}
const dlgTapHintEl = () => document.getElementById("dlg-tap-hint");
const dlgBoxEl = () => document.getElementById("dlg-box");

let dlgSteps = [], dlgIdx = -1, typing=null, dlgOnDone=null, dlgCurScene="🌫️", dlgCurLabel="";
let challengeScore = 0;

function speakerInfo(key){
  if (key==="mentor") return MENTOR;
  if (key==="player" || key==="me") return {name: playerName(), icon: playerIcon()};
  if (COMPANIONS[key]) return COMPANIONS[key];
  return null;
}

// 取一句符合主角個性的台詞（kind: greet/arrive/curious/yokai/right/clear）
function pline(kind, ctx){
  const c = curChar();
  const v = (c && VOICE_LINES[c.voice]) ? VOICE_LINES[c.voice] : VOICE_LINES.bold;
  const pool = v[kind] && v[kind].length ? v[kind] : (v.curious || ["……"]);
  let pool2 = pool;
  if (ctx && ctx.last){                                   // 旅程最後一區：不出現「下一站／下一區」之類的期待
    const f = pool.filter(t => !/下一/.test(t));
    if (f.length) pool2 = f;
  }
  let text = pool2[Math.floor(Math.random()*pool2.length)];
  if (ctx){
    if (ctx.place) text = text.split("{place}").join(ctx.place);
    if (ctx.region) text = text.split("{region}").join(ctx.region);
  }
  return { type:"line", speaker: playerName(), icon: playerIcon(),
           text: text, isPlayer:true };
}
function isPlayerSpeaker(name){ return name === playerName(); }

function parseLine(raw, fallback){
  const m = /^@(\w+)@([\s\S]*)$/.exec(raw);
  if (m && m[1]==="n") return {speaker:"旁白", icon:"", text:m[2]};   // 旁白：不顯示任何人物頭像
  if (m){
    const sp = speakerInfo(m[1]);
    if (sp) return {speaker:sp.name, icon:sp.icon, text:m[2]};
  }
  return {speaker:fallback.name, icon:fallback.icon, text:raw};
}

function stripPrefix(text, name){
  const re = new RegExp("^"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[：:]\\s*");
  return text.replace(re,"");
}

function linesToSteps(lines, fallback){
  return lines.map(l => { const p = parseLine(l, fallback); return {type:"line", speaker:p.speaker, icon:p.icon, text:p.text}; });
}

function buildStopSteps(stop, region, ctx){
  const fb = {name:stop.npcName, icon:stop.npcIcon};
  const steps = [];
  const pages = linesToSteps(filterCastLines(stop.pages, region), fb);
  pages[0].scene = stop.sceneEmoji;
  // 通用場景：換景時先來一句旁白鋪陳畫面
  const sc = stopScene(stop);
  if (ctx && ctx.bg !== sc){
    ctx.bg = sc;
    const nar = sceneNarration(sc, stop.placeId);
    if (nar){ nar.scene = stop.sceneEmoji; steps.push(nar); }
  }
  // 這一站的地名（供主角反應台詞代入，讓吐槽/驚呼真正對應到這個地名，而非罐頭句）
  const placeInfo = placesData[stop.placeId];
  const placeName = placeInfo ? placeInfo.n : "這裡";
  const pctx = {place: placeName};
  // 主角抵達時先開口
  const arrive = pline("arrive", pctx); arrive.scene = stop.sceneEmoji; arrive.bg = sc;
  steps.push(arrive);
  pages.forEach(p => steps.push(p));
  // 聽完介紹後的反應／追問
  steps.push(pline("curious", pctx));
  if (stop.interference){
    steps.push({type:"line", speaker:"忘名妖", icon:"🌫️", text:stop.interference[0], sfx:"yokai"});
    steps.push(pline("yokai", pctx));
    steps.push({type:"line", speaker:stop.npcName, icon:stop.npcIcon, text:stripPrefix(stop.interference[1], stop.npcName)});
  }
  steps.push({type:"quiz", quiz:stop.quiz, placeId:stop.placeId, npcName:stop.npcName, npcIcon:stop.npcIcon});
  steps.push(pline("right", pctx));
  if (stop.afterQuiz){
    linesToSteps(filterCastLines(stop.afterQuiz, region), fb).forEach(s=>steps.push(s));
  }
  return steps;
}

// 建立「相遇」對話步驟：優先使用專屬好友／競爭對手劇本，
// 其次使用該對角色專屬的初次見面劇本（PAIR_MEET_SCRIPTS），
// 兩者皆無才會退回最通用的萬用初次見面對話（理論上不會發生）。
function buildMeetSteps(otherKey){
  const other = CHAR_BY_KEY[otherKey];
  const county = PROTAGONIST_HOME_COUNTY[otherKey] || "";
  const rel = relationBetween(state.charKey, otherKey);
  const steps = [];
  steps.push({type:"line", speaker:"旁白", text:"你在"+county+"，意外遇見了同樣在探尋地名記憶的「"+other.name+"」。", scene:other.icon});
  const script = MEET_SCRIPTS[otherKey] && MEET_SCRIPTS[otherKey][rel];
  const pairScript = PAIR_MEET_SCRIPTS[pairScriptKey(state.charKey, otherKey)];
  const myG = (CHAR_BY_KEY[state.charKey]||{}).gender, otherG = other.gender;
  if (script){
    script.forEach(ln=>{
      if (ln.spk === "me") steps.push({type:"line", speaker:playerName(), icon:playerIcon(), text:adaptPronoun(ln.text, otherG), isPlayer:true});
      else steps.push({type:"line", speaker:other.name, icon:other.icon, text:adaptPronoun(ln.text, myG)});
    });
  } else if (pairScript){
    pairScript.forEach(ln=>{
      if (ln.spk === state.charKey) steps.push({type:"line", speaker:playerName(), icon:playerIcon(), text:adaptPronoun(ln.text, otherG), isPlayer:true});
      else steps.push({type:"line", speaker:other.name, icon:other.icon, text:adaptPronoun(ln.text, myG)});
    });
  } else {
    steps.push({type:"line", speaker:other.name, icon:other.icon,
      text:"你好，我是"+other.name+"，大家都叫我「"+other.nick+"」。"+other.persona});
    steps.push({type:"line", speaker:playerName(), icon:playerIcon(), isPlayer:true,
      text:"你好，我是"+playerName()+"，也是來這裡尋找地名記憶的旅人。"});
    steps.push({type:"line", speaker:other.name, icon:other.icon,
      text:"是嗎？我平常喜歡"+other.hobby+"。如果你也對這裡的地名有興趣，我們可以算半個同好！"});
  }
  return steps;
}

function playMeetProtagonist(otherKey){
  const steps = buildMeetSteps(otherKey);
  playSequence(steps, ()=>{
    if (!state.metProtagonists[otherKey]){
      state.metProtagonists[otherKey] = true;
      state.loreScore += 1;
      renderTopbar();
      const other = CHAR_BY_KEY[otherKey];
      toast("👥 已認識 "+other.icon+" "+other.name);
    }
    renderCountyScreen(currentCounty);
    showScreen("county");
  });
}

// 主角群．主線劇情整合（目前已完成「山本大翔」「佐藤美咲」「田中蓮」「鈴木陽菜」「高橋悠真」
// 「伊藤結衣」「渡邊颯太」「小林心春」「比嘉海斗」「仲村美海」十位視角（全員完成），其餘角色將依同架構陸續補上）：玩家進入每個區域的主線時，會遇見該區的主角群同伴，
// 依照彼此關係（好友／競爭對手／初次見面）互動、一起推進當區的地名
// 主線，並在啟程前往下一區前互相道別。原本放在都道府縣頁面裡、與主線
// 脫節的「遇見主角群」單獨側邊互動，對已整合進主線的角色不再重複顯示
// （見 renderCountyProtagonists）。
// 注意：每位主角的「家鄉／出發區域」不同（見 PROTAGONIST_HOME_COUNTY、
// regionOrder()），旅程會從該角色的家鄉開始、依北→中→南→東→離島的固定
// 順序循環，直到繞回家鄉前一區為止（即該角色的「最後一站」）。因此以下
// 各角色互動內容，在撰寫「下一站是哪裡」「是否為最後一站」等台詞時，
// 都必須對照該主角實際的出發區域來寫，不能直接套用北部主角（山本大翔／
// 佐藤美咲）的旅程順序。
// ---------------------------------------------------------------------
const PROTAGONIST_MAIN_INTEGRATED = {"hanlin":true,"shiaolan":true,"poyu":true,"sihyu":true,"zihchian":true,"wanjhen":true,"lali":true,"kerou":true,"jianlin":true,"jiaen":true};
// 每個區域「土生土長」的兩位主角群成員（同校兩人）。實際同行的人選，
// 會在下方 localCompanionKeys() 中排除掉玩家本人，藉此讓同一份資料
// 同時支援「山本大翔在北部遇到佐藤美咲」與「佐藤美咲在北部遇到山本大翔」兩種情況。
// ---------------------------------------------------------------------
// 玩家專屬主線劇本（優先於上方通用劇本）。格式：[說話者, 台詞]
// 說話者：角色 key／"me"＝玩家／"n"＝旁白／"mentor"＝苔野婆婆／"keshian" 等夥伴
// 渡邊颯太路線：東部(起點)→離島→北部→中部→南部(終點)。
// 人物關係：心春=好友；山本大翔=宿敵；心春↔佐藤美咲、美海↔佐藤美咲、海斗↔小蓮、小陽↔結衣

function scriptToSteps(lines){
  return lines.map(l=>{
    const sp=l[0], t=l[1];
    if (sp==="me") return {type:"line", speaker:playerName(), icon:playerIcon(), text:t, isPlayer:true};
    if (sp==="n") return {type:"line", speaker:"旁白", text:t};
    const c = sp==="mentor" ? MENTOR : (CHAR_BY_KEY[sp] || COMPANIONS[sp]);
    return {type:"line", speaker:c.name, icon:c.icon, text:t};
  });
}
function playerRegionScript(regionId, part){
  const ps = PLAYER_MAIN_SCRIPTS[state.charKey];
  return ps && ps[regionId] && ps[regionId][part] ? ps[regionId][part] : null;
}

function localCompanionKeys(regionId){

function buildMainCastStopBanter(region, idx){
  if (!PROTAGONIST_MAIN_INTEGRATED[state.charKey]) return [];
  const keys = localCompanionKeys(region.id);
  const compSteps = [];
  const cl = STOP_COMPANION_LINES[region.id] && STOP_COMPANION_LINES[region.id][idx];
  keys.forEach(k=>{
    if (cl && cl[k]){ const c = CHAR_BY_KEY[k]; compSteps.push({type:"line", speaker:c.name, icon:c.icon, text:cl[k]}); }
  });
  const pt = PLAYER_STOP_LINES[state.charKey] && PLAYER_STOP_LINES[state.charKey][region.id] && PLAYER_STOP_LINES[state.charKey][region.id][idx];
  if (compSteps.length || pt){
    const pStep = pt ? [{type:"line", speaker:playerName(), icon:playerIcon(), text:pt, isPlayer:true}] : [];
    // 單數站由夥伴先開口、雙數站由玩家先開口，讓節奏不要一成不變
    return (idx % 2 === 0) ? compSteps.concat(pStep) : pStep.concat(compSteps);
  }
  // 後備：沿用舊有的通用穿插語句庫
  if (!keys.length) return [];
  const k = keys[idx % keys.length];
  const pool = PROTAGONIST_STOP_BANTER[k];
  if (!pool || !pool.length) return [];
  const c = CHAR_BY_KEY[k];
  return [{type:"line", speaker:c.name, icon:c.icon, text:pool[idx % pool.length]}];
}
// 相遇時的專屬台詞（沿用 MEET_SCRIPTS／PAIR_MEET_SCRIPTS，依關係自動挑選）
// 通用腳本原本是以「某一位玩家」的性別寫成，套用到別的玩家時會出現「對女生說你／對男生說妳」。
// 這裡依「聽話的人」的性別統一：對女性用「妳」、對男性用「你」（「你們／妳們」不動）。
function adaptPronoun(text, listenerGender){
  if (listenerGender === "f") return text.replace(/你(?!們)/g, "妳");
  if (listenerGender === "m") return text.replace(/妳(?!們)/g, "你");
  return text;
}
function buildOneMeetLines(otherKey){
  const other = CHAR_BY_KEY[otherKey];
  const rel = relationBetween(state.charKey, otherKey);
  const steps = [];
  const script = MEET_SCRIPTS[otherKey] && MEET_SCRIPTS[otherKey][rel];
  const pairScript = PAIR_MEET_SCRIPTS[pairScriptKey(state.charKey, otherKey)];
  const myG = (CHAR_BY_KEY[state.charKey]||{}).gender, otherG = other.gender;
  if (script){
    script.forEach(ln=>{
      if (ln.spk === "me") steps.push({type:"line", speaker:playerName(), icon:playerIcon(), text:adaptPronoun(ln.text, otherG), isPlayer:true});
      else steps.push({type:"line", speaker:other.name, icon:other.icon, text:adaptPronoun(ln.text, myG)});
    });
  } else if (pairScript){
    pairScript.forEach(ln=>{
      if (ln.spk === state.charKey) steps.push({type:"line", speaker:playerName(), icon:playerIcon(), text:adaptPronoun(ln.text, otherG), isPlayer:true});
      else steps.push({type:"line", speaker:other.name, icon:other.icon, text:adaptPronoun(ln.text, myG)});
    });
  } else {
    steps.push({type:"line", speaker:other.name, icon:other.icon, text:"你好，我是"+other.name+"，大家都叫我「"+other.nick+"」。"});
  }
  return steps;
}
function buildMainCastGreetSteps(region){
  if (!PROTAGONIST_MAIN_INTEGRATED[state.charKey]) return [];
  const keys = localCompanionKeys(region.id);
  if (!keys.length) return [];
  const custom = playerRegionScript(region.id, "greet");
  if (custom){
    keys.forEach(k=>{ if (!state.metProtagonists[k]){ state.metProtagonists[k] = true; state.loreScore += 1; } });
    return scriptToSteps(custom);
  }
  const steps = [];
  const nar = (keys.length === 2 && REGION_MEET_NARRATION_VISITOR[region.id]) || REGION_MEET_NARRATION[region.id];
  if (nar) steps.push({type:"line", speaker:"旁白", text:nar});
  keys.forEach(k=>{
    steps.push.apply(steps, buildOneMeetLines(k));
    if (!state.metProtagonists[k]){ state.metProtagonists[k] = true; state.loreScore += 1; }
  });
  if (keys.length === 2) steps.push.apply(steps, buildProtagonistPairSteps(keys[0], keys[1]));
  const names = keys.map(k=>CHAR_BY_KEY[k].name).join("、");
  steps.push({type:"line", speaker:MENTOR.name, icon:MENTOR.icon,
    text:"既然有緣同路，"+names+"，就讓"+(keys.length===1?"你":"你們")+"陪"+playerName()+"，一起把這段地名記憶找回來吧。"});
  return steps;
}

// 部分「本區同伴」的道別台詞，內容會因為「這一區是不是我這趟旅程的最後一站」
// 而不同（有沒有下一站、下一站是哪裡）。這類台詞不是單一陣列，而是
// {last:[...], mid:[...]} 的形式，由 pickFarewellVariant 依 isLastRegion() 判斷
// 該用哪一版；沒有這種分歧的台詞則維持原本的單一陣列格式，直接使用。
function pickFarewellVariant(script, region){
  if (!script || Array.isArray(script)) return script;
  return (isLastRegion(region.id) ? script.last : script.mid) || script.last || script.mid;
}
function buildMainCastFarewellSteps(region){
  if (!PROTAGONIST_MAIN_INTEGRATED[state.charKey]) return [];
  const keys = localCompanionKeys(region.id);
  if (!keys.length) return [];
  const customFw = playerRegionScript(region.id, "farewell");
  if (customFw) return scriptToSteps(customFw);
  const steps = [];
  keys.forEach(k=>{
    const other = CHAR_BY_KEY[k];
    const rel = relationBetween(state.charKey, k);
    const entry = PROTAGONIST_FAREWELL[k];
    const script = pickFarewellVariant(entry && (entry[rel] || entry.stranger || entry.friend || entry.rival), region);
    if (!script) return;
    const myG = (CHAR_BY_KEY[state.charKey]||{}).gender;
    script.forEach(ln=>{
      if (ln.spk === "me") steps.push({type:"line", speaker:playerName(), icon:playerIcon(), text:adaptPronoun(ln.text, other.gender), isPlayer:true});
      else steps.push({type:"line", speaker:other.name, icon:other.icon, text:adaptPronoun(ln.text, myG)});
    });
  });
  return steps;
}

    '<div class="detail-old">'+escapeHtml(c.school)+(rel?'　'+RELATION_LABEL[rel]:'')+'</div>'+
    '<div class="detail-body">'+escapeHtml(c.blurb)+
      '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper-line);">'+
      '<div style="margin-bottom:6px;"><b>🧠 個性：</b>'+escapeHtml(c.persona)+'</div>'+
      '<div style="margin-bottom:6px;"><b>🎯 喜好：</b>'+escapeHtml(c.hobby)+'</div>'+
      '<div style="margin-bottom:6px;"><b>💛 好友：</b>'+escapeHtml(c.friend)+'</div>'+
      '<div><b>🔥 競爭對手：</b>'+escapeHtml(c.rival)+'</div>'+
      '</div>'+
