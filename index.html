<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本地名尋根：拾憶者物語</title>
<style>
:root{
  --ink:#1c2a2e;
  --ink-2:#233a3f;
  --paper:#efe4c9;
  --paper-2:#e6d7ae;
  --paper-line:#c9b489;
  --gold:#b0863f;
  --gold-lt:#d9b25f;
  --seal:#a13d2e;
  --seal-lt:#c25a44;
  --jade:#4f7a63;
  --jade-lt:#7ba98c;
  --ink-text:#2b2119;
  --mist:#8fa3a6;
  --north:#3f7a8c;
  --central:#7a8c3f;
  --south:#c25a2e;
  --east:#5c6fae;
  --island:#8c5aae;
  --radius:14px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--paper);
  background:
    radial-gradient(ellipse at 20% -10%, #2c464c 0%, transparent 55%),
    radial-gradient(ellipse at 90% 110%, #1a3630 0%, transparent 50%),
    linear-gradient(160deg,#14201f 0%, #1c2a2e 45%, #17282b 100%);
  min-height:100%;
  overflow-x:hidden;
  user-select:none;
}
.app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* ---------- 共用元件 ---------- */
.hidden{display:none !important;}
.screen{padding:18px 16px 90px;flex:1;display:flex;flex-direction:column;animation:fadeIn .45s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.brass-btn{
  font-family:var(--serif);
  background:linear-gradient(160deg,var(--gold-lt),var(--gold));
  color:#2b1d0d;
  border:1px solid #7a5a24;
  border-radius:30px;
  padding:12px 26px;
  font-size:1rem;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 4px 0 #6e5222, 0 8px 16px rgba(0,0,0,.35);
  transition:transform .12s, box-shadow .12s;
}
.brass-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6e5222,0 4px 8px rgba(0,0,0,.3);}
.brass-btn.ghost{
  background:transparent;color:var(--paper);
  border:1.5px solid var(--gold);
  box-shadow:none;
}
.brass-btn.ghost:active{transform:translateY(2px);}
.brass-btn.small{padding:8px 16px;font-size:.85rem;}
.brass-btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4);}
/* 淺色羊皮紙彈跳視窗（.paper-panel／.modal-sheet）背景本身就是米黃色，
   ghost 按鈕原本的淺色字在上面幾乎看不見，這裡改用跟「確定」按鈕
   一致的深色文字，讓取消／確定兩顆按鈕字都清楚可讀 */
.paper-panel .brass-btn.ghost, .modal-sheet .brass-btn.ghost{
  color:#2b1d0d; border-color:#7a5a24;
}
/* 離線資料包提示列（米黃底）與設定裡的「清除」按鈕：取消類按鈕用深色字＋深色框＋淺底，清楚可見 */
.ob-later, #off-del{
  background:rgba(255,255,255,.7) !important; color:#2b1d0d !important;
  border:1.5px solid #5c4318 !important; box-shadow:none !important; font-weight:700;
}
.ob-later:active, #off-del:active{background:rgba(255,255,255,.95) !important;}

.seal-tag{
  display:inline-block;background:var(--seal);color:#fff2e6;
  font-family:var(--serif);font-size:.72rem;letter-spacing:2px;
  padding:2px 9px;border-radius:3px;transform:rotate(-2deg);
  box-shadow:0 2px 4px rgba(0,0,0,.3);
}

.paper-panel{
  background:
    linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
  color:var(--ink-text);
  border-radius:10px;
  border:1px solid var(--paper-line);
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 0 40px rgba(176,134,63,.08);
  position:relative;
}
.paper-panel::before{
  content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}

.section-title{
  font-family:var(--serif);font-size:1.15rem;font-weight:700;
  color:var(--gold-lt);margin:0 0 10px;padding-bottom:8px;
  border-bottom:1px solid rgba(176,134,63,.4);
  display:flex;align-items:center;gap:8px;
}

/* ---------- 頂部狀態列 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:6px;
  padding:12px 16px;background:rgba(20,32,31,.85);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(176,134,63,.35);position:sticky;top:0;z-index:80;
}
.topbar .id{display:flex;align-items:center;gap:10px;font-family:var(--serif);flex:0 0 auto;}
.topbar .id .pname{font-weight:700;color:var(--gold-lt);}
.topbar .chapter{flex:1 1 auto;min-width:0;text-align:center;font-family:var(--serif);font-size:.8rem;letter-spacing:1px;color:var(--gold-lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;}
.topbar .menu-btn{background:none;border:1px solid var(--mist);color:var(--paper);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1rem;}

/* ---------- 標題畫面 ---------- */
#screen-title{align-items:center;justify-content:center;text-align:center;padding:40px 20px;}
.title-compass{font-size:4.2rem;margin-bottom:6px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));animation:spin 16s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.title-name{font-family:var(--serif);font-size:2.1rem;color:var(--gold-lt);letter-spacing:3px;margin:0 0 4px;text-shadow:0 3px 10px rgba(0,0,0,.5);}
.title-sub{color:var(--mist);font-size:.92rem;letter-spacing:2px;margin-bottom:28px;}
.title-blurb{max-width:480px;font-family:var(--serif);line-height:2;color:#d9cba1;font-size:.94rem;margin-bottom:30px;}
.title-actions{display:flex;flex-direction:column;gap:12px;align-items:center;}
.title-actions .brass-btn{width:240px;padding:12px 26px;font-size:1rem;}
.title-foot{margin-top:36px;font-size:.72rem;color:var(--mist);opacity:.7;}

/* ---------- 對話系統 ---------- */
#screen-dialogue{padding:0;justify-content:flex-end;}
.dlg-stage{
  flex:1;display:flex;align-items:center;justify-content:center;position:relative;
  padding:30px 20px;text-align:center;
  background:
    radial-gradient(circle at 50% 30%, rgba(176,134,63,.15), transparent 60%);
}
.dlg-scene-bg{position:absolute;inset:0;background-size:cover;background-position:center bottom;opacity:0;transition:opacity .7s ease;pointer-events:none;}
.dlg-scene-bg.on{opacity:1;}
.dlg-scene-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,9,6,.45),rgba(12,9,6,.12) 45%,rgba(12,9,6,.82));}
.dlg-stage .scene-emoji{position:relative;z-index:2;}
.dlg-stage .scene-emoji{font-size:5.5rem;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));animation:floaty 4s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.stage-portrait{max-width:88%;max-height:340px;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.5);border:1px solid rgba(176,134,63,.5);animation:portraitIn .35s ease;object-fit:cover;}
@keyframes portraitIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.dlg-speaker .sp-face{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px;border:1px solid var(--seal);}
.dlg-box-wrap{padding:0 14px 18px;}
.dlg-box{
  padding:16px 18px 18px;min-height:118px;
}
.dlg-speaker{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--serif);font-weight:700;color:var(--seal);
  background:var(--paper);border:1px solid var(--paper-line);
  padding:4px 14px;border-radius:16px;
  position:relative;top:-26px;margin-bottom:-14px;
  box-shadow:0 3px 6px rgba(0,0,0,.25);
  font-size:.9rem;
}
.dlg-text{font-family:var(--serif);font-size:1rem;line-height:1.9;min-height:3.6em;white-space:pre-wrap;}
.dlg-text .cursor{opacity:.5;}
.dlg-tap-hint{text-align:right;font-size:.72rem;color:#8a7853;margin-top:4px;}
.dlg-choices{display:flex;flex-direction:column;gap:8px;padding:0 14px 18px;}
.dlg-choice-btn{
  text-align:left;font-family:var(--serif);
  background:var(--paper);color:var(--ink-text);
  border:1px solid var(--paper-line);border-left:4px solid var(--gold);
  border-radius:8px;padding:11px 14px;font-size:.92rem;cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.25);
}
.dlg-choice-btn:active{transform:scale(.98);}

/* ---------- 玩家自己說話時的樣式 ---------- */
.dlg-box.player{
  background:linear-gradient(160deg,#e8f0e6 0%, #d8e6d5 100%);
  border-color:#8fae8a;
}
.dlg-box.player .dlg-speaker{
  color:#2f5c3c;background:#eef6ec;border-color:#8fae8a;
}
.dlg-box.player .dlg-text{color:#22321f;}

/* ---------- 旁白：不顯示發言者標籤，避免突兀 ---------- */
.dlg-box.narration .dlg-speaker{display:none;}

/* ---------- 選角畫面 ---------- */
#screen-charselect{padding:20px 16px 90px;}
.cs-step-title{font-family:var(--serif);font-size:1.3rem;color:var(--gold-lt);text-align:center;letter-spacing:2px;margin:6px 0 4px;}
.cs-step-sub{text-align:center;color:var(--mist);font-size:.82rem;margin-bottom:18px;line-height:1.7;}
.cs-gender-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.cs-gender-card{
  flex:1 1 140px;max-width:200px;cursor:pointer;text-align:center;
  padding:26px 14px;border-radius:16px;
  background:linear-gradient(160deg,rgba(176,134,63,.18),rgba(79,122,99,.12));
  border:1.5px solid rgba(176,134,63,.5);transition:transform .15s, box-shadow .15s;
}
.cs-gender-card:active{transform:scale(.97);}
.cs-gender-card .g-emo{font-size:3rem;display:block;margin-bottom:8px;font-weight:700;}
.cs-gender-card[data-gender="m"] .g-emo{color:#6fa8dc;}
.cs-gender-card[data-gender="f"] .g-emo{color:#e79fc4;}
.cs-gender-card .g-name{font-family:var(--serif);font-size:1.1rem;color:var(--gold-lt);letter-spacing:2px;}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:6px;}
.cs-card{
  cursor:pointer;padding:14px 12px;border-radius:14px;text-align:center;
  background:rgba(239,228,201,.06);border:1.5px solid rgba(176,134,63,.35);
  transition:transform .15s,border-color .15s,background .15s;
}
.cs-card:active{transform:scale(.97);}
.cs-card.sel{border-color:var(--gold-lt);background:rgba(217,178,95,.18);box-shadow:0 0 0 2px rgba(217,178,95,.25);}
.cs-card .c-emo{font-size:2.4rem;display:block;}
.cs-card .c-face{width:100%;height:172px;object-fit:contain;object-position:center;border-radius:10px;display:block;background:rgba(0,0,0,.15);}
.cs-card .c-name{font-family:var(--serif);font-weight:700;color:var(--gold-lt);margin-top:4px;font-size:1rem;}
.cs-card .c-home{font-size:.68rem;color:var(--mist);margin-top:3px;line-height:1.5;}
.c-gsym{font-weight:700;}
.cs-card .c-gsym{color:var(--gold-lt);opacity:.85;}
.d-name .c-gsym{color:var(--seal);margin-left:2px;}
.cs-detail .d-portrait{width:100%;max-height:320px;object-fit:contain;object-position:center;border-radius:10px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.25);background:rgba(0,0,0,.15);}
.cs-detail{margin-top:16px;padding:16px 18px;}
.cs-detail .d-name{font-family:var(--serif);font-size:1.2rem;font-weight:700;color:var(--ink-text);}
.cs-detail .d-line{font-size:.85rem;line-height:1.85;margin-top:6px;}
.cs-detail .d-line b{color:var(--seal);}
.cs-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}

/* ---------- 音效設定 ---------- */
.audio-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.85rem;}
.audio-row label{min-width:72px;}
.audio-row input[type=range]{flex:1;}

/* ---------- 世界地圖 ---------- */
.map-wrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);}
#worldmap{width:100%;height:auto;display:block;background:linear-gradient(160deg,#16323a,#0f2226);}
.region-node{cursor:pointer;}
.region-node .shape{transition:filter .2s, opacity .2s;}
.region-node:hover .shape{filter:brightness(1.25);}
.region-node.locked .shape{opacity:.28;filter:grayscale(1);}
.region-node.locked{cursor:not-allowed;}
.region-label{font-family:var(--serif);font-size:15px;fill:#fdf3da;paint-order:stroke;stroke:#1c2a2e;stroke-width:3px;font-weight:700;pointer-events:none;}
.region-sub{font-size:9px;fill:#cfe3d8;paint-order:stroke;stroke:#1c2a2e;stroke-width:2px;pointer-events:none;}
.region-node.locked .region-label,.region-node.locked .region-sub{fill:#8a99a0;}
.region-badge{pointer-events:none;}

.legend-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;}
.legend-chip{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--mist);}
.legend-dot{width:11px;height:11px;border-radius:3px;display:inline-block;}

/* ---------- 隊伍列 ---------- */
.party-row{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;}
.party-chip{
  flex-shrink:0;width:58px;text-align:center;font-size:.68rem;color:var(--mist);
}
.party-chip .ava{
  width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;background:var(--paper);border:2px solid var(--gold);margin:0 auto 4px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);overflow:hidden;
}
.party-chip .ava img{width:100%;height:100%;object-fit:cover;}
.party-chip.empty .ava{background:rgba(255,255,255,.05);border:2px dashed var(--mist);opacity:.5;}
.modal-portrait{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);float:left;margin:0 12px 8px 0;box-shadow:0 4px 10px rgba(0,0,0,.25);}

/* ---------- 地區關卡頁 ---------- */
.region-hero{
  border-radius:14px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;
  background:linear-gradient(160deg, var(--ink-2), #12201f);
  border:1px solid rgba(176,134,63,.35);
}
.region-hero h2{font-family:var(--serif);margin:0 0 6px;font-size:1.4rem;color:var(--gold-lt);}
.region-hero p{margin:0;color:#cfd9d2;font-size:.86rem;line-height:1.7;}
.region-hero .accent-bar{position:absolute;left:0;top:0;bottom:0;width:6px;}

.progress-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px;}
.progress-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-lt));}

.county-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.county-card{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 15px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(176,134,63,.25);
}
.county-card:active{background:rgba(255,255,255,.09);}
.county-card .cname{font-family:var(--serif);font-weight:700;color:var(--paper);}
.county-card .csub{font-size:.72rem;color:var(--mist);margin-top:2px;}
.county-card .cprog{font-size:.78rem;color:var(--gold-lt);white-space:nowrap;font-family:var(--serif);}

/* ---------- 都道府縣任務鏈卡片 ---------- */
.chain-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;margin-bottom:18px;}
.chain-card{
  position:relative;padding:13px 15px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(176,134,63,.25);
  border-left:4px solid var(--mist);
}
.chain-card:active{background:rgba(255,255,255,.09);}
.chain-card.done{border-left-color:var(--jade-lt);}
.chain-card .chain-title{font-family:var(--serif);font-weight:700;color:var(--paper);font-size:.95rem;padding-right:52px;}
.chain-card .chain-sub{font-size:.72rem;color:var(--mist);margin-top:3px;}
.chain-card .chain-prog{position:absolute;top:13px;right:15px;font-size:.78rem;color:var(--gold-lt);font-family:var(--serif);white-space:nowrap;}

/* ---------- 都道府縣探索頁（地魂節點格） ---------- */
.node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.spirit-node{
  padding:13px 12px;border-radius:12px;cursor:pointer;position:relative;
  background:rgba(255,255,255,.045);border:1px solid rgba(176,134,63,.25);
  border-left:4px solid var(--mist);
}
.spirit-node.done{border-left-color:var(--jade-lt);}
.spirit-node .sname{font-family:var(--serif);font-weight:700;color:var(--paper);font-size:.95rem;}
.spirit-node .sold{color:var(--gold-lt);font-size:.74rem;margin-top:3px;}
.spirit-node .sflag{position:absolute;top:8px;right:10px;font-size:.85rem;}
.spirit-node.flagship{border-left-color:var(--seal-lt);}
.spirit-node.flagship .sname::after{content:" ★";color:var(--seal-lt);}

/* ---------- 圖鑑 ---------- */
.codex-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.codex-toolbar select,.codex-toolbar input{
  flex:1;min-width:110px;padding:9px 10px;border-radius:8px;border:1px solid var(--paper-line);
  background:var(--paper);color:var(--ink-text);font-family:var(--sans);font-size:.85rem;
}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;}
.codex-card{
  padding:12px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.045);border:1px solid rgba(176,134,63,.22);border-left:4px solid var(--jade-lt);
}
.codex-card.locked{opacity:.38;filter:grayscale(.6);cursor:default;}
.codex-card .cx-county{font-size:.68rem;color:var(--mist);}
.codex-card .cx-name{font-family:var(--serif);font-weight:700;color:var(--paper);}
.codex-card .cx-old{font-size:.75rem;color:var(--gold-lt);}
.codex-card{display:flex;gap:10px;align-items:center;}
.codex-card .cx-ava{
  width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--paper);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.codex-card .cx-ava img{width:100%;height:100%;object-fit:cover;}
.codex-card.locked .cx-ava{background:rgba(255,255,255,.05);border-style:dashed;box-shadow:none;}
.codex-card .cx-body{flex:1;min-width:0;}
.modal-fullart{width:100%;max-height:360px;object-fit:contain;object-position:center;border-radius:10px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.25);background:rgba(0,0,0,.15);}

/* ---------- 都道府縣探索頁：遇見主角群 ---------- */
.meet-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;margin-bottom:18px;}
.meet-card{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(176,134,63,.25);border-left:4px solid var(--mist);
}
.meet-card:active{background:rgba(255,255,255,.09);}
.meet-card.met{border-left-color:var(--jade-lt);}
.meet-card .mv-ava{
  width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--paper);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
}
.meet-card .mv-ava img{width:100%;height:100%;object-fit:cover;}
.meet-card .mv-body{flex:1;min-width:0;}
.meet-card .mv-name{font-family:var(--serif);font-weight:700;color:var(--paper);font-size:.92rem;}
.meet-card .mv-sub{font-size:.72rem;color:var(--mist);margin-top:2px;}
.meet-card .mv-tag{flex-shrink:0;font-size:.7rem;padding:3px 9px;border-radius:20px;white-space:nowrap;font-family:var(--serif);}
.meet-card .mv-tag.friend{background:rgba(123,169,140,.25);color:var(--jade-lt);}
.meet-card .mv-tag.rival{background:rgba(194,90,46,.25);color:#e08a5e;}

<script>
const CHARACTER_ART = {};

/* ===== 角色圖檔資源包 - 動態載入 (dynamically injected loader) =====
   目的：把原本內嵌在 HTML 裡的大量 base64 角色圖檔抽離成外部檔案
   (assets/characters.pack + assets/characters.manifest.json)，
   第一次遊玩時才下載並顯示進度條，下載完後存進瀏覽器的 IndexedDB，
   之後再玩就直接從本機讀取，不用再等待下載。
*/
/* ===== 圖檔資源包 - 動態載入 (dynamically injected loader) =====
   目的：把原本內嵌在 HTML 裡的大量 base64 圖檔（角色圖 + 場景照片）抽離成外部檔案
   (assets/characters.pack、assets/scenes.pack) + 對應的 manifest json，
   第一次遊玩時才下載並顯示合併進度條，下載完後存進瀏覽器的 IndexedDB，
   之後再玩就直接從本機讀取，不用再等待下載。
*/
(function(){
  var DB_NAME = "resource-pack-cache";
  var DB_VERSION = 1;
  var STORE_NAME = "kv";

  var PACKS = [
    {
      name: "characters",
      manifestUrl: "assets/characters.manifest.json",
      packUrl: "assets/characters.pack",
      apply: function(manifest, buffer){
        var items = manifest.items;
        for (var i = 0; i < items.length; i++){
          var it = items[i];
          try{
            var slice = buffer.slice(it.offset, it.offset + it.length);
            var blob = new Blob([slice], { type: it.mime || "image/webp" });
            var url = URL.createObjectURL(blob);
            if (!CHARACTER_ART[it.key]) CHARACTER_ART[it.key] = {};
            CHARACTER_ART[it.key][it.part] = url;
          }catch(e){ /* 單一項目壞掉時跳過，不中斷其餘角色圖的載入 */ }
        }
      }
    },
    {
      name: "scenes",
      manifestUrl: "assets/scenes.manifest.json",
      packUrl: "assets/scenes.pack",
      apply: function(manifest, buffer){
        var items = manifest.items;
        for (var i = 0; i < items.length; i++){
          var it = items[i];
          try{
            var slice = buffer.slice(it.offset, it.offset + it.length);
            var blob = new Blob([slice], { type: it.mime || "image/webp" });
            var url = URL.createObjectURL(blob);
            if (typeof SCENE_BG !== "undefined" && SCENE_BG[it.key]){
              SCENE_BG[it.key].photoUrl = url;
            }
          }catch(e){ /* 單一場景圖壞掉時跳過，不中斷其餘場景圖的載入 */ }
        }
      }
    }
  ];

  var loadingEl, barEl, pctEl, statusEl;

  function q(id){ return document.getElementById(id); }

  function setProgress(frac, label){
    if (!barEl) return;
    var pct = Math.max(0, Math.min(100, Math.round(frac * 100)));
    barEl.style.width = pct + "%";
    if (pctEl) pctEl.textContent = pct + "%";
    if (label && statusEl) statusEl.textContent = label;
  }

  function openDB(){
    return new Promise(function(resolve){
      if (!("indexedDB" in window)) { resolve(null); return; }
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { resolve(null); return; }
      req.onupgradeneeded = function(){
        try { req.result.createObjectStore(STORE_NAME); } catch(e){}
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ resolve(null); };
    });
  }

  function idbGet(db, key){
    return new Promise(function(resolve){
      if (!db) { resolve(undefined); return; }
      try{
        var tx = db.transaction(STORE_NAME, "readonly");
        var req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ resolve(undefined); };
      }catch(e){ resolve(undefined); }
    });
  }

  function idbSet(db, key, val){
    return new Promise(function(resolve){
      if (!db) { resolve(false); return; }
      try{
        var tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(val, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }

  function fetchPackWithProgress(url, onBytes){
    return fetch(url, {cache:"no-store"}).then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      if (!res.body || !res.body.getReader) {
        return res.arrayBuffer().then(function(buf){
          onBytes(buf.byteLength);
          return buf;
        });
      }
      var reader = res.body.getReader();
      var received = 0;
      var chunks = [];
      function pump(){
        return reader.read().then(function(result){
          if (result.done){
            var buf = new Uint8Array(received);
            var off = 0;
            for (var i = 0; i < chunks.length; i++){
              buf.set(chunks[i], off);
              off += chunks[i].length;
            }
            return buf.buffer;
          }
          chunks.push(result.value);
          received += result.value.length;
          onBytes(received);
          return pump();
        });
      }
      return pump();
    });
  }

  function finish(){
    if (loadingEl){
      loadingEl.classList.add("hidden");
      loadingEl.style.display = "none";
    }
  }

  function init(){
    loadingEl = q("screen-loading");
    barEl = q("loading-bar-fill");
    pctEl = q("loading-pct");
    statusEl = q("loading-status");

    openDB().then(function(db){
      // 先向伺服器抓每個資源包最新的 manifest（檔案很小，一定重新抓，
      // 用來跟本機 IndexedDB 快取的版本比對，避免資源包更新後
      // 瀏覽器還在用舊的、甚至是下載到一半就存進去的壞快取）
      var freshManifests = PACKS.map(function(p){
        return fetch(p.manifestUrl, {cache:"no-store"}).then(function(r){
          if (!r.ok) throw new Error(p.name + " manifest HTTP " + r.status);
          return r.json();
        }).then(function(manifest){ return { pack: p, manifest: manifest }; })
          .catch(function(){ return { pack: p, manifest: null }; }); // 抓不到就當作沒有最新資訊，稍後仍會嘗試用快取或重新下載
      });

      Promise.all(freshManifests).then(function(withFresh){
        var cacheChecks = withFresh.map(function(wf){
          return Promise.all([idbGet(db, wf.pack.name + ":manifest"), idbGet(db, wf.pack.name + ":pack")])
            .then(function(cached){ return { wf: wf, cachedManifest: cached[0], cachedBuffer: cached[1] }; });
        });

        return Promise.all(cacheChecks).then(function(results){
          var pending = [];
          for (var i = 0; i < results.length; i++){
            var r = results[i];
            var fresh = r.wf.manifest;         // 這次向伺服器抓到的最新 manifest（可能為 null＝抓取失敗）
            var cm = r.cachedManifest, cb = r.cachedBuffer;
            var cacheValid = false;
            if (cm && cb){
              if (fresh){
                // 有抓到最新 manifest：比對內容是否完全一致，且快取的位元組數也對得上，才信任快取
                cacheValid = (JSON.stringify(cm) === JSON.stringify(fresh)) &&
                             cb.byteLength === (fresh.totalBytes || 0);
              } else {
                // 連最新 manifest 都抓不到（例如離線），退而求其次，只要快取本身內部一致就先用
                cacheValid = cb.byteLength === (cm.totalBytes || 0);
              }
            }
            if (cacheValid){
              try{
                r.wf.pack.apply(cm, cb);
                continue;
              }catch(e){ /* 快取套用失敗，當作沒有快取，重新下載 */ }
            }
            // 快取不存在、對不上、或套用失敗 → 標記為待下載，優先使用剛剛抓到的最新 manifest
            pending.push({ pack: r.wf.pack, manifest: fresh });
          }

          if (pending.length === 0){
            setProgress(1, "從本機讀取完成");
            finish();
            return;
          }

          setProgress(0, "正在下載圖檔資源包…");

          // 待下載的項目裡，若剛剛沒抓到 manifest（fresh 為 null），這裡再補抓一次
          Promise.all(pending.map(function(p){
            if (p.manifest) return p;
            return fetch(p.pack.manifestUrl, {cache:"no-store"}).then(function(r){
              if (!r.ok) throw new Error(p.pack.name + " manifest HTTP " + r.status);
              return r.json();
            }).then(function(manifest){ p.manifest = manifest; return p; });
          })).then(function(withManifests){
            var totalBytes = 0;
            withManifests.forEach(function(wm){ totalBytes += (wm.manifest.totalBytes || 0); });
            var receivedByPack = {};

            function overallProgress(){
              var sum = 0;
              for (var k in receivedByPack) sum += receivedByPack[k];
              return totalBytes ? (sum / totalBytes) : 0;
            }

            var downloads = withManifests.map(function(wm){
              receivedByPack[wm.pack.name] = 0;
              // 用 manifest 的總位元組數當作 cache-busting 版本號附加在網址後面，
              // 避免有些中間層快取（CDN、瀏覽器）忽略 no-store 而回傳舊的 .pack 內容
              var bustedUrl = wm.pack.packUrl + "?v=" + (wm.manifest.totalBytes || 0) + "-" + ((wm.manifest.items||[]).length);
              return fetchPackWithProgress(bustedUrl, function(bytes){
                receivedByPack[wm.pack.name] = bytes;
                setProgress(overallProgress(), "下載圖檔資源包… (" + Math.round(overallProgress()*100) + "%)");
              }).then(function(buffer){
                return { pack: wm.pack, manifest: wm.manifest, buffer: buffer };
              });
            });

            return Promise.all(downloads);
          }).then(function(loaded){
            loaded.forEach(function(item){
              item.pack.apply(item.manifest, item.buffer);
            });
            setProgress(1, "下載完成，儲存到本機…");
            return Promise.all(loaded.map(function(item){
              return idbSet(db, item.pack.name + ":manifest", item.manifest).then(function(){
                return idbSet(db, item.pack.name + ":pack", item.buffer);
              });
            }));
          }).then(function(){
            finish();
          }).catch(function(err){
          if (statusEl) statusEl.textContent = "資源包載入失敗，將以簡易模式繼續遊戲（" + err.message + "）";
          setTimeout(finish, 1200);
        });
        });
      });
    });
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

const rawPlacesData = [["北海道","北海道","北加伊道（カイ＝生於此地的人）","1869年由松浦武四郎提案的「北加伊道」等案改定而成，「加伊」取自阿伊努語，意為「生於此地的人」。","","北海道在1869年之前通稱「蝦夷地」。幕末探險家松浦武四郎多次踏查此地，並向明治新政府提出「日高見道、北加伊道、海北道、海島道、東北道、千島道」六個新名案。其中「加伊」取自阿伊努語的「カイ」，一說意為「生於此地的人」。新政府同年（明治二年）設立開拓使，並定名「北海道」——保留了「北」與「道」，把「加伊」改寫成音近的「海」，也延續了古代「東海道、西海道」等以「道」命名的傳統。"],["北海道","函館","宇須岸（ウスケシ）／箱館","源自室町時代河野政通所築的「宇須岸館」，因形似箱子而稱「箱館」，1869年起改寫為「函館」。","","函館舊寫作「箱館」。室町時代中期，武將河野政通在海灣旁築館，稱「宇須岸館」；「宇須岸（ウスケシ）」是阿伊努語，一般解為「海灣的盡頭」。後來因這座館的形狀方正、像一只箱子，人們改稱「箱館」。1854年日美和親條約後，箱館成為最早開港的港口之一；1869年（明治二年）起，地名的「箱」被改寫為「函」，成為今日的「函館」。"],["北海道","札幌","サッ・ポロ・ペッ（乾涸的大河）","一般認為源自阿伊努語「サッ・ポロ・ペッ」（乾涸的大河），指豐平川；另一說為「サリ・ポロ・ペッ」（蘆葦叢生的大河）。","","「札幌」源自阿伊努語，一般認為出自「サッ・ポロ・ペッ（sat-poro-pet）」，意為「乾涸的大河」，指的是水量時多時少的豐平川；另有「サリ・ポロ・ペッ」（蘆葦叢生的大河）一說。「札」與「幌」只是借用漢字讀音的當字，字面上並沒有河流的意思。1869年開拓使設立後，開拓判官島義勇來到此地規劃「本府」，以棋盤式道路劃分街區，奠定了今日札幌整齊街道的基礎。"],["北海道","小樽","オタ・オル・ナイ（沙灘中的河）","源自阿伊努語「オタ・オル・ナイ」，意為「沙灘中的河」，縮略成「オタル」後以漢字「小樽」書寫。","","小樽的舊稱「オタルナイ」出自阿伊努語「オタ・オル・ナイ（ota-ru-nai）」，意為「沙灘中的河」，指流經沙灘入海的河流。後來字尾的「ナイ（河）」被省略，只留下「オタル」，再以「小樽」二字書寫。江戶時代這裡是鯡魚漁場與北前船的停靠港，明治以後成為北海道的物資與金融重鎮。"],["北海道","旭川","チュㇷ゚ペッ（日之川）","源自阿伊努語「チュㇷ゚ペッ（日之川）」的意譯，並以象徵朝陽的「旭」字命名，1890年定名。","","旭川一帶在阿伊努語中稱「チュㇷ゚ペッ（chup-pet）」，意為「日（太陽）之川」，這也是「忠別川」名稱的由來。明治中期為了開拓上川盆地，人們把這個名字意譯為「旭川」，以「旭」字象徵升起的朝陽。它是道內少數以意譯而不是音譯定名的大城市，如今也是北海道第二大都市。"],["北海道","釧路","クスリ／クッシロ（眾說紛紜）","釧路的阿伊努語語源有多種說法，包括「クスリ（越過的路）」與「クッシロ（咽喉般的地形）」等，至今尚無定論。","","釧路的語源眾說紛紜。一說出自阿伊努語「クスリ（kusuri）」，解為「越過的路」；另一說為「クッシロ（kut-shir）」，指如咽喉般狹窄的地形；也有「藥、溫泉」之說。這些說法各有依據卻都難以定論，是一個典型「沒有標準答案」的地名。明治時代這裡因硫磺與煤炭運輸而發展，如今以濕原與漁港聞名。"],["北海道","稚內","ヤム・ワッカ・ナイ（冷水之澤）","源自阿伊努語「ヤム・ワッカ・ナイ」，意為「冷水的沢（小河）」，縮略後寫成「稚內」。","","稚內是日本本土最北端的城市。它的名字出自阿伊努語「ヤム・ワッカ・ナイ（yam-wakka-nai）」，意為「冷水的沢（小河）」，指從山上流下來的冰涼溪水。字尾的「ナイ（沢）」在日文地名中常寫成「内」，因此北海道有許多「〇〇内」的地名，都是同樣的道理。"],["北海道","網走","チパシリ／アパシリ（一說）","一說出自阿伊努語「チパシリ」（有祭祀幣場的島），另說為「アパ・シリ」（我們發現的土地），語源尚有爭議。","","網走在阿伊努語的語源有多種說法：一說為「チパシリ（chipa-shir）」，意為「有祭祀幣場（供奉神明處）的島」；另一說為「アパ・シリ」，解為「我們發現的土地」。無論哪一說，「網走」二字都只是取音的當字，與「網」或「奔走」並無關係。每年冬天，這裡也是鄂霍次克海流冰抵達的地方。"],["北海道","帶廣","オ・ペレ・ペレ・ケㇷ゚（河口裂成好幾股的地方）","源自阿伊努語「オペレペレケㇷ゚」（河口分成好幾股的地方），舊稱「オベリベリ」，後改寫為「帶廣」。","","帶廣舊稱「オベリベリ」，源自阿伊努語「オ・ペレ・ペレ・ケㇷ゚」，意為「河口裂成好幾股的地方」，指札內川流入十勝川處。1883年，開拓團體「晚成社」的依田勉三等人在此入墾。後來地名改寫為「帶廣」，其中的「帶」字，也讓人聯想到綿長的河流。"],["北海道","根室","ニムオロ（有樹林的地方）","源自阿伊努語「ニムオロ」，意為「有樹林（木）的地方」，以漢字「根室」書寫。","","根室是日本本土最東邊的市。名稱出自阿伊努語「ニムオロ（nim-oro）」，一般解為「有樹林的地方」。在強風多霧、樹木稀少的東北海岸，一處有樹林的地方特別值得被命名，這也是很多阿伊努語地名的思路：先民用最鮮明的地形特徵來稱呼一片土地。"],["北海道","苫小牧","トー・マク・オマ・イ（一說：沼澤深處的地方）","一般認為源自阿伊努語「トマコマイ」，一說指「沼澤後方（深處）的地方」，是典型音譯當字。","","苫小牧的語源出自阿伊努語「トマコマイ」，一般認為與「トー（沼、湖）」有關，意為「沼澤後方的地方」，不過語源仍有其他說法。「苫」是用茅草編成的覆蓋物、「牧」是牧場，兩字只是取音的當字，與地名本意無關。近代這裡因造紙與港口工業而發展。"],["北海道","登別","ヌプル・ペッ（色濃的河）","源自阿伊努語「ヌプル・ペッ」，意為「顏色濃的河」，指因溫泉而混濁的河水。","","登別的舊稱出自阿伊努語「ヌプル・ペッ（nupur-pet）」，意為「顏色濃（混濁）的河」。流經此地的河因為溫泉成分而呈現乳白混濁，先民便以此稱呼。之後「ヌプル」音轉為「ノボル」，並以「登別」二字書寫。今日的登別溫泉是北海道知名的湯鄉。"],["北海道","室蘭","モ・ルエラニ（小小的下坡路）","源自阿伊努語「モ・ルエラニ」，意為「小小的下坡路」，音轉為「モルラン」後寫成「室蘭」。","","室蘭源自阿伊努語「モ・ルエラニ（mo-ruerani）」，意為「小小的下坡路」，指通往海邊的一條緩坡。這個名字後來音轉為「モルラン」，再以「室蘭」二字書寫。這裡有天然良港，明治以後成為鋼鐵與造船工業的城市。"],["北海道","富良野","フーラ・ヌ・イ（有臭味的地方）","源自阿伊努語「フーラ・ヌ・イ」，意為「有臭味的地方」，指硫磺味的河水。","","富良野的語源是阿伊努語「フーラ・ヌ・イ（hura-nu-i）」，意為「有臭味的地方」，指的是從十勝岳流下、帶有硫磺味的河水（富良野川）。今日以薰衣草田聞名的富良野，原來的名字竟然與氣味有關，是個很有反差的地名故事。"],["北海道","知床","シリエトク（大地的盡頭）","源自阿伊努語「シリエトク」，意為「大地（陸地）突出的地方／大地的盡頭」。","","知床半島的名字來自阿伊努語「シリエトク（shir-etok）」，意為「大地（陸地）的盡頭」或「大地突出的地方」。它位於北海道東北端，伸入鄂霍次克海，被登錄為世界自然遺產。這個名字很直白地表達了先民眼中的世界邊緣。"],["青森縣","青森","青き森（港的目標森林）","1624年前後，津輕藩在此整備港口，因港邊一處可供船隻辨認方位的青翠森林而稱為「青森」。","","青森原本只是一個叫「善知鳥村」的小漁村。江戶初期，津輕藩主津輕信枚為了在領內設置良港，選定這一帶整備港口。一般說法認為，港邊有一片青翠的森林，可作為船隻進港時辨認方位的標記，港口便以「青森」為名。這個名字後來成為整個縣的名稱。至於森林究竟在哪裡、是否真有其事，史料並不完整，因此也有其他說法流傳。"],["青森縣","弘前","高岡→弘前","原名「高岡」，1611年（慶長十六年）改名為「弘前」；相傳是接受高僧建議，取自寺院之名。","","弘前城下原稱「高岡」。1611年津輕藩第二代藩主津輕信枚將這裡改名為「弘前」。相傳當時有高僧提議，因為城下有一座名為「弘前」的禪寺，加上「高岡」二字有不吉的聯想，於是改名。不過，這一說法的細節在文獻上有出入，「弘前」的由來因此仍算是傳說性質的說法。"],["青森縣","八戶","南部九戶制","一般認為與古代南部領地劃分的「戶」有關，領內曾有一戶至九戶的地名，八戶是其中之一。","","岩手縣北部到青森縣東部一帶，有「一戶、二戶、三戶、五戶、六戶、七戶、八戶、九戶」等地名（四戶缺）。一般認為，這是中世紀南部氏統治此地時，把領地劃分成若干「戶」的遺留；也有人認為「戶」原本與放牧馬匹的牧場有關。真正的起源還未完全解開，是一個有趣的地名之謎。"],["青森縣","十和田","トー・ワタラ（有岩壁的湖）","一般認為源自阿伊努語「トー・ワタラ」，意為「岩壁很多的湖」。","","十和田湖的名稱，一般認為出自阿伊努語「トー・ワタラ（to-watara）」，意為「有岩壁（岩石）的湖」，形容湖岸險峻的岩壁。「十和田」則是後人借音的當字，並沒有「十」與「和」的含義。也有人認為「十和田」是從古代「十曲（とわだ）」（彎彎曲曲的湖岸）演變而來，因此這是一個「一般說法＋另一說」的典型例子。"],["青森縣","恐山","宇曾利山（ウソリ）","古名「宇曾利山」，一說源自阿伊努語「ウショロ（灣）」，因湖名而來；後來改稱「恐山」。","","下北半島的恐山，古時稱為「宇曾利山」，山中的湖名則為「宇曾利山湖」。「ウソリ」一般認為與阿伊努語「ウショロ（ushoro，灣、凹入之處）」有關。中世紀之後，這裡被視為亡者靈魂聚集的靈場，「恐山」二字據說也是在這段時期，因其肅穆的氛圍而寫成的。名稱的「恐」，是後起的漢字意義，並非最初的語源。"],["青森縣","八甲田","八つの峰と田代","一般認為由「八つの峰（多座山峰）」與高山濕原「田代」合稱而來。","","八甲田山不是一座山，而是由大岳、高田大岳等十多座火山組成的山群。名稱的由來有多種說法，一般認為「八」代表為數眾多的山峰，「甲」與「田」則與山上被稱為「田代」的高山濕原有關。因此「八甲田」，大意是「有許多山峰與濕原的山地」。"],["青森縣","岩木山","イワ・キ（神的山）","一般認為源自阿伊努語「イワキ」，意為「神居住的山」，津輕人稱它為「お岩木山」。","","岩木山是津輕平原的象徵，形狀優美，被稱為「津輕富士」。名稱一般認為來自阿伊努語，「イワ」是山、「キ」是「居住」的意思，合起來是「神居住的山」。當地人至今仍尊敬地稱它為「お岩木山」，山麓的岩木山神社，也把山視為神明之所在。"],["青森縣","陸奧灣","みちのく（道の奥）","「陸奧」古讀「みちのく」，意為「道路的深處」，指東山道盡頭的遙遠地方。","","青森縣的海灣稱為「陸奧灣」。「陸奧」古時讀作「みちのく」，語源被認為是「道の奥（みちのおく）」，也就是「大道的盡頭」。古代從京城出發的道路（如東山道）一路延伸到東北深處，人們便以「道之深處」稱呼這塊遙遠的土地。後來寫成漢字「陸奧」，讀音也逐漸變成「むつ」。「道」字，正是地名記憶的關鍵。"],["岩手縣","岩手","岩に手形（三ツ石伝説）","相傳在三個大石前，鬼被神明降服後在岩石上留下手印，「岩手」即「岩石上的手」。","","岩手縣名的由來，最有名的是「三ツ石伝説」。相傳很久以前，盛岡城下有一個為非作歹的羅剎鬼，村民向三個巨大的岩石祈求神明幫忙，神明便將鬼綁在石頭上。鬼求饒後保證絕不再作惡，並在岩石上按下手印作為憑證，這個地方因此被稱為「岩手」。這是傳說，語源仍另有其他說法，但它十分符合先民用故事替地名添上生命的習慣。"],["岩手縣","盛岡","森岡→盛岡","原稱「森岡」，南部氏為求吉祥改為「盛岡」，「盛」有興盛之意。","","盛岡舊稱「森岡」。江戶時代盛岡藩南部氏認為「森」與「盛」（興盛）同音，且「盛」字含有繁榮之意，較為吉利，於是把城下町的名字改為「盛岡」。不過「森岡」與「盛岡」曾並存一段時間，改稱的時期與經過在文獻上有不同說法，因此「原稱森岡、後改盛岡」為一般說法。"],["岩手縣","遠野","トー・ヌプ（湖の原）","一般認為源自阿伊努語「トー・ヌプ」，意為「湖泊的原野」，遠野盆地在古代可能曾是湖。","","遠野以民間傳說「遠野物語」聞名。地名一般認為來自阿伊努語「トー・ヌプ（to-nup）」，意為「湖之原野」。遠野盆地四面環山，據說很久以前曾是一座湖泊，後來湖水退去成為盆地。「遠野」二字是借音的當字，並不是「遙遠的原野」的意思。"],["岩手縣","二戶","南部九戶制","與八戶同屬南部領地的「戶」制，二戶是「一戶至九戶」之一。","","岩手縣北部的二戶市，和青森縣的八戶、三戶等地，同屬「戶」的地名群。一般認為，這是中世紀南部氏將領地劃分成「戶」的遺跡，例如「一戶」在今日的岩手縣，「九戶」也留有地名。這些地名分散在兩個縣，也讓我們知道：地名的範圍，並不一定與今天的縣界一致。"],["岩手縣","陸中","陸奧國分割（前・中・後）","1868年陸奧國被分割成五國，其中「陸中」位於「陸前」與「陸奧」之間，「前・中・後」表示與京城的遠近。","","古代的「陸奧國」範圍極廣。明治元年（1868年），新政府將它分成五國：陸前、陸中、陸奧、岩代、磐城。「前、中、後」的命名法來自古代「距離京城由近到遠」的排列習慣，如同「越前、越中、越後」。「陸中」大致相當於今日岩手縣大部分地區，這也是「陸中海岸」的由來。"],["岩手縣","北上","北へ流れる川","北上川是一條由南向北流的河川，因而稱為「北上川」，後來成為市名。","","北上川是東北最長的河川，從岩手縣一路向北流，再轉南流入宮城縣。「北上」二字的字面意義，就是「往北走」。當地人早就把這條河看成一條「往上游（北方）行進」的河流。現在的「北上市」，便是以河為名。"],["岩手縣","三陸","陸前・陸中・陸奧","「三陸」指明治初年由陸奧國分出的陸前、陸中、陸奧三國的沿海地區。","","「三陸」不是「三個陸地」，而是指分割後的陸前、陸中、陸奧三國，靠太平洋的沿岸地帶。這片海岸線曲折蜿蜒，形成典型的「里亞斯式海岸」，也是漁業與海嘯歷史的記憶場域。這個名字的背後，是明治政府的行政區劃，也記載著地方對海的依賴。"],["宮城縣","仙台","千代→仙台","伊達政宗在1601年前後築城，把舊稱「千代」改為「仙台」；「仙台」取自中國仙人所居的宮殿之名，是吉祥的好字。","","仙台舊稱「千代」，也寫作「千代城」。1600年代初，伊達政宗開始在青葉山築城，並把地名改為「仙台」。一般說法是：「千代」聽起來有「千年」的吉祥意味，但為了更好的字面，取了中國傳說中仙人居住的「仙臺」之意，改為「仙台」。另一說認為與附近的「千體佛」（千代）有關。無論如何，「仙台」二字，是一次刻意選擇的「好字」。"],["宮城縣","松島","松の島々","海灣中約兩百六十多座大小島嶼多長著松樹，因而稱為「松島」。","","松島灣有兩百六十多座大小島嶼，島上多長著松樹，遠遠望去像是浮在海上的松林。「松島」的名字既直白又貼切，是「用最鮮明的景觀特徵替土地命名」的好例子。松島與安藝的宮島、丹後的天橋立，並稱「日本三景」。"],["宮城縣","塩竈","製鹽的竈","「竈」是煮鹽的爐灶，「塩竈」意為製鹽的地方；相傳塩土老翁曾教導人們製鹽。","","塩竈市的名稱，字面意思是「鹽（塩）的竈（灶）」，也就是用海水煮鹽的爐灶。傳說中，海神「塩土老翁」曾教導當地人們製鹽之法，成為「塩竈神社」祭祀的神明。這個地名，記載著先民用最基本的生活技術來認識土地。"],["宮城縣","蔵王","蔵王権現","蔵王山的名稱來自修驗道所信奉的「蔵王権現」，因山岳信仰而得名。","","蔵王連峰橫跨宮城與山形兩縣。「蔵王」一名，來自修驗道信奉的神明「蔵王権現」，是祭祀山岳的信仰之名，並非描寫山形的字面詞彙。修驗道重視在山中修行，許多山岳名稱都與神佛信仰相關。"],["秋田縣","秋田","齶田（あぎた）","古稱「齶田」，後音轉並改寫為吉祥的好字「秋田」。","","秋田舊稱「齶田」，念作「あぎた」，在日本書紀等古書裡出現過。這個「齶」字十分罕見，意思是「上顎」，有人推測與河口入海的地形有關，但確切語源並不清楚。後來，人們把發音相近、字面更好看的「秋田」二字當作地名，一直沿用至今。這是「難字換成好字」的典型例子。"],["秋田縣","能代","野代（のしろ）","古稱「野代」，同音改用「能」字，寫成「能代」。","","能代舊稱「野代（のしろ）」，意思大致是「野（荒野、原野）的地方」。後來同音改寫成「能代」——「能」有「才能、能夠」的吉祥意涵，與「野」的荒涼感形成對比。這種「同音、好字化」的作法，是日本地名裡最常見的演變之一。"],["秋田縣","大館","大的館（中世城砦）","「館」指中世紀豪族的城砦，因大規模的「大館」城而得名。","","日本東北許多地名帶有「館」字，這裡的「館」不是旅館，而是中世紀豪族所建的小型城砦。「大館」即因此地有規模較大的城砦而得名。這類地名，記載著武士時代地方豪族的存在。"],["秋田縣","大曲","雄物川的大彎曲","因雄物川在此大幅彎曲，而稱為「大曲」。","","大曲位於雄物川與其支流的交匯處。河流在這裡形成大幅度的彎曲，先民便以最直接的地形特徵稱它為「大曲」。這是「河的形狀就是地名」的典型例子，與世界各地許多「河曲」之名相似。"],["秋田縣","八郎潟","八郎太郎的傳說","傳說在此定居的龍神「八郎太郎」，讓這個湖有了「八郎潟」之名。","","八郎潟曾是日本第二大的湖，後來大部分被填造為農地。名稱的由來，來自「八郎太郎」的傳說：據說他原是一個少年，因為吃了不該吃的魚而變成龍，四處尋找棲身之處，最後在這個湖住下，湖便以「八郎」為名。這一類「人變為龍神而留下地名」的傳說，在東北地方相當常見。"],["山形縣","山形","山の方（かた）","一般認為「山形」意為「靠山的地方」；古代已有「山形郷」，並非形容山的形狀。","","山形一名在古代史料（如《和名類聚抄》）中已經出現，是「山形郷」的地名。一般認為「かた」是「方向、一帶」的意思，「山形」就是「山邊、靠山的地方」，而不是形容山的外形。1356年斯波兼頼來到此地築城後，才逐漸發展成今日的城下町。"],["山形縣","出羽","鳥羽の貢ぎ物（一說）","「出羽」語源眾說紛紜，一說是因為此地曾向朝廷進貢鳥羽，故稱「出羽」（出產羽毛）。","","山形與秋田一帶古稱「出羽國」。語源有多種說法：一說出自《風土記》系統的記載，因為朝廷曾在這一帶收取羽毛作為貢品，於是稱為「出羽」（產出羽毛）；也有人認為是「伊氐波（いでは）」這個古老地名的當字。至今沒有定論，是一個典型的「有爭議的地名」。"],["山形縣","米沢","ヨネ（米）のある沢","一般認為與稻米豐饒的谷地有關，「米」與「沢（河谷）」合起來就是「產米的河谷」。","","米沢位於山形縣南部的盆地。地名一般解為「產米的沢（河谷）」，形容這裡水田廣布、稻米豐富。江戶時代，米沢藩上杉氏曾在此統治，名君上杉鷹山的藩政改革也與這片土地密不可分。不過，「よね」的語源另有說法，因此這仍屬於「一般說法」而非定論。"],["山形縣","酒田","砂潟（さかた）／酒田（一說）","一說源自「砂潟」或「栄田」，後改寫為「酒田」；江戶時代因米與酒運輸而繁榮。","","酒田是最上川河口的港町，也是江戶時代北前船的重要港口。地名的語源有多種說法：一說是最上川河口的沙洲「砂潟（さかた）」，另一說與「栄田」有關，後來寫成了「酒田」，恰好與酒的印象相符。至於「酒」字，往往是後來才選擇的好字，而不是最初的含義。"],["山形縣","鶴岡","鶴ヶ岡（吉祥）","1622年酒井忠勝入封後，因「鶴」象徵長壽吉祥，將城稱為「鶴ヶ岡」，簡稱「鶴岡」。","","鶴岡舊稱「大寶寺」。江戶初期，庄內藩主酒井氏入封後，把這裡改稱「鶴ヶ岡」，再簡稱為「鶴岡」。鶴在日本被視為長壽的象徵，替城下町取這個名字，是希望這座城市長久繁榮。這是「刻意為城取好名」的例子。"],["福島縣","福島","腹掻／吹島（一說）","一說舊稱「腹掻」等，後為求吉祥而改稱「福島」；語源另有說法，尚無定論。","","福島市的舊名有多種說法，如「杖立山」、「腹掻」、「吹島」等。一般認為，後來人們為了好字面，把它寫成「福島」——「福」象徵幸福，「島」在此可能指河中的沙洲或丘陵。至於究竟何者為源頭，並無公論。因此它是「多說並存」的地名。"],["福島縣","会津","相津（相會之津）","相傳古代兩位將軍在此相會，於是稱為「相津」，後來寫成「会津」。","","《古事記》與《日本書紀》裡，記載崇神天皇派出的兩位「將軍」——大彥命與建沼河別命，分別從北陸與東海方向進入東北，並在會津相會，因此稱為「相津（あいづ）」，日後寫成「会津」。這是流傳很久的傳說性由來，也有人認為地名可能另有起源，但這個傳說已成為會津人的驕傲。"],["福島縣","いわき","磐城國／五市合併（1966）","1966年由五個市合併而成，為避免偏袒任何一個舊市名，採用假名「いわき」，源自古代的「磐城國」。","","1966年，磐城、平、小名濱、勿來、植田等五個市合併成新的市，為了不偏袒任何一個舊市的名字，新市採用了平假名「いわき」。它的源頭是古代的「磐城國」（岩石的城柵之意）。日本的大城市用假名書寫，是相當少見的例子，也提醒我們：地名的更動，有時是為了平衡地方感情。"],["福島縣","喜多方","北方→喜多方","本為「北方」，明治時代改為吉祥的字面「喜多方」，意為「多喜之處」。","","喜多方位於會津盆地的北部，因為在會津的北方，原本稱作「北方（きたかた）」。明治時代改寫成「喜多方」，其中的「喜」有「喜悅」之意，「多」有「豐富」之意，是把方位名換成吉祥字。這是明治時期常見的「換字」手法。"],["福島縣","二本松","二本の松の伝説","相傳畠山氏築城時，白旗峰上有兩棵松樹，因此稱為「二本松」。","","二本松的名稱，傳說是室町時代畠山氏築城時，在山上留下兩棵松樹，作為築城之象徵。這兩棵松樹（二本松）便成為地名，後來也成為城池、市名的名稱。以「兩棵樹」為名，是一種很有畫面感的命名法。"],["福島縣","白河","白い川（一說）","一般認為與「白い川」或清流有關；「白河関」是古代通往東北的重要關卡。","","白河一名，一般認為來自流過此地的河川「白河（白川）」，取其水質清澈、河面泛白之意，但語源仍有其他說法。這裡自古設有「白河關」，是通往陸奧的要衝，與勿來關、念珠關並稱奧州三關，許多歌人曾在此留下詩歌。"],["茨城縣","茨城","茨（荊棘）で築いた城","《常陸國風土記》記載，古代黑坂命用荊棘（茨）築城圍攻穴居的土著，因而得名「茨城」。","","「茨城」一名，最早見於《常陸國風土記》。書中記載：很久以前，這一帶住著住在洞穴裡的土著，朝廷派來的黑坂命想出一個計策，用荊棘（茨）堆成一座城，再把他們引來、一網打盡，這個地方因此被稱為「茨城」。這是風土記的記載，屬於傳說性質的由來，但它讓一個縣名，擁有了古代征討與築城的故事。"],["茨城縣","水戶","水の戸（渡口、入口）","一般認為「水戶」意為「水的出入口」，指河流與湖沼的渡口或港灣。","","水戶（みと）的「戶」，在古地名裡常指「出入口」，如「江戶」的「戶」。一般認為「水戶」是「水的入口」，位於那珂川與千波湖之間，是水路交通的渡口或港灣。江戶時代，這裡成為水戶德川家的城下町。至於「水戶」與「港（みなと）」的語源關係，也有學者提出，因此屬於「一般說法」。"],["茨城縣","筑波","筑箪命の名","《常陸國風土記》記載，相傳古代的國造「筑箪命」希望自己的名字留在這片土地上，因而稱為「筑波」。","","筑波山是關東平原上的名山，有「西之富士、東之筑波」的說法。《常陸國風土記》記載，當初有位名叫「筑箪命」的國造來到這裡，說希望把自己的名字留給這片土地，於是山被稱為「筑波」。這是風土記的說法，當然也有其他學者提出不同的語源，但這一則故事，是筑波最古老、最有名的由來。"],["茨城縣","日立","日の立ち上る所","一般說法是江戶時代水戶藩主德川光圀所命名，取「朝日升起的地方」之意。","","日立市位於茨城縣東北角，面向太平洋，早晨的太陽從海上升起。傳說水戶藩主德川光圀（即水戶黃門）來到此地，看見海上日出，便為這個地方取名「日立」，意思是「日之升起處」。這是流傳很廣的一般說法，但史料上是否完全出自光圀，也有不同意見。"],["茨城縣","常陸","ひたみち（直道）","《常陸國風土記》說，因道路直通、不被江海阻隔，因此稱為「ひたみち」，簡化為「ひたち」，寫作「常陸」。","","古代的「常陸國」，也就是今日茨城縣大部分的範圍。《風土記》記載，這一帶道路平直通達，不必渡越江海，因此稱為「ひたみち（直道）」，日後簡化為「ひたち」，漢字寫成「常陸」。也有其他語源說法，但這一則「直道」的由來，是最常被提到的說法。"],["栃木縣","栃木","十千木（一說）","一說因神社屋頂上並列十根「千木」而得名「十千木」，後演變為「栃木」；亦有「栃（橡）樹」之說。","","栃木的語源有多種說法。有名的一說是「十千木（とおちぎ）」：據說這裡的神社屋頂並列著十根千木（神社屋脊兩端交叉的木條），人們稱這個地方為「十千木」，後來變成了「栃木」。另一說則與「栃（橡樹、七葉樹）」的樹木有關。兩說都無法完全證實，因此是一個「多說並存」的地名。"],["栃木縣","下野","下毛野（しもつけの）","古代「毛野國」分為上毛野與下毛野，「下毛野」簡化為「下野」，即今日栃木縣。","","古代關東北部有一個稱為「毛野（けの）」的大國，後來分成「上毛野」與「下毛野」兩國，簡稱「上野（こうずけ）」與「下野（しもつけ）」。栃木縣就是古時的下野國，群馬縣則是上野國。「上、下」與「前、中、後」同樣是用來區分靠近或遠離京城的排列習慣。"],["栃木縣","宇都宮","一の宮（一說）","一說「宇都宮」由「一之宮」（此地的首席神社二荒山神社）轉音而來。","","宇都宮的地名由來有多種說法。其中一說是：這裡是下野國的「一之宮（首席神社）」二荒山神社所在地，「いちのみや」在發音上轉為「うつのみや」，寫成「宇都宮」。另外也有「討つ宮」等其他說法，但沒有定論。這一帶的城下町與神社，深深影響了地名的形成。"],["栃木縣","日光","二荒山（ふたらさん）","古稱「二荒山」，音讀為「にこう」，相傳空海改寫為吉祥的「日光」二字。","","日光的男體山，古稱「二荒山（ふたらさん）」。「二荒」的音讀是「にこう」，後來人們把這個音改寫成「日光」，因為「日光」有吉祥、光明的意思。相傳這是弘法大師（空海）所改。地名從難字變成好字，也讓這片山地成為後世最有名的聖地之一。"],["栃木縣","鬼怒川","絹川／衣川（一說）","一說古稱「絹川」，江戶時期起改寫為「鬼怒川」，「鬼怒」是借音的當字。","","鬼怒川流過栃木、茨城、千葉三個縣。古時有「絹川」、「衣川」等寫法，發音與「きぬ」相同。江戶時代前後，逐漸寫成「鬼怒川」，其中的「鬼」與「怒」只是借音的當字，並不表示河流特別兇猛。不過，河水奔流的形象與這兩個字，恰好形成有趣的巧合。"],["群馬縣","群馬","車（くるま）→群馬","古代郡名讀作「くるま」，寫作「群馬」，後來唸成「ぐんま」；「群」與「馬」也帶有牧馬之地的意象。","","群馬縣的名字，古代是「群馬郡」，讀音是「くるま」，可能與「車」有關。奈良時代規定地名要用兩個好字，於是把「くるま」寫成「群馬」，後來讀音也轉成了「ぐんま」。這片土地又自古以養馬聞名，字面上的「群馬」，也讓人聯想到成群的馬。這是「先有聲音、後有漢字」的典型例子。"],["群馬縣","上野","上毛野（かみつけの）","古代「毛野國」的上半部稱為「上毛野」，簡稱「上野（こうずけ）」，即今日群馬縣。","","與栃木縣的「下野」相對，群馬縣古稱「上野（こうずけ）」。它來自「上毛野（かみつけの）」，是把古代的毛野國分成兩半的結果。因此，群馬的別稱是「上州」，取自「上野國」。這是一個把日期、方位放進地名的好例子。"],["群馬縣","前橋","厩橋→前橋","舊稱「厩橋（うまやばし）」，江戶末期為求好字改稱「前橋」。","","前橋城下在江戶時代稱為「厩橋」，據說與馬廄附近的橋有關。江戶時代末期，「厩橋」被改寫為「前橋」，一般認為是因為「厩」字較難，且有換成好字的用意。改名的動機與時間，各種資料的說法略有出入。"],["群馬縣","高崎","和田→高崎","1598年井伊直政築城後，將舊稱「和田」改為「高崎」，取吉祥好字。","","高崎一帶舊稱「和田」，1598年井伊直政在此築城，將地名改為「高崎」。一般認為這是改稱為吉祥好字的結果，「崎」在日文中常指突出的高地或岬。改名的細節在史料上並不完整，但高崎後來確實成為中山道與三國街道分岔的交通要衝。"],["群馬縣","草津","臭水（くさうず）","一般說法是源自溫泉中的硫磺臭味「臭水（くさうず）」，後轉為「くさつ」，寫作「草津」。","","草津溫泉是日本三大名泉之一。「草津」的語源，一般說是「臭水（くさうず）」，指這裡的溫泉水帶有濃烈的硫磺氣味。日文中的「くさ」是「臭」的意思，「うず」則是「水」的古語。後來音轉為「くさつ」，並寫成好看的「草津」二字。不過語源另有其他說法，因此屬於「一般說法」。"],["埼玉縣","埼玉","前玉（さきたま）","來自「前玉（さきたま）」這個古老地名，相傳與祭祀「幸魂」的前玉神社有關，音轉成「さいたま」。","","埼玉縣的名稱，來自古代的「埼玉郡」，語源被認為是「前玉（さきたま）」。行田市一帶至今仍有「埼玉（さきたま）古墳群」，這裡的前玉神社，據說祭祀著「幸魂（さきみたま）」。「さきたま」的發音，逐漸轉成了「さいたま」。因此，埼玉的名字，是從古墳與神社的所在地開始的。"],["埼玉縣","川越","河越（かわごえ）","古稱「河越」，一說與渡越入間川的渡口有關，後改寫為「川越」。","","川越舊稱「河越」，中世紀有名門河越氏在此。一般認為，「河越」意指「渡過河流之處」，指這一帶在入間川旁的重要渡口。江戶時代之後，寫法轉為「川越」。這座城下町保留了許多倉造的老街，也被稱為「小江戶」。"],["埼玉縣","所沢","野老（ところ）の沢","一說因這一帶生長很多野老（山藥類植物），因而稱為「所沢（ところざわ）」。","","所沢（ところざわ）的語源，一般認為與「野老（ところ）」有關。「野老」是一種山藥類的野生植物，據說這裡的沢（谷地）生長著許多野老，因而稱為「野老沢」，後來改寫為「所沢」。「所」字只是借音的當字。這是一個「用植物命名土地」的例子。"],["埼玉縣","大宮","大いなる宮（氷川神社）","「大宮」意為「偉大的神社」，指武藏國一之宮氷川神社。","","大宮的名稱，一般認為來自「大いなる宮（偉大的神宮）」，指這一帶的氷川神社，是武藏國的一之宮，地位極高。日本許多城市都有以神社為名的地名，「大宮」是最典型的例子之一。"],["埼玉縣","秩父","知知夫（語源不詳）","古稱「知知夫」，奈良時代以好字令改寫為「秩父」；語源至今沒有定論。","","秩父在《國造本紀》中寫作「知知夫」，後來為了好字，改為「秩父」。至於「ちちぶ」到底是什麼意思，學者們有不同意見，例如與「ちち（乳）」有關、與地形有關等等，都沒有定論。它是一個真正「沒有標準答案」的地名。"],["千葉縣","千葉","千の葉（一說）","一說「千葉」意為「千片葉子」，形容植物繁茂、物產豐饒；語源另有其他說法。","","千葉的語源眾說紛紜。有一說是「千の葉」，意指這裡草木茂盛；也有人認為與「ちば（茅場）」或古代地名相關。中世紀時，這裡是千葉氏的領地，他們以地為姓。無論哪一說，這個名字都給人生機盎然的印象。"],["千葉縣","房総","総（ふさ）と麻","古代稱為「総（ふさ）國」，一說「総」意為「麻」；後分為上総、下総與安房，合稱「房総」。","","千葉縣大部分地區，古代稱為「総國（ふさのくに）」。「総（ふさ）」一說與「麻」有關，指這裡栽種麻的地方，麻是古代重要的織物原料。後來「総國」分為「上総」與「下総」，加上「安房」，三者合稱「房総」。「上總」與「下總」，是以離京城的遠近來區分的（「近的在下、遠的在上」）。"],["千葉縣","銚子","酒壺形的河口","利根川河口狹窄，形狀像酒器「銚子（長柄酒壺）」，因而得名。","","銚子位於利根川的河口，河口處狹窄，形狀很像一把酒壺（銚子）。銚子是日本人用來倒酒的長柄酒壺，先民便以此形象為地方命名。這裡是關東最東端的港口城市，也是醬油之鄉。"],["千葉縣","木更津","君去らず（弟橘媛の伝説）","相傳日本武尊的妻子弟橘媛投海，日本武尊悲嘆「君（你）不離去」，因而稱為「木更津（きさらづ）」。","","傳說日本武尊（ヤマトタケル）渡海時遇到暴風，他的妻子弟橘媛為了平息海神的怒氣，投身入海。日本武尊悲痛不已，佇立在岸邊，說「君（きみ）去らず（さらず）」，意為「你沒有離去」，這個地名便成為「きみさらず」→「きさらづ」，寫作「木更津」。這是傳說性質的說法，但廣為人知。"],["千葉縣","館山","山上的館","「館」指城砦，館山因里見氏在山上築城而得名。","","館山之名，指的是「城館所在的山」。戰國時代，里見氏在這一帶的山丘築起城砦，人們便以此稱呼周邊的地區，日後成為城下町與港口。「館」在日本東北與關東的地名中，多半表示中世紀的小型城砦。"],["東京都","東京","江戸→東京（1868）","1868年（慶應四年／明治元年），江戶改稱「東京」，意為「東方的京都」，對應西邊的京都。","","1868年，明治新政府決定把江戶改稱「東京」，並下詔書說：江戶是東國第一大都會，因此稱「東京」，意為「東邊的京」。當時的京都被稱為「西京」，兩京並立。後來天皇遷入江戶城，東京成為事實上的首都。這個改名，也是日本近代化的象徵。"],["東京都","江戸","入江の戸（入口）","「江」是入江、「戶」是出入口，江戶意為「入江的入口」，1457年太田道灌築江戶城。","","江戶的「江」，指的是當時延伸到今日日比谷一帶的入江（海灣）；「戶」則是出入口。「江戶」合起來，就是「入江的入口」。1457年，太田道灌在此築城，1590年德川家康入城，這裡才逐漸成為幕府的所在地。武士家「江戶氏」的姓氏是來自這個地名，而不是相反。"],["東京都","渋谷","渋谷氏（一說）","一般認為得名於平安末期的武士「渋谷氏」，領有此地；另有溪谷之說。","","渋谷一名，一般認為來自平安時代末期的豪族「渋谷氏」，他們在這一帶築有城館，因此以「渋谷」稱呼這個地區。也有人認為與這裡的地形有關，因為渋谷是被河谷（渋谷川）圍繞的低地。無論如何，今日的渋谷是全球知名的十字路口，名字裡卻藏著武士的痕跡。"],["東京都","新宿","内藤新宿","1698年幕府在甲州街道上設置新的宿場「内藤新宿」，簡稱「新宿」。","","江戶時代，甲州街道上原本的第一個宿場在高井戶，距離江戶較遠。1698年（元祿十一年），幕府在內藤家的屋敷旁設置了新的宿場，稱為「內藤新宿」，簡稱「新宿」，字面就是「新的宿場」。這是一個直接寫著「新設的驛站」的地名。"],["東京都","銀座","銀貨鑄造所（1612）","1612年江戶幕府在此設置鑄造銀幣的「銀座」，該區因此得名。","","銀座的名稱，來自江戶幕府為了鑄造與管理銀幣而設立的機構「銀座」。「座」在江戶時代，是一種特許的同業組織。1612年，幕府在今日的銀座一帶設立了銀座，這裡的町名便叫「銀座」。原本「銀座」是一個官方機構的名字，最後卻成了地名。"],["東京都","秋葉原","秋葉神社（火除け地）","1869年火災後，此地設置防火空地並祭祀秋葉神社，人稱「秋葉原（秋葉の原）」。","","1869年（明治二年），此處發生大火，明治政府為了防止再次延燒，把這裡整理成空地（火除け地），並建造祭祀火神的秋葉神社（秋葉大權現）。人們稱這片空地為「秋葉原（秋葉的原野）」，後來成為地名。現代的電器街，其實是從一片防火空地開始的。"],["神奈川縣","神奈川","上無川／神奈備（一說）","語源尚無定論，一說為「上無川（找不到上游的川）」，一說與「神奈備（神居的山）」有關。","","神奈川的語源有很多說法，並無定論。其中一說是「上無川」，指沒有上游、水源不明的川；另一說與「神奈備（かんなび）」有關，指神明居住的山或森林。江戶時代，這裡曾是東海道上的宿場「神奈川宿」，「神奈川」這個地名，後來擴大成整個縣的名稱。"],["神奈川縣","横浜","横に長い浜（砂州）","江戶初期的「橫浜村」，位於入江中橫向突出的沙洲，因而稱為「橫濱」。","","橫濱的名稱，來自這裡原本是一個位於入江中的沙洲，橫向延伸，因此被稱為「橫向的濱」。江戶時代是一個半農半漁的小村。1859年開港以後，橫濱才逐漸成為國際港口。日文「浜」是「濱」的簡寫。"],["神奈川縣","鎌倉","かま（竈・谷）＋くら","一般認為與地形有關：「かま」指竈般的谷地，「くら」指懸崖或谷地；另有藤原鎌足埋鎌的傳說。","","鎌倉的語源，一般認為是地形的描述：「かま」與「竈（かまど）」的形狀相似，指這一帶三面環山、一面向海的谷地地形；「くら」則與谷、斷崖有關。另外，也有傳說是藤原鎌足在此埋下鎌刀而得名，但這一說偏向後世附會。這是一個「地形說」與「傳說」並存的地名。"],["神奈川縣","箱根","箱（筥）のような山","一般認為因火山口周圍的山形像「箱（筥）」而得名，古寫作「筥根」。","","箱根山是一座火山，山頂有著巨大的火山口（カルデラ）。一般認為，這座山的外形像一個方形的盒子（筥、箱），因此古時稱為「筥根」，後來寫成「箱根」。這也是「用外形替山命名」的一個例子。"],["神奈川縣","江ノ島","入江の島","「江」指河川的入江，江之島是一座位於入江旁的島（實際上為連接陸地的陸繫島）。","","江之島位於相模灣，與陸地之間有一條沙洲相連，退潮時可以走路過去。「江」在日文中有入江、河灣的意思，所以「江ノ島」意為「入江旁的島」。地名與江戶的「江」相同，都是描寫入江地形的語言。"],["新潟縣","新潟","新しい潟（ラグーン）","一般認為「潟」指河口的潟湖與泥灘，「新潟」意為「新形成的潟」，指信濃川河口一帶。","","「潟」是海岸邊被沙洲圍起來的淺水湖或泥灘。新潟位於信濃川與阿賀野川的河口，河流帶來的泥沙不斷堆積，形成新的潟地，人們便稱它為「新潟」，意為「新的潟」。戰國時代的文獻中已經出現「新潟津」的寫法。1858年的條約指定的通商港口中，新潟也名列其中，後來在1869年開港。"],["新潟縣","越後","越の国（前・中・後）","古代「越國」分為越前、越中、越後三國，「後」表示離京城最遠的一段，「越後」即今日新潟縣。","","古代北陸地方稱為「越國（こしのくに）」，「越」可能與翻山越嶺才能到達有關（此為一般說法，另有其他說法）。7世紀末，越國依離京城的遠近分成三國：最近的是「越前」（今福井），中間是「越中」（今富山），最遠的是「越後」（今新潟）。這種「前、中、後」的排法，與陸前、陸中、陸奧相同。"],["新潟縣","長岡","長い丘（一說）","一說「長岡」意為「細長的丘陵」，指這一帶的地形；江戶時代成為長岡藩城下町。","","長岡一名，一般認為是「細長的丘（岡）」，形容這一帶的丘陵地形。1616年，堀直寄在此築城，逐漸發展為城下町。地名的語源另有其他說法，因此屬於「一般說法」。"],["新潟縣","妙高","須彌山（妙高山）","「妙高」是佛教中須彌山的漢譯名，指世界中心的聖山，用來稱呼山容端整的妙高山。","","佛教裡的世界中心有一座巨大的聖山，稱為「須彌山」，漢譯又作「妙高山」，意指美妙且高聳。人們看見新潟南部山容端整、雄偉的火山，便借用這個佛教名詞，稱它為「妙高山」。這是宗教名詞直接變成地名的例子。"],["富山縣","富山","外山（とやま）→富山（一說）","一說舊稱「外山（とやま）」，後改寫為吉祥的「富山」，意為「富足之山」。","","富山的語源有多種說法。一說古稱「外山（とやま）」，指山的外側、靠近平原的丘陵；後來為了取好字，改寫成「富山」。「富」有富足之意，讀音仍保持不變。地名的細節，各種資料的說法略有出入。"],["富山縣","高岡","鳳凰鳴彼高岡（詩經）","1609年前田利長築城時，取自《詩經》「鳳凰鳴矣，于彼高岡」，將地名定為「高岡」。","","高岡舊稱「關野」，1609年加賀藩主前田利長在此築城，並將地名改為「高岡」。傳說出自中國《詩經》的詩句「鳳凰鳴矣，于彼高岡」——鳳凰在高岡上鳴叫，象徵吉祥。這是引用古典詩句為城市命名的例子，說法在當地廣為流傳。"],["富山縣","立山","高聳直立的山（一說）","一說「立山」形容山勢高聳直立，也與山岳信仰有關，是日本三大靈山之一。","","立山連峰是北陸的高山，自古就是山岳信仰的聖地，與富士山、白山並稱日本三大靈山。「立山」的語源有多種說法，一般認為與山勢高聳直立有關；也有與神明「顯現」的說法。名稱的細節仍有討論空間。"],["石川縣","金沢","金洗沢（芋掘藤五郎の伝説）","傳說有位挖芋的窮人藤五郎在泉水邊洗芋，芋上竟沾著金砂，此處便稱為「金洗沢」，簡化為「金沢」。","","相傳很久以前，有個名叫藤五郎的窮人，靠挖山芋維生。他在山中泉水邊洗芋頭時，發現水中竟有金砂，因此致富。這個地方被稱為「金洗沢（かねあらいざわ）」，後來簡化成「金沢」。這是傳說性質的由來，金沢城下的「金城霊沢」，被認為就是傳說中的泉水。"],["石川縣","石川","石の多い川（一說）","一說因手取川一帶河灘多石，稱為「石川」，古代設有「石川郡」。","","石川縣的名稱，來自古代的「石川郡」。一般認為，這一帶的河川（手取川）河灘有許多石頭，因此稱為「石川」。這是一個用河流特徵直接命名的例子。不過，縣名本身是明治時期取用當時的郡名，並非最古老的地名。"],["石川縣","能登","ノッ（岬）（一說）","一說「能登」源自阿伊努語「ノッ」（岬、下巴），形容突出於海中的半島；語源另有其他說法。","","能登半島像手臂一樣伸入日本海。「能登」的語源，有一說是阿伊努語的「ノッ（not）」，意思是「岬」或「下巴」，指突出於海中的地形。不過這只是其中一說，也有人認為出自古代日語。至今沒有定論。"],["石川縣","七尾","七つの尾根","七尾城建在有七條山脊（尾根）的山上，這些山脊分別有松尾、竹尾、梅尾等名，「七尾」因此得名。","","中世紀，能登的守護畠山氏在山上築起七尾城。這座山有七條山脊，人們稱為「松尾、竹尾、梅尾、菊尾、亀尾、虎尾、龍尾」，合稱「七尾」。後來這個名字也成為城下町與市的名稱。這是從山形直接取名的例子。"],["石川縣","兼六園","六勝兼備（洛陽名園記）","1822年松平定信取自中國《洛陽名園記》，庭園難以同時具備宏大、幽邃、人力、蒼古、水泉、眺望六種優點，這座園卻全部兼備，故名「兼六」。","","兼六園是日本三名園之一。「兼六」二字，出自中國宋代《洛陽名園記》：名園很難同時擁有宏大、幽邃、人力、蒼古、水泉、眺望六種優點，而這座庭園全都具備，因此稱為「兼六園」。命名者是白河藩前藩主松平定信，時間為1822年。這是用典籍為庭園命名的例子。"],["福井縣","福井","北ノ庄→福居→福井","舊稱「北ノ庄」，1624年前後改稱「福居」，之後寫成「福井」，取吉祥好字。","","福井舊稱「北ノ庄」，是戰國時代柴田勝家的居城所在。江戶時代初期，福井藩主松平忠昌把地名改為「福居」，後來轉寫為「福井」。「福」是吉祥，「井」是水井。這是把不吉利或平凡的地名，替換成吉祥字的例子。改名細節，資料略有出入。"],["福井縣","越前","越の国（最近京城）","古代越國中最靠近京城的一段，稱為「越前」，與越中、越後並列。","","「越前」是古代越國三分的其中之一，在三國中最靠近京城（畿內），因此稱為「前」。今日福井縣的嶺北地區，大致相當於越前國。與新潟的「越後」相對，兩個名字之間隔著富山的「越中」，形成一組「前、中、後」的地名。"],["福井縣","敦賀","角鹿（つぬが）の伝説","傳說古代有位頭上長角的異國王子來到此地，因而稱為「角鹿（つぬが）」，後改寫為「敦賀」。","","《日本書紀》記載，崇神天皇時代，有一位額頭長角的異國人「都怒我阿羅斯等（つぬがあらしと）」來到這裡，人們便稱這個地方為「角鹿（つぬが）」。後來，發音變成「つるが」，並改寫為「敦賀」。這是傳說性質的由來。敦賀後來成為對外交流的重要港口。"],["福井縣","永平寺","永平（後漢明帝年號）","道元禪師1244年建寺，取後漢明帝的年號「永平」，因為佛教在這一時期傳入中國。","","永平寺是曹洞宗的大本山，由道元禪師創建。最初名為「大佛寺」，後來改為「永平寺」。「永平」是中國後漢明帝的年號（58～75年），一般認為佛教是在這一時期傳入中國，因此道元以此為寺命名，表達復興正統佛法的心意。這是以年號為寺院命名的例子。"],["山梨縣","山梨","山梨（野生の梨）（一說）","一說得名於野生梨樹「山梨（やまなし）」；語源另有「山の梨」以外的說法。","","山梨的語源有多種說法。一說是「山梨（やまなし）」，這種野生的梨樹在這裡自古就有。也有人認為與地形有關，如「山の平らな所」。縣名來自古代的「山梨郡」，並非近代才取的名字。這是一個沒有定論的地名。"],["山梨縣","甲斐","峡（かい）：山あい","一般認為「甲斐」來自「峡（かい）」，意為山與山之間的谷地。","","古代山梨稱為「甲斐國」。「かい」一般認為是「峡」，指群山之間的谷地。「甲斐」二字是奈良時代為地名選定好字時的寫法，這個國名到今天還保留在「甲斐市」等地名裡。"],["山梨縣","甲府","甲斐の府中","「府」是國府，「甲斐の府中」簡稱為「甲府」，意為甲斐國的首府。","","古代各國都設有「國府」，也稱為「府中」。甲斐國的府中被稱為「甲斐の府中」，之後簡稱為「甲府」。戰國時代，武田氏在此築起居館，甲府逐漸發展成城下町。這是把「國名＋府」合成為地名的例子。"],["山梨縣","富士","ふじ（語源不明）","富士山名稱的語源眾說紛紜：不二、不盡、福慈，也有阿伊努語「フチ（火之神）」一說，至今沒有定論。","","富士山的語源是日本最有名的爭議之一。有「不二（無二之山）」、「不盡（不會窮盡）」等文字遊戲式的說法；《常陸國風土記》寫作「福慈」；也有一說是阿伊努語的「フチ（火之神、老奶奶）」。「富士」二字是後來選定的好字，意為「富裕的武士」。語源至今沒有定論，是「沒有標準答案」的地名。"],["長野縣","長野","長い野（一說）","一說「長野」意為「長長的原野」，指善光寺平一帶的地形；語源另有其他說法。","","長野的名字，一般認為是「長い野（長長的原野）」，形容善光寺平一帶的地形。也有人認為它與古代的「長野郷」或人名有關。長野市是以善光寺為中心發展的門前町，後來成為縣廳所在地。"],["長野縣","信濃","科野（しなの）","古稱「科野」，一說指山地的階梯狀地形，一說指「科（シナ）樹」多的野地。","","長野縣古稱「信濃國」，古寫作「科野」。「しな」的意思有多種說法：一說是「階（しな）」，指多重階梯般的山地地形；另一說是「科（シナノキ）」這種樹木很多的原野。奈良時代以好字令，改寫成「信濃」。至今仍未有定論。"],["長野縣","軽井沢","軽石・涸れ沢（一說）","一說與淺間山噴出的輕石有關，也有「水涸的沢」等說法；語源尚無定論。","","輕井澤位於淺間山山麓。名稱的由來有多種說法：一說是與淺間山噴發時飛散的輕石（軽石）有關；另一說是水涸的沢。這些說法都缺乏決定性的證據，因此屬於「多說並存」的地名。"],["長野縣","木曽","木の岨（一說）","一說「木曽」意為「多樹木的陡峭山地（岨）」，指木曾川流域。","","木曽指的是木曾川上游的山地，自古以林業聞名。名稱的語源，一般認為是「木（樹）」加上「岨（そ、陡峭的山坡）」，也就是多樹木的險峻山地。另有其他說法，因此屬於「一般說法」。這裡也是中山道的木曾十一宿所在地。"],["岐阜縣","岐阜","井ノ口→岐阜（1567）","1567年織田信長攻下此城後，採納僧人沢彦宗恩的建議，將舊稱「井ノ口」改為「岐阜」。","","岐阜舊稱「井ノ口」。1567年，織田信長攻下齋藤氏的稻葉山城，移居此地，並採納禪僧沢彦宗恩的建議改名。一般說法認為，「岐」取自周文王興起的「岐山」，「阜」取自孔子的出生地「曲阜」，象徵在此奠定天下大業。信長也是在這一時期開始使用「天下布武」的印章。"],["岐阜縣","飛騨","ひだ（襞）（一說）","一般認為與「襞（ひだ）」——山谷折疊般的地形有關，是多山、多谷的飛騨地區的寫照。","","飛騨是岐阜縣北部的山地。「ひだ」一般認為是「襞」，指衣服的褶子，形容山谷層層折疊的地形。這是「用形狀說明土地」的命名法。奈良時代，人們以「飛騨」二字書寫，並沿用至今。語源另有其他說法。"],["岐阜縣","美濃","御野（みの）（一說）","一說「美濃」原為「御野」，是對天子御料地的尊稱；另有其他說法。","","美濃是岐阜縣南部的舊國名。「みの」的語源有多種說法，其中一說是「御野（みの）」，意為尊貴的原野。後來以好字改寫成「美濃」，「美」是美好，「濃」是濃厚豐饒。這是把發音留下、字面換成好字的例子。"],["岐阜縣","関ヶ原","不破関の原","古代的三關之一「不破關」位於此地，「關之原」因此得名「関ヶ原」。","","古代日本在通往東國的要衝設有關卡，其中「不破關（ふわのせき）」位於今岐阜縣。「関ヶ原」意為「關口所在的原野」。1600年的關原之戰就發生在這個地方，這場戰役決定了德川家康的天下，也讓這個地名成為日本史上的代名詞。"],["靜岡縣","静岡","賤機山→静岡（1869）","1869年由「府中」改稱；因「賤」有卑賤之意，避開而改用「静」，以「静岡」為名。","","靜岡舊稱「駿府」，也稱「府中」。1869年（明治二年），德川家移封至此，因為「府中」在各地重複，需要新的名字。當時附近有座「賤機山（しずはたやま）」，人們認為「賤」字不吉，便取同樣讀音的「静」，加上「岡」，成為「静岡」。這是避免不吉字眼而改字的典型例子。"],["靜岡縣","浜松","引馬→浜松（家康）","舊稱「引馬（ひくま）」，德川家康認為「引馬」聯想到敗走，因而改為「浜松」。","","浜松舊稱「引馬（ひくま）」。傳說1570年德川家康進入這裡後，覺得「引馬」（牽馬退走）聽起來像戰敗撤退，很不吉利，便改稱「浜松」。這個說法流傳很廣，但改名的時間與細節，史料並不完整。這是因為「忌諱」而改名的例子。"],["靜岡縣","熱海","熱い海（湧き湯）","傳說海中湧出熱水、魚都被燙死，因此稱為「熱海」；後來高僧將熱水引向陸地，成為溫泉。","","「熱海」字面意義就是「熱的海」。傳說古時海中有熱水湧出，海水沸騰，魚都被燙死。箱根權現的萬巻上人向神明祈禱，熱水才轉向陸地，成為現在的溫泉。這是傳說，但「熱海」這個直白的名字，正說明了這片海灣的特色。"],["靜岡縣","伊豆","出づ（突出）（一說）","一說「伊豆」源自「出づ」，指突出於海中的半島；另有「湯」之說。","","伊豆半島突出於太平洋。「伊豆」的語源，一說是「出づ（いづ）」，意為突出、向外伸出；另一說與「湯（ゆ）」有關，因為這裡有許多溫泉。這些說法都沒有得到完全證實，因此屬於「多說並存」。"],["愛知縣","名古屋","那古野（なごの）（一說）","舊稱「那古野」，一說「なご」意為平穩和緩，形容平坦的台地；語源另有其他說法。","","名古屋舊稱「那古野（なごの）」。「なご」一般認為有「和（なごやか）」、平穩之意，形容平坦的台地，但也有其他說法。1610年，德川家康下令建築名古屋城，並把整個城下町從清洲遷來（稱為「清洲越し」），從此名古屋成為尾張的中心。"],["愛知縣","愛知","年魚市（あゆち）","古稱「年魚市（あゆち）」，後來音轉並改寫為「愛智」、「愛知」。","","《萬葉集》裡出現「年魚市潟」，讀作「あゆちがた」，指的是今日名古屋南部的海灣。「あゆち」的語源，一說與「あゆ（東風）」有關。後來「あゆち」改寫成「愛智」，再演變成「愛知」，成為縣名。這是聲音不變、漢字一直更換的例子。"],["愛知縣","豊橋","吉田→豊橋（1869）","舊稱「吉田」，1869年因與伊予吉田同名，為了區分，取豐川的橋，改稱「豐橋」。","","豐橋舊稱「吉田」，是三河國的吉田藩城下町。明治初期，全國有許多同名的「吉田」，為了避免混淆，1869年，新政府將這裡改名為「豐橋」。「豐」取自流過這裡的豐川，「橋」則是吉田大橋（豐橋）。這是為了避免重複而改名的例子。"],["愛知縣","豊田","挙母→豊田（1959）","1959年「挙母（ころも）市」改名為「豐田市」，取自當地企業豐田汽車。","","豐田市舊稱「挙母（ころも）市」。1959年，市議會決議改名為「豐田市」，以紀念與地方關係深厚的豐田汽車（トヨタ）。「トヨタ」的名字，又與創辦人的姓氏「豐田（トヨダ）」有關，而後來改成「トヨタ」（去濁音）。一家企業的名字，成了整座城市的名字，是相當少見的例子。"],["三重縣","三重","足が三重に曲がる（日本武尊）","《古事記》記載，日本武尊疲憊至極，說「我的腳像彎成三重」，這個地方便稱為「三重」。","","《古事記》裡，日本武尊東征歸來，走到這一帶時，已經疲憊不堪，他說：「我的腳，彷彿彎成三重一樣，非常累。」人們便把這個地方稱為「三重」。這是流傳很廣的由來，屬於傳說性質；縣名則是明治時期取自古代的三重郡。"],["三重縣","伊勢","伊勢（語源不詳）","「伊勢」的語源眾說紛紜，有「強風」說與「瀨（淺灘）」說等，至今沒有定論。","","伊勢是伊勢神宮的所在地，自古便是重要的聖地，但這個名字究竟是什麼意思，學者們沒有定論。有人說「いせ」與強風有關，也有人說與河流的「瀨」有關，還有其他說法。這是一個「名字比意義更有名」的地名。"],["三重縣","志摩","島（しま）","「志摩」來自「島（しま）」，因為這一帶是海岸曲折、島嶼眾多的地方。","","志摩半島的海岸線是典型的里亞斯式海岸，曲折蜿蜒，有許多小島。「志摩」的發音，一般認為就是「島（しま）」，奈良時代以好字令，用漢字「志摩」書寫。這是直接把地形變成名字的例子，「志摩」與「島」，根本是同一個詞。"],["三重縣","四日市","四の付く日の定期市","一般說法是每月逢「四」的日子（4日、14日、24日）舉辦定期市集，因而稱為「四日市」。","","日本中世紀時，各地會在固定的日期舉辦市集，稱為「定期市」，並以日期命名，如「四日市」、「八日市」、「十日市」。四日市是每月逢「四」的日子舉辦市集，因此得名。它後來成為東海道的宿場町與港口，現代也以工業與石化聞名。"],["滋賀縣","滋賀","志賀→滋賀（一說）","古稱「志賀」，一說「シガ」意指石多的湖岸，後改寫為「滋賀」。","","滋賀縣名來自古代的「志賀郡」。「しが」的語源，一說是「石（いし）が多い湖岸」；另有其他說法。後來的漢字「滋賀」，「滋」有滋潤、繁盛之意，是取好字的結果。縣名的由來，與琵琶湖的湖岸有關。"],["滋賀縣","近江","近つ淡海（ちかつあわうみ）","古稱「近つ淡海」，意為「近的淡水湖」，指琵琶湖；與「遠つ淡海（遠江，濱名湖）」相對。","","古代的近畿，人們稱琵琶湖為「淡海（あふみ）」，意為淡水的湖。因為琵琶湖離京城較近，稱為「近つ淡海」，簡稱「近江」；離京城較遠的濱名湖（今靜岡縣西部），則稱為「遠つ淡海」，也就是「遠江」。「近」與「遠」，是以京城為基準的稱呼。"],["滋賀縣","琵琶湖","琵琶の形","一般認為因湖的形狀像樂器「琵琶」而得名；古時稱為「淡海」、「鳰の海」。","","琵琶湖是日本最大的湖。古時候，人們稱它為「淡海（あわうみ）」或「鳰（にお）の海」。「琵琶湖」這個名字，一般認為是江戶時代以後才普及的，因為它的形狀很像樂器「琵琶」。另一說與湖中竹生島祭祀的弁才天有關，因為弁才天手持琵琶。"],["滋賀縣","彦根","天津彦根命（一說）","一說得名於神名「天津彦根命」，或彥根山；語源尚無定論。","","彥根城下的地名，一般說法是來自古代神明「天津彥根命（あまつひこねのみこと）」，或這位神明所在的「彥根山」。也有其他說法。1603年，井伊直繼開始築彥根城，這座城下町便以「彥根」為名。"],["滋賀縣","大津","大きな津（港）","「津」是港口，「大津」意為「大港」；667年天智天皇遷都到此，稱為「大津宮」。","","「津」在日文中是港口、渡口的意思。琵琶湖畔的大津，自古就是水運與陸運的匯合處，是一座「大的港口」。667年，天智天皇把都城遷到這裡，稱為「大津宮」。雖然只有短短幾年，卻讓「大津」的名字，留在了日本史上。"],["京都府","京都","みやこ（京＋都）","「京」與「都」都是「首都」之意，「京都」即「みやこ」；794年桓武天皇遷都，正式名稱為「平安京」。","","「京」與「都」，原本就是同一個意思：天皇居住的都城。所以「京都」二字，其實是「都都」——「みやこ」。794年，桓武天皇遷都於此，正式名稱是「平安京」（意為和平安寧之都）。直到明治時期，天皇遷往東京，京都仍然被稱為「京都」，也就是「那座原本的都」。"],["京都府","洛中","洛陽（中國都城）","「洛」取自中國都城洛陽，平安京被比喻為洛陽，「洛中」指京城之內，「洛外」指京城之外。","","平安京仿造中國唐代的長安與洛陽建造。人們用「洛陽」代稱京城，簡稱為「洛」，於是「洛中」是京城之內，「洛外」是京城之外，「上洛」意為進京。這些詞彙，至今仍出現在京都的地名與歷史書中。"],["京都府","上京","北為上（御所に近い）","平安京中靠近天皇御所的北側稱為「上京」，南側稱為「下京」，「上」指靠近御所。","","京都市的上京區與下京區，名稱與現代東京的「上京（前往東京）」無關。平安京的北邊靠近天皇所在的御所，因此稱為「上京」；南邊稱為「下京」。「上」與「下」，不是地勢的高低，而是與天皇距離的遠近。這與「前・中・後」離京城遠近的排列，是同一種思維。"],["京都府","祇園","祇園精舍（インドの寺）","取自印度佛教聖地「祇園精舍」，八坂神社舊稱「祇園社」，因此門前一帶稱為「祇園」。","","「祇園精舍」是釋迦牟尼在印度說法的著名精舍，由給孤獨長者捐建。平安時代，京都的八坂神社因為與佛教有關，曾被稱為「祇園社」。神社門前的街區，也就被稱為「祇園」。這是一個從印度傳到日本的名字。"],["京都府","伏見","伏水（地下水）（一說）","一說古稱「伏水」，指地下水豐富之地，後改寫為「伏見」，因水質好而成為釀酒名鄉。","","伏見以釀酒聞名。名稱的由來，一說是古時寫作「伏水」，因為這一帶地下水豐富，水在地下潛流（伏流）。後來寫成「伏見」。這個說法為一般說法，也有其他說法。豐富的地下水，正是伏見釀出美酒的關鍵。"],["大阪府","大阪","大坂→大阪（明治）","1496年蓮如在此建道場，稱「大坂」；明治初年改「坂」為「阪」，一說因「坂」拆開像「土に反る」，有不吉之意。","","1496年，淨土真宗的蓮如上人在上町台地的石山建起道場，稱為「大坂御坊」，「大坂」指的是這片高地上的一條大坡。明治初期，「坂」被改寫成「阪」。一說是因為「坂」可以拆成「土」和「反」，被認為有「土に反る（歸於塵土）」的不祥聯想，於是改用「阝」旁的「阪」。這個說法流傳很廣，但改字的原因，史料並不明確。"],["大阪府","難波","浪速（なみはや）（一說）","一說古稱「浪速（なみはや）」，意為波濤湍急的海，後音轉為「なにわ」，寫作「難波」。","","難波（なにわ）是大阪最古老的地名之一。一般說法是：古時這裡靠近海，海浪湍急，稱為「浪速（なみはや）」，發音轉為「なにわ」，再改寫成「難波」。「難」與「波」兩個字，後來也成為大阪的代名詞。也有其他說法，因此屬於「一般說法」。"],["大阪府","堺","三國の境（さかい）","「堺」是「境」的意思，因位於攝津、河內、和泉三國的交界，而稱為「堺」。","","堺市位於大阪灣岸，正好是攝津國、河內國、和泉國三國的邊界，古時稱為「境（さかい）」。後來這個地方發展成港口城市，成為戰國時代的自治都市，字面改寫成「堺」。這是一個直接寫著「邊界」的地名。"],["大阪府","梅田","埋田（うめだ）→梅田","舊稱「埋田」，指填平濕地而成的田地，因「埋」字不吉，改寫為「梅」，成為「梅田」。","","大阪的梅田，據說原本是一片濕地，人們把它填平成為田地，稱為「埋田（うめだ）」。「埋」字讓人聯想到埋葬，感覺不吉利，於是改為同音的「梅」，成為現在的「梅田」。這是「換字避諱」的典型例子。"],["大阪府","道頓堀","成安道頓の運河","1612年商人成安道頓開始挖掘運河，後人以他的名字稱為「道頓堀」。","","道頓堀是大阪最有名的繁華街區之一。它原本是一條運河，1612年，商人成安（安井）道頓出資開鑿，卻在大坂之陣中戰死，人們為了紀念他，將這條運河稱為「道頓堀」。「堀」是運河，因此這條運河，用一個人的名字命名。"],["大阪府","天王寺","四天王寺","「天王寺」是「四天王寺」的簡稱，指聖德太子所建的佛寺，供奉佛教守護神四天王。","","593年，聖德太子在此建造了四天王寺，供奉佛教的四大護法神——四天王。寺名簡稱為「天王寺」，寺院所在的區域也就叫做「天王寺」。這是以寺院命名地方的典型例子。"],["兵庫縣","兵庫","兵器の倉庫","「兵庫」原指存放武器的倉庫，古代在此地設置官方兵庫，後來成為地名與縣名。","","「兵庫」二字，字面意思就是「兵器的倉庫」。古代朝廷在今日神戶港附近設置了一座存放武器的官方倉庫，稱為「兵庫」，這一帶便被稱為「兵庫津」，逐漸成為地名。明治時期，這個名字被用作縣名，而神戶市則是縣廳所在地。"],["兵庫縣","神戸","神の戸（かんべ）","「神戸」原指供奉神社的民戶，此地的居民負責奉祀生田神社，因而稱為「神戸（かんべ）」。","","古代日本有一種制度：朝廷將一些「戶」（家庭）劃給特定的神社，讓他們專門供養神社，這些戶稱為「神戶（かんべ）」。神戶這個地方，是生田神社的神戶所在，因此得名，後來讀音轉為「こうべ」。1868年開港，神戶成為國際港口。"],["兵庫縣","淡路","阿波路（あわじ）","一說「淡路」意為「通往阿波（德島）的道路」，因此稱為「淡路（あわじ）」。","","淡路島位於瀨戶內海，是本州與四國之間的橋樑。「淡路」的語源，一般說法是「阿波路」，也就是「通往阿波國的道路」，後來寫成「淡路」。也有其他說法。這個名字，反映了島嶼作為交通中繼站的角色。"],["兵庫縣","六甲","武庫（むこ）（一說）","一說「六甲」由古代的「武庫（むこ）」音轉而來，後來寫成好字「六甲」。","","六甲山位於神戶北側。「六甲」的語源，一般說法是與「武庫」有關，因為這一帶古代稱為「武庫川」、「武庫山」。「むこ」的發音，逐漸轉為「ろっこう」，並以「六甲」二字書寫。這是「字面很像有意義，其實是借音」的一個例子。"],["奈良縣","奈良","平ら／楢／ナラ（多說並存）","語源沒有定論：一說「平らな土地（平す）」，一說「楢（なら）樹」，一說朝鮮語「ナラ（國、都）」。","","710年，元明天皇遷都到平城京，這個地方也稱為「奈良」。「なら」究竟是什麼意思，學者們的說法很多：一說是「平（なら）す」，指平坦的土地，因此也寫成「平城」；一說與「楢（なら）」樹有關；另一說是朝鮮語中意為「國、都」的「ナラ」。「奈良」二字，只是後來選定的好字。這是一個多說並存的地名。"],["奈良縣","大和","大倭→大和（757）","古稱「大倭（やまと）」，757年改為「大和」，取和平調和之意，成為日本的美稱。","","「やまと」原本寫作「倭」或「大倭」，一說語源與「山の戸（山的入口）」有關。757年，朝廷把「倭」字改成「和」，寫作「大和」，取其和諧之意。後來「大和」成為日本的別稱，如「大和民族」、「大和魂」。地名成了國名，是很罕見的例子。"],["奈良縣","飛鳥","飛ぶ鳥の明日香（枕詞）","「明日香」的枕詞是「飛ぶ鳥の」，人們因此把「飛鳥」二字讀為「あすか」。","","飛鳥時代的「飛鳥」，讀作「あすか」，原本的地名是「明日香」。在古代和歌中，「明日香」的前面常會加上「飛ぶ鳥の」，這是一種固定的修辭（枕詞）。日子久了，人們把「飛鳥」二字，也讀成了「あすか」。這是修辭變成地名的例子。"],["奈良縣","吉野","良き野（一說）","一般認為「吉野」意為「美好的原野」，「吉」是良好、吉祥之意。","","吉野以櫻花與山岳信仰聞名。「よしの」的語源，一般說法是「良き野（よしの）」，意為美好的原野。「吉」字則是吉祥的好字。這個名字反映出古人對這片山野的讚美與敬意。"],["奈良縣","橿原","橿（樫）の生い茂る原","據《日本書紀》，神武天皇在「橿原宮」即位，一般認為「橿」指橿樹（樫樹）叢生的原野。","","《日本書紀》記載，神武天皇在「橿原宮」即位，這是日本傳說中的第一位天皇。「橿」是一種橡樹科植物，「橿原」就是「橿樹生長的原野」。因此橿原神宮，也是日本建國神話的聖地。"],["奈良縣","斑鳩","イカルの鳥（一說）","一說因這一帶棲息很多名為「イカル（桑鳲）」的鳥，寫作「斑鳩」，讀「いかるが」。","","斑鳩是聖德太子建造斑鳩宮與法隆寺的地方。名稱的由來，一說是因為這裡棲息著許多「イカル（桑鳲）」這種鳥，因此稱為「いかるが」，並寫成「斑鳩」。另有其他說法，因此屬於「一般說法」。"],["和歌山縣","和歌山","岡山→和歌山（和歌浦）","一說原稱「岡山」，1585年豐臣秀長築城後，取和歌浦的「和歌」加上「山」，稱為「和歌山」。","","和歌山城建於「岡山」上，據說原本稱為「岡山」。1585年，豐臣秀長在此築城，一般認為，因為和歌浦是著名的歌枕（歌詠之地），所以取「和歌」二字，加上「山」，改稱「和歌山」。改名的細節，各種資料略有出入。"],["和歌山縣","熊野","隈（くま）の野","一般認為「熊」與動物熊無關，來自「隈（くま）」，意為深處、隱蔽之地，「熊野」即「深山的原野」。","","熊野是山岳信仰的聖地，也是熊野古道的所在地。名稱裡的「熊」，一般認為並不是動物，而是「隈（くま）」的借字，意思是深處、隱蔽的地方。「熊野」因此意為「深處的原野」，符合它深山幽谷的形象。"],["和歌山縣","高野山","高い野（山上の平地）","一說「高野」意為「高處的平原」，指山上的盆地；816年空海在此開創金剛峯寺。","","高野山位於紀伊山地，海拔約八百公尺，山頂上有一片平坦的盆地。「高野」字面意義是「高處的原野」，指的就是這片山上平地。816年，空海（弘法大師）獲得朝廷許可，在此開創真言宗的根本道場金剛峯寺。"],["和歌山縣","紀伊","木の国→紀伊","古稱「木の国（きのくに）」，意為樹木豐富的國度，後來以好字寫成「紀伊」。","","紀伊半島森林茂密，古稱「木の国」，意為多樹木的地方。奈良時代規定地名要用兩個好字，「木」便被改寫成「紀」，加上發音的補字「伊」，成為「紀伊」。也就是說，「紀伊」的意思，其實仍然是「樹木的國度」。"],["鳥取縣","鳥取","鳥取部（捕鳥的人）","一般認為源自古代負責捕捉鳥類獻給朝廷的氏族「鳥取部（ととりべ）」。","","「鳥取」的名稱，一般認為出自古代的「鳥取部」，這是一群專門捕捉水鳥（如白鳥）並獻給朝廷的氏族。《日本書紀》裡有一則故事：垂仁天皇的皇子因為看見白鳥而開口說話，捕獲白鳥的人因此受到獎賞，並被賜予「鳥取造」的姓氏。這是「職業變成姓氏、再變成地名」的例子，語源另有其他說法。"],["鳥取縣","境港","出雲と伯耆の境","位於出雲與伯耆兩國的邊界，是一座建在「境」上的港口，因而稱為「境港」。","","境港位於弓濱半島的前端，正好處在古代出雲國與伯耆國的交界上，人們便稱它為「境」，後來加上「港」。它與大阪的「堺」一樣，都是直接以「邊界」為名的地方。江戶時代，這裡是北前船停靠的港口，如今是日本海側重要的漁港。"],["鳥取縣","因幡","稲羽（語源不詳）","《古事記》寫作「稲羽」，「因幡」為後來的好字寫法；語源不詳，以「因幡的白兔」神話聞名。","","鳥取縣東部古稱「因幡國」。《古事記》裡，這個地方寫作「稲羽（いなば）」，是著名神話「因幡的白兔」的舞台。到了奈良時代規定用兩個好字書寫地名，於是改寫為「因幡」。至於「いなば」本身的意思，學者們沒有定論。"],["島根縣","島根","島の根（一說）","一說得名於「島根郡」，意為「島的根部（附近）」，指島根半島。","","島根縣名來自古代的「島根郡」，出現在《出雲國風土記》。一般說法是「島の根」，也就是島的根部，指那片像島嶼般突出的島根半島。這個名字，也有其他說法，因此屬於「一般說法」。"],["島根縣","出雲","八雲立つ出雲","《出雲國風土記》記載，八束水臣津野命說「八雲立つ」，於是稱為「出雲」；另有「厳藻（いつも）」等說法。","","出雲的名稱，最有名的由來出自《出雲國風土記》：偉大的神明八束水臣津野命看見天空湧起層層雲朵，說了「八雲立つ」，這個地方便稱為「八雲立つ出雲」。也有學者認為，「いづも」是「厳藻（いつも）」，意為神聖的水藻。無論哪一說，出雲都是與雲和神話緊緊相連的名字。"],["島根縣","隠岐","沖（おき）","「隠岐」一般認為是「沖（おき）」的借字，指遠在海上的島。","","隱岐諸島位於日本海上，離本土約五十公里。「おき」的語源，一般說法是「沖（おき）」，也就是離岸很遠的海面，這個名字是從本土的角度，稱呼遠在海上的那些島。後來借用「隠岐」二字書寫。"],["島根縣","玉造","玉を作る人々","「玉造」指製作勾玉等玉器的工匠集團，玉造溫泉一帶自古便是玉石的產地。","","古代日本人相當重視勾玉、管玉等玉器。島根縣的玉造溫泉，附近出產瑪瑙等玉石，因此聚集了許多製作玉器的工匠，稱為「玉造部」。「玉造」既是職業名稱，也成為了地名。"],["岡山縣","岡山","岡（丘）の山","一般認為得名於城所在的丘陵「岡山」，宇喜多秀家在此築城，城下町以此為名。","","岡山一名，最早指的是一座小丘陵。戰國時代末期，宇喜多秀家擴建岡山城，並發展城下町，這座丘陵的名字便成為整座城市的名稱。「岡」是丘，「山」也是丘陵的意思，合起來是「丘陵的山」。"],["岡山縣","倉敷","倉を敷く（蔵屋敷）","江戶時代此地是幕府直轄領，設有存放年貢米的倉庫，「倉敷」意為設有倉庫的地方。","","倉敷在江戶時代是幕府的直轄領（天領），倉庫用來存放年貢米，再從水路運往大阪。「倉敷」指的就是「設置倉庫的場所」。今日倉敷美觀地區裡那些白壁的倉庫建築，正是這段歷史留下的痕跡。"],["岡山縣","吉備","吉備國（備前・備中・備後）","古代「吉備國」分為備前、備中、備後三國，「吉備」也是桃太郎傳說的背景。","","古代的岡山與廣島東部，是一個強大的地方政權「吉備」。後來分為「備前、備中、備後」三國，同樣是以離京城的遠近排列。「吉備」的語源有多種說法，包括與「黍（きび）」有關的說法，至今沒有定論。傳說桃太郎的原型「吉備津彥命」，就是征討吉備地方的英雄。"],["岡山縣","児島","児島（かつては島）","「児島」原本是瀨戶內海上的島嶼，江戶時代因填海造田而與本州相連，名稱仍留著「島」。","","岡山縣的兒島，原本真的是一座島，位於瀨戶內海上，與本州之間隔著一條海峽。江戶時代開始，人們在這裡大規模填海造田，海峽變成了農田，兒島最後與本州相連。今日的兒島牛仔褲與大橋，都是從這段填海歷史延伸而來。"],["廣島縣","広島","広い島／広＋島（二說）","一說是太田川三角洲上的「廣闊之島」；另一說是取自毛利氏祖先大江廣元的「広」與福島元長的「島」。","","1589年，毛利輝元在太田川的三角洲築起廣島城，並命名這座城市。名稱的由來有兩種主要說法：一說是「廣闊的島」，形容三角洲上的沙洲平原；另一說是取毛利氏祖先大江廣元的「広」字，加上家臣福島元長的「島」字。1945年之後，「廣島」這個名字，也成為世界呼求和平的名字。"],["廣島縣","尾道","尾の道（一說）","一說得名於沿著山的「尾（山麓、山脊）」的道路，形容依山傍海的狹長城鎮。","","尾道位於瀨戶內海沿岸，城鎮沿著山坡與海岸線延伸，狹長而多坡道。一般說法是「尾の道」，「尾」指山的末端或山脊，也就是沿著山尾展開的道路。尾道自古就是瀨戶內的商港，也是眾多電影與文學作品的舞台。"],["廣島縣","宮島","厳島（斎き島）","正式名稱「厳島」，一般認為源自「斎（いつ）く島」，意為侍奉神明之島；通稱「宮島」，即神社之島。","","宮島的正式名稱是「厳島（いつくしま）」，語源一般認為是「斎く島」，也就是侍奉神明的島。島上的嚴島神社，以海上鳥居聞名。通稱「宮島」，字面意思是「有神社（宮）的島」。島上自古被視為神域，古時甚至不允許居民在島上出生或埋葬。"],["廣島縣","瀬戸内","瀬戸（狭門）の内","「瀬戸」來自「狹門（せと）」，指狹窄的海峽；「瀬戸內」即被海峽環抱的內海。","","「瀬戸」一般認為出自「狭門（せと）」，指兩片陸地夾著的狹窄水道。瀨戶內海被本州、四國與九州環繞，只有幾個狹窄的出入口與內部無數島嶼間的海峽，因此稱為「瀬戸の内」。這是一個以「水的通道」命名的海。"],["山口縣","山口","山の入口","一般認為「山口」意為山的入口，指通往山地的入口之處；大內氏在此建立城下町。","","「口」在日文地名中常指入口、出入處，如「河口」、「山口」。山口一帶位於通往內陸山地的入口，南北交通往來，14世紀後半，大內氏在這裡建立城下町，仿效京都，被稱為「西之京」。"],["山口縣","長門","穴門→長門","古稱「穴門（あなと）」，指關門海峽，後改為「長門」；「門」表示海峽的出入口。","","古代的山口縣西部稱為「穴門（あなと）」，指今日的關門海峽，「門」是出入口，這裡是本州與九州之間狹窄的海峽。到了奈良時代，地名改為好字，寫成「長門」。因此，「長門」二字，其實是「長長的海峽門戶」的意思。"],["山口縣","下関","関の下（海の関所）","「關」指海路的關口，瀨戶內有上關、中關、下關三個關港，下關位於西端。","","古代瀨戶內海的重要海路上，設有檢查船隻的關口，稱為「關」。其中山口縣的「上関」與「下関」，位置就在關門海峽兩端。下關舊稱「赤間関」，明治時期改名為「下関」。一般說法是：它是這條海路上位於「下（西）」的關口。"],["山口縣","萩","萩／端（多說並存）","一說因盛開的胡枝子（萩）而得名，另一說為「端（はぎ）」，意為邊緣之地；語源沒有定論。","","萩市位於山口縣北部的日本海沿岸。名稱的由來有多種說法：一說是這裡生長著許多胡枝子（萩）；另一說是「端（はぎ）」，也就是邊界之地。萩是長州藩的城下町，也是幕末志士輩出的地方，卻連自己的地名語源都沒有定論。"],["德島縣","徳島","渭津→徳島（蜂須賀）","舊稱「渭津（いのつ）」，蜂須賀氏入國後改稱吉祥字面的「徳島」，島指吉野川三角洲。","","德島舊稱「渭津（いのつ）」。1585年，蜂須賀氏入國後，在吉野川的三角洲上築起德島城，並把地名改為「徳島」。「徳」是德行、吉祥，「島」指河口三角洲上的島狀地形。改名的動機與經過，各種說法略有不同，一般說法是為了取好字。"],["德島縣","阿波","粟（あわ）の国","古稱「粟國」，因適合種植粟而得名，後改寫為「阿波」；德島的別稱「阿波」即此。","","德島縣古稱「粟國（あわのくに）」，「粟」是一種小米，這一帶土壤適合種植。奈良時代規定地名要用好字，於是改寫為「阿波」，發音維持不變。阿波舞（阿波おどり）與阿波藍等特產，也都冠著這個名字。"],["德島縣","鳴門","潮の鳴る門","「門」指海峽，鳴門海峽的潮流湍急，漩渦聲如鳴響，因而稱為「鳴門」。","","鳴門海峽位於淡路島與四國之間，潮水漲退時流速極快，形成壯觀的漩渦，並發出轟鳴之聲。「鳴門」二字，就是「潮聲鳴響的海峽」。這是一個用聲音替海峽命名的例子，與「穴門」、「長門」等地名同樣使用「門」表示海峽。"],["香川縣","香川","香川（一說）","一說得名於古代的「香川郡」，「香」有芳香、優美之意；語源尚有其他說法。","","香川縣名來自古代的「香川郡」，是奈良時代就有的郡名。「かがわ」的語源，一般說法是「香」與「川」的組合，形容一條有芳香的河（香東川）；也有其他說法。縣名在明治時期確定，是日本面積最小的縣。"],["香川縣","金毘羅","梵語クンビーラ（鰐の神）","「こんぴら」源自梵語「クンビーラ」，意為鱷魚神，是古印度恆河的守護神，被視為航海守護神。","","香川縣的金刀比羅宮，一般稱為「こんぴらさん」。「こんぴら」源自梵語「Kumbhīra（クンビーラ）」，意思是鱷魚，是印度恆河的守護神。這位神明傳入日本後，成為保佑航海安全的神。因為瀨戶內海的船夫深信不疑，「こんぴら參拜」成為江戶時代最受歡迎的旅行之一。"],["香川縣","丸亀","丸い亀（亀山）","一說因城所在的亀山形狀像圓圓的烏龜（丸い亀），而稱為「丸亀」。","","丸龜城建在一座小山「亀山」上，這座山遠看像一隻趴著的烏龜。一般說法是：因為山形圓圓的像龜殼，所以稱「丸い亀」，也就是「丸亀」。這座城以日本最高的石垣之一聞名。"],["香川縣","屋島","屋根のような島","屋島山頂平坦，形似屋頂，古時是島，江戶時代起因填海而與本州相連。","","屋島是一座山頂平坦的台地，遠看像一座屋頂，因此稱為「屋島」。古時它真的是一座島，與本州之間隔著海峽，後來因為填海造田，才與陸地相連。1185年，源平合戰中的屋島之戰，就發生在這裡。"],["愛媛縣","愛媛","愛比売（古事記の国生み）","《古事記》的國生神話裡，四國的伊予被稱為「愛比売（えひめ）」，意為可愛的姑娘。","","《古事記》記載，伊邪那岐與伊邪那美生下四國這座島時，島有一個身體、四張臉，每一張臉都有名字：伊予國叫做「愛比売（えひめ）」，意為可愛的姑娘；讚岐叫「飯依比古」；粟國叫「大宜都比売」；土左叫「建依別」。明治時代，縣名就從這段神話裡選取，成為「愛媛」。"],["愛媛縣","松山","勝山→松山（一說）","一說加藤嘉明築城時，將「勝山」改名為「松山」；語源另有其他說法。","","松山是愛媛縣的縣廳所在地。1602年，加藤嘉明開始在「勝山」築城，城下町後來稱為「松山」。一般說法是：因為這座山上松樹很多，於是改稱「松山」，也有其他說法。無論如何，這座城池的名字，後來成為整座城市的名稱。"],["愛媛縣","今治","今＋治（新墾）（一說）","一說「今治（いまばり）」意為新開墾的土地，「今」是新，「治（はり）」是開墾。","","今治位於瀨戶內海沿岸，以造船與毛巾聞名。「いまばり」的語源，一般說法是「今（新）」加上「墾（はり）」，也就是新近開墾的土地。江戶時代初期，藤堂高虎在此築今治城，發展為城下町。這個說法為一般說法，也有其他說法。"],["高知縣","高知","河中山→高智→高知","山內一豐築城的山原稱「河中山」，因水患而嫌不吉，改為「高智山」，後寫成「高知」。","","1601年，山內一豐在大高坂山築城。這座山被稱為「河中山」，但因為河川多次氾濫，「河中」聽起來像是被河水淹沒，很不吉利，於是改為「高智山」，後來又寫成「高知」。這是「避諱＋換字」的例子，名字的改變，反映了當時人對水患的恐懼。"],["高知縣","四万十","語源不詳（俗說：支流四萬十）","語源沒有定論，有「支流有四萬十條」的俗說，也有阿伊努語、古語等其他說法。","","四萬十川被稱為日本最後的清流。名稱的由來至今沒有定論。有一個有趣的俗說是：它的支流數目據說有「四萬十條」，所以叫「四万十」，但實際上支流沒有這麼多。也有學者從古語或其他語言中找語源，至今尚無定論。"],["高知縣","桂浜","月と桂（一說）","一說因傳說月亮裡長著桂樹，桂濱是賞月名所，因而稱為「桂浜」。","","高知市的桂濱是賞月的名勝，流傳著「月亮裡有一棵桂樹」的說法。一般說法是：這片海灘因為月光皎潔，人們便借用月中桂樹的故事，稱它為「桂浜」。也有其他說法，因此屬於「一般說法」。"],["高知縣","室戸","室の戸（洞窟の入口）（一說）","一說「室」指洞窟、「戸」指入口，「室戸」是空海修行洞窟的入口；語源另有其他說法。","","室戶岬突出於太平洋，岬角附近有許多海蝕洞窟。傳說年輕的空海曾在這裡的洞窟修行，看見的只有天空與海洋，因此他的法號取為「空海」。「室戸」的語源，一般說法是「室（洞窟）的戶（入口）」，也有其他說法。"],["福岡縣","福岡","備前福岡（黒田氏ゆかりの地名）","1601年黑田長政築城時，以黑田氏祖先發跡的備前國福岡（今岡山縣）為名，把地名「搬」了過來。","","1601年，黑田長政因關原之戰的戰功獲封筑前國，開始在那珂川西岸興建新城。他把這座城命名為「福岡」，因為黑田氏一族的發跡地，是備前國的「福岡」（今岡山縣瀨戶內市一帶）。這是把地名「移植」到新土地上的例子。河對岸原本就有商人聚集的港町「博多」。1889年設市時，市名在「福岡」與「博多」之間有過爭論，最後定為「福岡市」，「博多」則保留在車站與港灣的名字裡。"],["福岡縣","北九州","五市合併（1963）","1963年門司、小倉、若松、八幡、戶畑五市合併，為了不偏袒任何一個舊市名，選用區域名「北九州」。","","1963年，門司、小倉、若松、八幡、戶畑五個市合併為一座新市。因為任何一個舊市名都不適合代表其他四市，新市選用了地理名稱「北九州」——九州的北部。與福島縣的「いわき」一樣，這是為了避免偏袒任何一方而選出的名字。"],["福岡縣","太宰府","大宰府（九州の役所）","古代朝廷統轄九州與外交事務的機構「大宰府」所在地；「太宰府」為後世的寫法。","","「大宰府」是古代朝廷設在九州的地方機構，負責統轄九州並處理外交事務，被稱為「遠の朝廷（とおのみかど）」。這座官署所在的地方，就以官署的名字稱呼。後來，地名的寫法變成「太宰府」，與官署的「大宰府」略有不同。菅原道真被貶謫到這裡，日後被供奉為學問之神。"],["福岡縣","筑豊","筑前＋豊前","「筑豊」取自筑前國的「筑」與豊前國的「豊」，合成一個新地名，指兩國交界的煤礦地帶。","","筑豊曾是日本最大的煤田之一。它並不是古代的地名，而是近代人把「筑前」的「筑」與「豊前」的「豊」合起來，作為煤田地帶的稱呼。這種「兩個舊國名各取一字」的合成地名，在日本並不少見，例如「房総」。"],["佐賀縣","佐賀","栄の国（楠の巨木）","《肥前國風土記》記載，因楠樹茂盛而稱為「栄の国（さかのくに）」，之後寫作「佐嘉」、「佐賀」。","","《肥前國風土記》記載了一個故事：景行天皇巡視時，這裡有一棵巨大的楠樹，樹蔭下繁榮興旺，因此稱這個地方為「栄の国（さかのくに）」。「さか」的音，後來寫成「佐嘉」，再演變成「佐賀」。這是從一棵樹的興盛，變成一個縣名的例子。"],["佐賀縣","唐津","唐へ渡る港","「津」是港口，唐津是通往大陸（唐）的港口，是古代對外交流的玄關。","","唐津位於九州西北端，隔海面對朝鮮半島與中國大陸。「唐」在古代日本泛指中國與朝鮮半島，「津」是港口，唐津就是「通往唐的港口」。這裡自古以來是連結日本與大陸的門戶，也是唐津燒等陶瓷文化的發祥地。"],["佐賀縣","鳥栖","鳥の栖（一說）","一般認為與「鳥的巢」有關，「栖」是棲息之地，指鳥聚集棲息的地方。","","鳥栖是九州的交通要衝，鐵路與公路在此交會。名稱的由來，一般說法是「鳥の栖」，意為鳥的棲息之地，可能是古代這裡是鳥類聚集的沼澤或森林。至於是否與其他語源有關，也有不同說法。"],["長崎縣","長崎","長い岬（一說）","一般說法是「長長突出的岬角」；長崎氏則是以地名為姓的豪族，1571年開港成為南蠻貿易港。","","長崎的名字，一般認為來自地形：海岸邊有一片細長突出的岬角，稱為「長い崎（ながいさき）」。中世紀時，這裡有一位叫長崎氏的豪族，他們是以地名為姓，而不是地名來自姓氏。1571年，大村純忠與葡萄牙人合作開港，長崎成為南蠻貿易的港口，也是江戶時代日本唯一對外開放的窗口。"],["長崎縣","出島","海へ突き出した人工島","1634年為了集中管理外國人而填築的人工島，形似扇形，故稱「出島」。","","1634年，江戶幕府為了集中管理來到長崎的葡萄牙人，命令商人出資，在長崎港內填築一座扇形的人工島。由於這座島是「突出」到海裡的，因此稱為「出島」。1641年荷蘭商館遷到這裡之後，出島成為江戶時代日本唯一對西方開放的窗口。"],["長崎縣","雲仙","温泉（うんぜん）","古稱「温泉山（うんぜんさん）」，音讀「温泉」，後來改用「雲仙」，意象更優美。","","雲仙的溫泉在江戶時代已經很有名，山被稱為「温泉山」，音讀就是「うんぜん」。後來，為了取好字，人們把音讀寫成「雲仙」，讓這個名字多了仙人乘雲的意象。這是「先有聲音、後換漢字」的例子，「雲」與「仙」原本並不是地名的意思。"],["長崎縣","五島","五つの主な島","五島列島由福江、久賀、奈留、若松、中通五座主要島嶼組成，因此稱為「五島」。","","五島列島位於長崎縣西方海上，包含大小一百四十多座島嶼。其中五座主要的島嶼是福江島、久賀島、奈留島、若松島與中通島，因此被稱為「五島」。這是「直接用數字描述地形」的地名。"],["長崎縣","対馬","対の島／津の島（二說）","一說因上島與下島兩座島嶼相對而稱「対」，另一說是「津（港）之島」；語源尚無定論。","","對馬位於日本與朝鮮半島之間，是古代往來大陸的重要中繼站。語源的說法有多種：一說是島分成上、下兩座，相對而立，所以稱為「対の島」；另一說是「津（港）の島」，指港口很多的島。「対馬」二字則是後來選定的書寫。至今沒有定論。"],["熊本縣","熊本","隈本→熊本（加藤清正）","原稱「隈本」，加藤清正築城時改為「熊本」；一說因「隈」字與「畏」相通，改用勇猛的「熊」。","","熊本中世紀稱為「隈本」，「隈」有山谷彎曲處、深處的意思。1607年前後，加藤清正築起熊本城，並將地名改為「熊本」。一般說法是：「隈」聽起來像「畏（畏懼）」，感覺不夠有力，而「熊」則有勇猛的意象，因此改用「熊」。改名的細節，各種資料的說法略有出入。"],["熊本縣","阿蘇","阿蘇（語源不詳）","阿蘇的語源沒有定論，有火山相關等說法；神話中說健磐龍命踢破湖岸，讓湖水流走，開闢出平原。","","阿蘇山是世界最大級的火山口（カルデラ）之一，火山口內還有城鎮與農田。「あそ」的語源，學者們沒有定論。當地有一則神話：神明健磐龍命將湖水踢破，讓水流出去，才開闢出今日的阿蘇盆地。這則神話並不是地名的由來，卻是阿蘇人講述土地形成的方式。"],["熊本縣","球磨","隈（くま）：奧深之地（一說）","一般認為「球磨」是「隈（くま）」的借字，指四面被群山環抱、偏遠幽深的谷地。","","球磨川流域的球磨盆地，被九州山地圍繞，古代是相對偏遠的地方。「くま」一般認為是「隈」，指彎曲處、深處、被遮蔽的地方。與和歌山的「熊野」同樣，「くま」並不是動物的熊。這也讓「熊本」的「熊」，在地名的世界裡，別有一層意義。"],["大分縣","大分","碩田（おおきた）","《豐後國風土記》記載，景行天皇看見廣闊肥沃的土地，說「碩田（おおきた）」，後來音轉為「大分（おおいた）」。","","《豐後國風土記》記載，景行天皇來到這裡，看見平坦廣闊的田地，稱讚這是「碩田（おおきた）」，意思是巨大而肥沃的田。「おおきた」後來音轉為「おおいた」，並寫成「大分」。「分」在這裡讀作「いた」，是一個特殊的讀法。"],["大分縣","由布","木綿（ゆう）","由布岳的「由布」取自「木綿（ゆう）」，指以楮樹纖維織成的布，山雲繚繞如白布。","","由布岳是大分縣的象徵，山頂常被雲霧覆蓋。「由布」一般認為來自「木綿（ゆう）」，這是古代祭祀時使用的、用楮樹纖維織成的白布。雲霧繚繞的山頂，就像掛著一條白布，這也是由布院溫泉的名稱來源。"],["大分縣","国東","国の先（くにさき）","「くにさき」一般認為意為「國家的前端」，指突出於海中的半島，漢字卻寫作「国東」。","","國東半島呈圓形突出於瀨戶內海，形狀像一個大圓盤。「国東」的讀音是「くにさき」，而不是字面上的「くにひがし」。一般認為，「くにさき」是「国の先」，意為國土的最前端，「国東」二字是後來的書寫。這是「讀音與字面差很多」的例子。"],["宮崎縣","宮崎","宮の崎","一般認為是「宮（神社）所在的崎（台地）」，指供奉神武天皇的宮崎神宮一帶。","","宮崎縣名來自宮崎郡，其中心是宮崎神宮，供奉著日本第一代天皇神武天皇。「宮」是神社，「崎」是突出的台地或岬，「宮崎」因此是「神社所在的高地」。地名與神話、天皇的東征傳說緊緊相連。"],["宮崎縣","日向","日に向かう国","「日向」意為「面向太陽的地方」，指面向東方、日出之地的國度。","","宮崎縣古稱「日向國（ひむかのくに）」，意思是「面向太陽的國度」。這裡朝東面向太平洋，清晨第一道陽光最早照亮這片土地。奈良時代，「ひむか」被寫成「日向」，後來讀音轉為「ひゅうが」。這是一個把方位與日出寫進名字的地方。"],["宮崎縣","高千穂","高い千の稲穂（一說）","一說「高千穂」指高處的千枝稻穗，與天孫降臨神話有關；另一說指聳立的山峰。","","高千穗是日本神話中天孫降臨的舞台：天照大神的孫子瓊瓊杵尊，從天而降，來到這片山地。地名的語源，有一說是「高千穂」，意思是「高處的、千枝的稻穗」，象徵豐收；另一說認為是指高聳的山峰。這兩種說法，都沒有得到完全證實。"],["宮崎縣","都城","都之城（島津荘の中心）","中世紀島津荘的政所所在地，稱為「都之城」，簡稱「都城」，意為莊園的中心。","","「都城」聽起來像是古代的都城，其實不然。中世紀，這裡是島津荘的中心，設有政所（管理莊園的機構），人們稱為「都之城（みやこのじょう）」，意為「莊園之都」。後來簡稱為「都城」。這個名字，是「權力中心」的縮影。"],["鹿兒島縣","鹿児島","鹿の子／水手（多說並存）","語源有多種說法：桜島上鹿多（鹿之子）、「水手（かこ）」船夫之島、火山相關等，尚無定論。","","鹿兒島的語源眾說紛紜。一說是桜島上有許多鹿，「鹿の子」遠看斑斑點點，因而稱為「鹿児島」；另一說是「かこ」，即水手、船夫的意思，這裡是船夫聚集的港灣；也有人認為與火山、崖壁相關。至今沒有定論。"],["鹿兒島縣","桜島","咲耶（さくや）姫（一說）","一說因供奉木花咲耶姬而稱為「桜島」，「さくや」轉為「さくら」；並非因為櫻花。","","桜島是鹿兒島灣中活躍的火山。有趣的是，「桜」一般認為並不是指櫻花，而是來自供奉木花咲耶姬的神社，「さくや」逐漸轉成「さくら」。也有其他說法，因此屬於「一般說法」。原本的名字是「鹿児島」，後來才被用來稱呼這座島。"],["鹿兒島縣","種子島","多禰→種子（語源不詳）","古稱「多禰（たね）」，奈良時代改用好字「種子」；1543年葡萄牙人在此傳入鐵砲。","","種子島古稱「多禰」，奈良時代規定要用好字，於是改寫為「種子」。「たね」的語源不明，沒有定論。1543年，一艘載著葡萄牙人的船漂流到這座島上，將鐵砲傳入日本。這一年，這座小島的名字，成為日本歷史轉折點的代名詞。"],["鹿兒島縣","霧島","霧の島（霧の中に浮かぶ山）","一般認為，霧島山群在雲霧繚繞時，遠看像浮在霧海中的島，因而稱為「霧島」。","","霧島山是由二十多座火山組成的山群，橫跨鹿兒島與宮崎兩縣。山頂常被雲霧覆蓋，遠看彷彿一座浮在霧海上的島嶼。「霧島」二字，即是這個景象的直接描述，是一個由視覺印象命名的地名。"],["鹿兒島縣","指宿","湯豊宿（ゆぶすき）（一說）","一說為「湯豊宿（ゆぶすき）」，意為溫泉豐富的宿場，後轉為「いぶすき」，寫作「指宿」。","","指宿以砂蒸溫泉聞名，人們埋在溫熱的黑砂裡，享受地熱。「いぶすき」的語源，一般說法是「湯豊宿（ゆぶすき）」，意思是溫泉豐富的地方，後來音轉為「いぶすき」。也有其他說法。「指宿」二字，是後來選定的當字。"],["沖繩縣","沖縄","阿児奈波／沖な は（漁場）（一說）","古書寫作「阿児奈波」，江戶時代新井白石在《南島志》使用「沖縄」；語源一說為「沖の漁場（ナハ）」。","","「沖縄」讀作「おきなわ」，琉球語自稱為「ウチナー」。8世紀，鑑真東渡日本的傳記《唐大和上東征傳》，把這片島嶼寫作「阿兒奈波」；江戶時代，學者新井白石在《南島志》（1719年）中使用「沖縄」二字，之後逐漸定著。語源方面，沖繩學之父伊波普猷提出一說：「おきなわ」是「沖の漁場（沖なは）」，也有其他說法，至今沒有定論。"],["沖繩縣","琉球","流求→琉球（中國史書的稱呼）","「琉球」原本是中國史書對這片島嶼的稱呼，明代起成為王國的名稱；當地人自稱「ウチナー」。","","「琉球」最早以「流求」的寫法出現在中國的《隋書》中。至於《隋書》裡的「流求」究竟指的是沖繩還是台灣，學界有不同意見。14世紀後半，明朝使者來到沖繩，招諭當地的中山王，此後「琉球」二字成為王國對外的名稱，稱為「琉球王國」。也就是說，「琉球」最初是外人取的名字，當地人稱自己為「ウチナー」。"],["沖繩縣","那覇","浮島（那覇＝ナハ）","古稱「浮島」，是海中的島嶼，15世紀築長虹堤與首里相連；「那覇」的語源一說是「漁場、港」。","","那覇在古代被稱為「浮島」，因為它曾是一座浮在海灣中的小島。1452年，人們築起一條稱為「長虹堤」的堤道，把它與首里連在一起，那覇因此成為琉球王國的港口，與中國、東南亞的船隻往來密切。「那覇（なは）」的語源，一般說法是琉球語中意為「漁場、港」的詞，「那覇」二字是後來的當字。"],["沖繩縣","首里","スイ（首里）（一般認為）","琉球語稱「スイ」，漢字寫作「首里」，一般認為取「首（頭、首都）」之意，是琉球王國的王都。","","首里是琉球王國的王都，首里城所在的地方。琉球語裡，首里被稱為「スイ」。「首里」二字，一般認為是「首（頭、首都）」與「里（村落）」的組合，意指「首府之里」。不過，有關「スイ」本身的語源，也有其他說法，沒有定論。首里城在歷史上幾度毀於火災，也數度重建，是琉球人共同的記憶。"],["沖繩縣","八重山","ヤイマ（古稱）","古稱「ヤイマ」，漢字寫作「八重山」；「八」是眾多，「重」是重疊，形容群山重疊。","","八重山諸島包括石垣島、西表島、與那國島等，位於日本最南端。當地古稱為「ヤイマ」，後人以好字寫成「八重山」，字面意思是「重重疊疊的山」，形容這裡的山勢與海景。這是「先有聲音、後有漢字」的一個例子。"],["沖繩縣","西表","西（いり）の方","琉球語稱日落的西方為「いり」，「西表」意為「西邊的一方」，與東邊的「東表（あがりおもて）」相對。","","琉球語裡，東方稱為「あがり」，因為太陽從東方升起（上がる）；西方稱為「いり」，因為太陽從西方落下（入る）。西表島的名字「西表（いりおもて）」，就是「西邊的一方」，與石垣島相對。這是把太陽的路徑寫進地名的方位詞。"],["沖繩縣","久高島","久高（語源不詳）／神の島","語源不詳；相傳是琉球開闢神話中，創世女神「アマミキヨ」最初降臨的島，因此稱為「神之島」。","","久高島位於沖繩本島東南方，島上至今保留著許多古老的祭祀。琉球神話裡，創世女神「アマミキヨ」從海的另一邊來到這裡，開始創造琉球。「久高」二字的語源不詳，也可能只是當字。這座島的重要不在名字，而在它被視為聖域、被人們代代守護。"],["沖繩縣","浦添","浦襲い（うらおそい）（一說）","一說「浦添」源自琉球古歌謠中的「浦襲い（うらおそい）」，意為「統治海灣」；浦添城曾是王都。","","浦添位於那覇北側，13世紀時，浦添城曾是琉球中山王的居城，比首里更早成為王都。一般說法認為，「浦添」出自古歌謠《おもろさうし》裡的「うらおそい（浦襲い）」，意思是統治海灣的地方。也有其他說法，因此屬於「一般說法」。"],["沖繩縣","グスク","城（ぐすく）","琉球語稱「城」為「グスク」，指以石垣圍成的城砦或聖域，語源有多種說法。","","琉球各地散布著許多「グスク」，讀作「ぐすく」，漢字寫作「城」，例如「今帰仁城」、「首里城」。它們是以石垣圍成的城砦，同時也常是聖域，裡頭有祭祀的場所。「グスク」的語源，有城砦、聖域、石垣等多種說法，沒有定論。琉球的「城」與本州的「城」，是不同文化的產物。"],["沖繩縣","御嶽","ウタキ（聖域）","「御嶽（うたき）」是琉球的聖域，多是森林中的一處祭祀場所，不一定是山，漢字「嶽」是借用的。","","在琉球信仰中，「ウタキ」是神明降臨、村人祭祀的聖域，通常是一片森林或一處岩石，不一定是山。漢字寫作「御嶽」，是借用本州的字面，但「ウタキ」在意義上，更接近「聖域、神聖的場所」。許多御嶽只有女性祭司（ノロ）可以進入。這是一個把宗教空間直接變成地名的例子。"],["沖繩縣","間切","マギリ（行政區）","「間切（まぎり）」是琉球王國的行政區劃，大致相當於今日的町村，一般認為意為「劃分出來的區域」。","","琉球王國時代，全國被劃分為若干「間切（まぎり）」，每個間切有自己的首長「地頭」，大致相當於今日的町或村。「間切」二字的語源，一般說法是「劃分土地、切分出來的區域」。今日沖繩許多地名，仍保留著間切時代的痕跡。"]];

// 判斷「我」與「對方」的關係：好友／競爭對手／初次見面（雙向檢查兩邊各自寫的 friend／rival 敘述）
function relationBetween(meKey, otherKey){
  const me = CHAR_BY_KEY[meKey], other = CHAR_BY_KEY[otherKey];
  if (!me || !other) return "stranger";
  if ((me.friend && me.friend.indexOf(other.name)!==-1) || (other.friend && other.friend.indexOf(me.name)!==-1)) return "friend";
  if ((me.rival && me.rival.indexOf(other.name)!==-1) || (other.rival && other.rival.indexOf(me.name)!==-1)) return "rival";
  return "stranger";
}

function pairScriptKey(k1, k2){
  const order = PLAYER_CHARS.map(c=>c.key);
  const i1 = order.indexOf(k1), i2 = order.indexOf(k2);
  return (i1 < i2) ? (k1+"_"+k2) : (k2+"_"+k1);
}
